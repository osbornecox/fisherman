// ---------- scenes.js: the living scenes engine, put here by should_I_lab/art/anim/to_game.py; change it there ----------
// Living scenes: the engine of the ambient animation in «Уйти или остаться», and its reference.
//
// One clean picture per place (its overcast scene). For a place, a weather and an hour a still layer is computed
// once: the weather painted by code the way art/tools/weather.py paints it (the same random numbers, so the still
// parts match the baked pictures pixel for pixel), then lit for the hour the way the game lights it (daylight block).
// Each tick copies that layer and lets a few small effects draw what moves; only the pixels they touch are lit again.
// Everything that moves is a function of the time and the scene's seed alone: no Math.random. The engine decides

//

//     (village.py); those two have no signs, no life and no rod, only their weather, their light and what moves of
//     itself. src is the URL of the place's clean picture, 130 wide and as tall as LiveScenes.SIZE[place] says (180,
//     the title screen 281, the whole phone screen), a data: URI or a same-origin URL: it is loaded with an Image,
//     analysed once and cached by place and src. baked is the demo's ?baked=1 check: weather.py's picture, unlit,
//     nothing moving. t is the time the scene starts at, in seconds: a scene that takes over from another (a new hour,
//     a new place) starts at that one's `time`, so nothing in it jumps. The canvas is made 130 wide and as tall as the
//     place's picture (again whenever the scene's place changes to one of another size) and only ever gets
//     putImageData; until the picture is analysed it is left as it is (transparent), so an <img> under it shows. With
//     autoplay the scene plays at 12 ticks a second, unless the system asks for reduced motion; otherwise it draws one

//     and the place; in sun the bubbles keep clear of the hour's glints, so there the hour picks too), never by the
//     float, at an uneven pace of its own: a splash every 5-9 s, a boil every 1-2 s, a chain of bubbles every 6-10 s,
//     midges all the time. The first show comes about 0.6 to 2.7 s after the signs are given (a boil's within 1.2 s,
//     the midges' at once; create, or a set() that changes the signs or the seed). Only on the waters (river, omut,
//     lake); never with baked. With reduced motion and nothing playing each sign is drawn still, at its first site.
//     life is the hour's drawn life around the water, as the game picked it for the journal: {kind: id} (or the id), one
//     of LiveScenes.LIFE[place], e.g. a log drifting down the river. It is in sight from the start, plays out slowly by
//     the time since it was given (create, or a set() that changes the life, the seed or the place) and the seed, and
//     comes again only after a long pause. Only on the waters; never with baked; with reduced motion and nothing playing
//     it is drawn still, as it starts.
//     lilies: true opens the omut's water lilies for the hour (the summer hours between «Раскрылись кувшинки» and
//     «Кувшинки закрылись», which are the lives 'lilies-open' and 'lilies-close'; with reduced motion those are drawn as

//   scene.set({place, weather, hour, src, baked, lit, seed, signs, life, lilies}): any of them; the clock goes on.
//   scene.play(), scene.pause(), scene.playing.

//     cannot (bad input, destroyed).
//   scene.at(t): pause and draw the frame of t seconds, as the demo's ?t=…&pause=1 does.
//   scene.event(kind) -> a promise: a one-shot over the scene from its next even tick, resolved true when it is over;
//     false at once if the scene cannot show it (not a water, baked, nothing drawn yet, an unknown kind), or when it is
//     cut short (another event, a set() that changes the scene, destroy()), and then nothing of it stays drawn.

//     the water again. No fish is drawn.

//     frame by the wall clock (with reduced motion the scare as one still frame); at() steps it with the scene's ticks.

//     LiveScenes.DAY = {first, last, litFrom}: the game lights the izba with these, so the light is written once.
//   LiveScenes.SIGNS: [{kind, variant?, name}], every sign a scene draws, name a short Russian label (the demo's).
//   LiveScenes.LIFE: {river: [id, ...], omut: [...], lake: [...]}, the life each water draws, and LIFE_NAME: {id: a
//     short Russian label} (the demo's). The journal line each id draws is by it in LIFE below.
//   LiveScenes.EVENTS: {strike: {frames: [ms, ms, ms], ms}, scare: {ms}}, how long the one-shots take.
//   LiveScenes.SIZE: {place: [width, height]}, the size of each place's picture.

//

// every tick, and while nothing plays a slow look does, every 2 s and soon after a create() or set(). A canvas that
// has not been in the page yet is left alone, so a page can make the scene first and add its canvas later. Scenes
// kept apart in iframes do best with one engine: scenes.js loaded once, in the parent, and given each iframe's canvas
// (an engine in each of 31 iframes took two to three times the main thread's time of one engine drawing the same 31).
//
// The game carries a copy of this file: to_game.py puts it into the game's index.html. There each outdoor place is a
// scene on a canvas, in one of two layers; a new hour or place is a new scene that starts at the `time` of the one
// shown and fades in over it for 600 ms, then the old scene is destroyed. The canvas is scaled to the full width and
// stands on the bottom edge. The izba stays a drawn picture (izba.py's room, its mask), lit with dayLight().

'use strict';

const PLACES = ['home', 'shop', 'river', 'omut', 'lake', 'splash', 'story'];   // weather.py's SCENES order: its seeds
                                                                              // depend on it, so a new place goes last

// ---------- the pictures: how tall each is, and where its sky, its water and its weather lie ----------
// weather.py's GEO, point for point: change both, then check with ?baked=1. pix.py's five places share PIX: 130x180, the
// sky in pix.C's sky colours above row 92, the water in its water colours from row 84. The title screen (splash.py) and
// the backstory's village from the hill (village.py) are painted in gradients of their own, so they tell their sky and
// their river by rows and edges: everything above a row that is not the forest in front of it, everything between two
// rows or two edges that is not what stands in the river.
//   h: the height. sky: {rows, c} (the colours c above row `rows`) or {rows, not} (all but those). water: {rows: [y0, y1],
//   c} or {rows, not} (rows y0..y1 - 1), or {edges: [far, near], x0, not}: from column x0 on, between the far and the near
//   edge's rows (village.py's FAR_EDGE and NEAR_EDGE with its lerp_pts and round). bands, rain: the rows where the sun's
//   and the wind's sky (bands), and the drizzle's and the downpour's (rain), turn to the next band. glow: [y0, n], the
//   hour's glow grows from row y0 over n rows towards the horizon (daytime.py). fog: [y0, banks], the fog thins from row
//   y0 down to the bottom; banks, its three dithered banks of rows [a, b). sun: where weather.py's own sun stands
//   (?baked=1); arc: the sun's path by the hour, [x0, dx, y0, dy]: from x0 at 6:00 to x0 + dx at 18:00, low at row y0
//   and dy rows higher at noon (daytime.py's sun_path). caps: [y0, n], the whitecaps grow denser from row y0 over n rows
//   towards the near bank.
//   The engine's own: clouds(seed), the overcast clouds the picture was drawn with, replayed with its random numbers
//   (they drift); cloudC, their colours; clear(y), the sky under them on row y.
const gradient = (a, b, t) => pack(Math.trunc(a[0] * (1 - t) + b[0] * t), Math.trunc(a[1] * (1 - t) + b[1] * t),
                                   Math.trunc(a[2] * (1 - t) + b[2] * t));   // splash.py's and village.py's mix()
function lerpPts(pts, x) {   // village.py's lerp_pts: the row of a polyline at column x
  for (let i = 0; i + 1 < pts.length; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    if (x0 <= x && x <= x1) return y0 + (y1 - y0) * (x - x0) / Math.max(1, x1 - x0);
  }
  return x > pts[pts.length - 1][0] ? pts[pts.length - 1][1] : pts[0][1];
}

// The wind's gusts. A gust is a soft, wide wave of wind crossing the scene downwind (left to right): its front wanders
// row by row and its strength is uneven down the scene, so no edge of it is straight. Nothing of it is drawn; what it
// passes bends further and settles back (see the wind's effects). One chance of a gust every GUST_EVERY s, missed at

// px from the glass over which the window's light fades, each [dawn and dusk, noon]; less with the curtain drawn (far

  4:'XX.XX XX.XX XX.XX XXXXX ...XX ...XX ...XX', 5:'XXXXX XX... XXXX. ...XX ...XX XX.XX .XXX.',
  6:'.XXX. XX... XX... XXXX. XX.XX XX.XX .XXX.', 7:'XXXXX ...XX ..XX. ..XX. .XX.. .XX.. .XX..',

async function drawIzba(open, weather, h, day, noPower = false){

  const d = out.d.data, W = out.c.width, H = out.c.height, lt = IZ_LIGHT[weather];

    for (let j = 0; j < 3; j++) d[i+j] = Math.max(0, Math.min(255, Math.floor(c[j]*k*lt[j])));

// ---------- rng ----------
let seed = Math.floor(Math.random()*1e9);
function rnd(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }
function pick(p){ let r=rnd(), a=0; for(let i=0;i<p.length;i++){ a+=p[i]; if(r<a) return i; } return p.length-1; }

function choice(a){ return a[Math.floor(rnd()*a.length)]; }

// ---------- state ----------
let S = null;
function newSeason(){
  // sceneSeed: the game's number for its scenes (where the signs show), not from rnd(), so the game's draws stay as they were
  S = { day:1, money:0, phase:'intro', sceneSeed: Math.floor(Math.random()*2147483647), book: [], totals: noTotals(), lifeLast: {} };
  newHouse();
}
function genDay(){
  const weather = pick(WEATHER_P);   // the morning
  let later = weather;

  const weathers = Array.from({length:HOURS}, (_,h)=> h < CHANGE_HOUR ? weather : later);
  const level = {}, catchT = {}, ripple = {}, boil = {}, bubbles = {}, lost = {}, scare = {}, midge = {};
  for (const w of WATERS){
    const a = pick(LEVEL_P[w][weather]), b = later === weather ? a : pick(LEVEL_P[w][later]);
    level[w] = Array.from({length:HOURS}, (_,h)=> h < CHANGE_HOUR ? a : b);
    catchT[w] = []; ripple[w] = []; boil[w] = []; bubbles[w] = []; lost[w] = []; scare[w] = []; midge[w] = [];
    for (let h=0; h<HOURS; h++){
      const lv = level[w][h], sc = rnd() < SCARE, n = poisson(RATE[w][lv]);
      catchT[w].push(sc ? 0 : n); scare[w].push(sc);
      ripple[w].push(rnd() < RIPPLE[lv]); boil[w].push(rnd() < BOIL[lv]); bubbles[w].push(rnd() < BUBBLES[lv]);
      lost[w].push(!sc && rnd() < LOST[lv]);

    }
  }

  const nb = {w:null, arrive:null, leave:null, reason:null, present:Array(HOURS).fill(false), bites:Array(HOURS).fill(0)};
  if (rnd() < NEIGHBOR_P){
    if (rnd() < NEIGHBOR_SMART){ const top = Math.max(...WATERS.map(w=>level[w][0])); nb.w = choice(WATERS.filter(w=>level[w][0]===top)); }
    else nb.w = choice(WATERS);

      nb.bites[h] = n; total += n; dry = n ? 0 : dry+1;
      if (h < HOURS-1 && dry >= 2){ nb.leave = h; nb.reason = 'empty'; break; }

  const rumorAt = h => {
    if (rnd() < RUMOR_TRUE){
      const top = Math.max(...WATERS.map(w=>level[w][h]));

// ---------- the household ----------
// What life takes, by the household numbers at the top. Its draws come from hashOf() (the game's number for its
// scenes, the day and a tag), never from rnd(): the fishing days stay as they were, and a reload gives the same thoughts
// and purchases. State, all saved: S.stock, the days each good still lasts counting today (bought on the evening it
// comes to 0); S.house, what is owed for big things, this morning's breakdown and thought, the summer's purchases, the
// next treat and the last background thought; S.purchases, what the evening bought, [{id, price, part}], `part` 'first',
// 'more' or 'last' for a big thing paid in parts (nameOf(id) is its name after «на» or «за»).
const HOUSE_TAG = 0x484f5553;
function hashOf(...vals){   // a number in [0, 1) from the game's number and vals

  return (x >>> 0) / 4294967296;

// the household of a new game, or of a game saved before it had one, from the evening of day `from`: that evening milk,
// bread and a cheap good run out, the next one sugar and another (a day of tackle a little short, then a little more),
// the rest later, each on the least loaded day between a third of its days and all of them

  put('milk', 1); put('bread', 1); put(first, 1); put('sugar', 2); put(second, 2);
  GOOD_IDS.filter(g => !(g in stock)).sort((a, b) => hf(14, GOOD_IDS.indexOf(a)) - hf(14, GOOD_IDS.indexOf(b))).forEach((g, i) => {
    let best = 3, low = Infinity;
    for (let d = Math.max(3, Math.ceil(GOODS[g].days*.3)); d <= Math.max(3, GOODS[g].days); d++){
      const l = (load[d] || 0) + hf(15, i, d); if (l < low){ low = l; best = d; } }
    put(g, best);

}
// The morning's thought, by priority: the season's thing on the last day of its time; what runs low, NEED_DAYS or
// fewer days left (the good with the fewest, and a second one when both are on their last day); what broke, only on a
// morning when nothing runs low and the evening has room, so it is told and never piles on; the season's thing in its
// time; else a background thought, never the last one again. Never about the fish.
function morningThought(){
  const H = S.house, cyc = (S.day - 1) % SUMMER + 1, yr = Math.floor((S.day - 1)/SUMMER);
  const season = ids => ids.find(s => H.season[s] !== yr && cyc >= SEASON[s].from && cyc <= SEASON[s].to);
  const say = (kind, id, text) => { H.said = {kind, id}; return text; };

  if (last) return say('season', last, SEASON[last].thought);
  const low = GOOD_IDS.filter(g => GOODS[g].out && S.stock[g] <= NEED_DAYS).sort((a, b) => S.stock[a] - S.stock[b] || GOODS[b].days - GOODS[a].days);
  if (low.length){
    const words = g => S.stock[g] > 1 && GOODS[g].low || GOODS[g].out;
    const two = low.length > 1 && S.stock[low[1]] <= 1, w2 = two ? words(low[1]) : '';

  }

// The evening: what is bought and paid today; sets S.purchases and returns the sum. What ran out is bought, then what

// two days would see much run out at once, some of it is bought today. Then, while the day is under LIFE_MIN, what
// would be thought of tomorrow; while it is under PART_TOP, a part of what is owed for a big thing; while it is under
// LIFE_MIN again, what runs out within AHEAD days (each bought ahead only up to LIFE_TOP); and at last, if the day is

    const g = free(false).sort((a, b) => quiet(b) - quiet(a)).find(g => S.stock[g] <= AHEAD && (!only || quiet(g)) && sum + GOODS[g].price <= LIFE_TOP);

}

// The journal shows whole lines. Its lines get the room from where they start down to the buttons, less the
// frame's bottom and the panel's gap, and never fewer than its last LOG_MIN lines, even where a short screen has less
// room; their top edge lies on the top of a line: an entry may show only its last lines, never a line cut in half. They are scrolled to the newest line. In a window too low for a day screen (LOW, the CSS's max-height:
// 540px) the page scrolls and the journal keeps LOG_LINES lines. Measured, as the lines depend on the width and
// the font: on every screen, and again when the window changes size and when the font has loaded.
const LOG_MIN = 3, LOG_LINES = 5, LOW = window.matchMedia ? matchMedia('(max-height: 540px)') : {matches: false};
function fitLog(){
  const el = $('log'); if (!el) return;
  const cs = getComputedStyle(el.parentNode), acts = $('panel').querySelector('.actions');

  const top = el.getBoundingClientRect().top, lh = parseFloat(getComputedStyle(el).lineHeight) || 19;

const CUCKOO = ['два раза', 'три раза', 'четыре раза', 'пять раз', 'шесть раз', 'семь раз'];
const LIFE_RARE = {season: .008, rare: .02};    // a rarer line's own chance in an hour it fits (times its q)
const LIFE_FOUL = {often: .2, some: .06};       // and a line of foul weather only (rain, wind, fog, downpour)'s
const LIFE_RATE = {often: .12, some: .04};      // the rest: their weights, and their sum the chance of one of them,
const LIFE_CAP = .28;                           // up to this
const LIFE_GAP = 7;   // days a rare or season line keeps away after it was written
const LIFE_TAG = 0x4c494645, LILIES_TILL = 15;   // the lilies stand open till the hour of 15:00, and close at 16:00
const spans = (s, lo, hi) => s ? s.split(',').map(r => { const [a, b = a] = r.split('-').map(Number); return [a, b]; }) : [[lo, hi]];
const inSpans = (x, sp) => sp.some(([a, b]) => x >= a && x <= b);
const LIFE_KEY = {};
LIFE_LINES.forEach((L, i) => { L.key = `${L.at}/${L.id}`; L.n = i; L.hrs = spans(L.h, START, START + HOURS - 1); L.mos = spans(L.m, 1, 12);
  L.ws = [...L.w].map(Number); L.foul = L.ws.every(x => x >= 2); LIFE_KEY[L.key] = L; });
const lifeHash = (...v) => hashOf(LIFE_TAG, S.day, ...v);
const lifeMonth = () => dayDate(S.day).getUTCMonth() + 1;   // the izba's calendar
const lifeWeather = t => S.D.weathers ? S.D.weathers[Math.min(t, HOURS - 1)] : S.D.weather;
// the day's hour of a clock line at water w: one of its window, by the day; a line of every water keeps off the hours
// of the water's own clock lines (the old man's tea is not lost to the rooster)
function clockHour(L, w){
  const [a, b] = L.hrs[0], own = L.at === 'all' ? LIFE_LINES.filter(M => M.f === 'clock' && M.at === w).map(M => clockHour(M, w)) : [];
  let h = a + Math.floor(lifeHash(1, L.n)*(b - a + 1));
  for (let k = a; k <= b && own.includes(h); k++) h = h === b ? a : h + 1;
  return h;
}
// the omut's lilies open on a summer morning with no downpour at their hour, and stand open after it till LILIES_TILL
const LILIES = LIFE_KEY['omut/lilies-open'];
function liliesOpened(){ return inSpans(lifeMonth(), LILIES.mos) && LILIES.ws.includes(lifeWeather(clockHour(LILIES, 'omut') - START)); }
function liliesOpen(t){ const hr = START + t; return liliesOpened() && hr > clockHour(LILIES, 'omut') && hr <= LILIES_TILL; }
function lifeFits(L, w, t){
  const last = S.lifeLast[L.key];
  return (L.at === w || L.at === 'all') && inSpans(START + t, L.hrs) && L.ws.includes(lifeWeather(t)) && inSpans(lifeMonth(), L.mos)
    && last !== S.day && !(L.f in LIFE_RARE && Number.isFinite(last) && S.day - last < LIFE_GAP) && (!L.need || L.need());
}
// the line of the hour t at water w, as the hour opens: the clock's, else maybe one by chance, unless the hour before
// had a line written here: then this one takes a breath
function chooseLife(w, t){
  const hr = START + t, wi = WATERS.indexOf(w), can = LIFE_LINES.filter(L => lifeFits(L, w, t));
  const clock = can.find(L => L.f === 'clock' && hr === clockHour(L, w)), prev = lifeOf(w, t - 1);
  if (clock) return clock.key;
  if (prev && S.lifeLast[prev.key] === S.day) return '';
  // the rarer lines first, each by its own chance, then those of a foul weather, so a place with much else to say does
  // not crowd them out
  const own = (L, p) => lifeHash(5, t, wi, L.n) < p;
  for (const due of [can.filter(L => L.f === 'season' && own(L, LIFE_RARE.season*(L.q || 1))), can.filter(L => L.f === 'rare' && own(L, LIFE_RARE.rare)),
                     can.filter(L => L.foul && L.f in LIFE_FOUL && own(L, LIFE_FOUL[L.f]))])
    if (due.length) return due[Math.floor(lifeHash(6, t, wi)*due.length)].key;
  const pool = can.filter(L => !L.foul && L.f in LIFE_RATE), rate = L => LIFE_RATE[L.f];
  const sum = pool.reduce((s, L) => s + rate(L), 0);
  if (!pool.length || lifeHash(2, t, wi) >= Math.min(LIFE_CAP, sum)) return '';
  let r = lifeHash(3, t, wi)*sum;
  return (pool.find(L => (r -= rate(L)) < 0) || pool[pool.length - 1]).key;
}
const lifeOf = (w, t) => LIFE_KEY[S.life && S.life[`${w}/${t}`]] || null;
// the hour sat out (or a drawn life's hour left): its line into the journal, under the hour's time (once)
function writeLife(w, t){
  const L = lifeOf(w, t);

  logAdd(t, typeof L.s === 'function' ? L.s() : L.s); S.lifeLast[L.key] = S.day;
}

const KETTLE = 'Хотел поставить чайник, да света нет.';   // the kettle stands on the electric hotplate

// from a water or the village straight back to the izba; the day goes on there. A life the scene has drawn in this

function canGo(dest){ return S.t + TRAVEL[dest] + (dest === 'shop' ? Math.min(...WATERS.map(w=>TRAVEL[w])) : 0) < HOURS; }

// the neighbour caught something today (his bites stay 0 after he leaves)
function nbCaught(){ return S.D.nb.bites.some(n => n > 0); }
let busy = false;
// An hour at the water takes HOUR_MS on screen, then its toast and the next hour. A bite, a fish or a lost fish alike,
// lifts the rod out of the water in the scene (LiveScenes.EVENTS.strike), so that it goes up about when the toast of
// a quiet hour comes, and its toast comes with the raised rod. A scare is told in the journal, under the hour the hud
// shows, as it passes in that hour; then its shadow passes, with the toast. The next hour is drawn only once the
// one-shot is over, so its scene never cuts it off; a scene that cannot show it, or fails to, lets the hour go on at
// once. The taps stay off until the next hour is drawn, and come back whatever happens on the way.
const HOUR_MS = 750, TOAST_MS = 1300;
const wait = ms => new Promise(r => setTimeout(r, Math.max(0, ms)));
// a one-shot over the scene the player sees, resolved true when it is over: a fade still going is finished first, as
// it would destroy the scene it fades out; no scene, or one not drawn yet, resolves false at once, and so does a
// one-shot that fails
function oneShot(kind){
  try {
    if (pic.fading){ if (!pic.fading.started) return Promise.resolve(false); endFade(); }
    const live = pic.live[pic.front];
    return live ? live.event(kind).catch(() => false) : Promise.resolve(false);
  } catch (e) { return Promise.resolve(false); }
}
// the journal on screen takes the lines written since it was drawn; the rest of the screen stays as it is

async function sit(){
  if (busy || S.t >= HOURS) return; busy = true;
  $('panel').classList.add('busy');   // no taps while the hour passes; the screen stays as it is
  try {
    hideToast();   // the last hour's toast goes as the next hour starts
    const w = S.loc, h = S.t, D = S.D, nb = D.nb, n = D.catchT[w][h], t0 = performance.now();
    S.presence[w].push(h);
    const what = n ? `${n > 1 ? fishWord(n) : 'Рыба'} +${n*PRICE} ₽` : D.lost[w][h] ? 'Сорвалась' : D.scare[w][h] ? 'Пусто' : 'Тихо';
    let told = false;
    if (n || D.lost[w][h]){
      // the strike starts on the scene's next even tick, up to two ticks (half its second frame) after the call: the
      // toast half a frame into the second frame comes while the rod is up, and stays its time over the next hour. Its
      // wait runs on the time the page is shown, as the strike runs on the scene's clock, which stands while it is hidden
      const E = LiveScenes.EVENTS.strike, up = E.frames[0] + E.frames[1]/2;
      await wait(HOUR_MS - E.frames[0]);

      const shown = await oneShot('strike'); stop();

      // cannot show the shadow leaves the toast its usual time
      await wait(HOUR_MS);
      writeLife(w, h);   // the hour's life comes before what it gave
      logAdd(h, 'У берега мелькнула большая тень, мелочь брызнула врассыпную.'); showLog();
      told = true; toast(what, LiveScenes.EVENTS.scare.ms + TOAST_MS, h + 1 >= HOURS);
      if (!await oneShot('scare')) toast(what, TOAST_MS, h + 1 >= HOURS);
    }
    else await wait(HOUR_MS);

    if (!told) toast(what, TOAST_MS, h + 1 >= HOURS);

    // a scare says nothing about the place (S.dry is null until the first hour that counts)
    if (n){ const sum = n*PRICE; S.money += sum; S.earnFish += sum; S.fishToday += n; logAdd(h+1, `<b>${what}</b>`); S.dry = 0; }
    else if (D.lost[w][h]) S.dry = 0;

      if (nb.leave === h) logAdd(h+1, nb.reason === 'full' ? 'Михалыч уходит с полным ведром.'

    }

      if (w === 'river') logAdd(S.t, S.noPower ? 'В деревне так и не зажёгся свет. Небось опять отключили.' : 'В деревне зажёгся свет.');

}
function endDay(){

  S.money -= spendDay();   // what life took today (S.purchases): the evening's remainder is the next morning's money
  closePage();   // the evening's page goes into the book, the day into the flyleaf's counts

// the best the day could give, knowing every hour: the moves the game has (an hour of tackle at home, a trip to a
// water that earns nothing on the way, an hour of fishing, the free walk home), as many trips as pay.
// V[t][p] is the most from hour t on, at home or at a water; ties keep the old man at home or on the same water.
// It is never shown: the evening's «если бы» line takes its fish from it ({val, runs}; no runs: tackle all day).
function bestPlan(){
  const C = S.D.catchT, V = [], how = [];
  for (let t = HOURS; t >= 0; t--){
    V[t] = {}; how[t] = {};
    if (t === HOURS){ V[t].home = 0; for (const w of WATERS) V[t][w] = 0; continue; }
    V[t].home = WAGE + V[t+1].home; how[t].home = 'craft';
    for (const w of WATERS) if (t + TRAVEL[w] < HOURS && V[t + TRAVEL[w]][w] > V[t].home){ V[t].home = V[t + TRAVEL[w]][w]; how[t].home = w; }
    for (const w of WATERS){
      const sit = C[w][t]*PRICE + V[t+1][w];
      if (sit >= V[t].home){ V[t][w] = sit; how[t][w] = 'sit'; } else { V[t][w] = V[t].home; how[t][w] = 'home'; }
    }
  }
  const runs = []; let t = 0, p = 'home';   // walk the best plan and gather its fishing hours
  while (t < HOURS){
    const m = how[t][p];
    if (p === 'home'){ if (m === 'craft') t++; else { t += TRAVEL[m]; p = m; } }
    else if (m === 'home') p = 'home';
    else { const r = runs[runs.length-1];
      if (r && r.w === p && r.to === t) r.to++; else runs.push({w: p, from: t, to: t+1}); t++; }
  }
  return {val: V[0].home, runs};
}

// ---------- the evening page and the book ----------
// The evening is a page of the diary in the old man's hand (should_I_lab's docs/05-dnevnik-i-hozyaystvo.md): the
// date and the weather; where and how long, the fish in words; the day's one event; at most one line of «если бы»;
// and what life took and what is left, always last. No table, no figures but the money. endDay() puts the page into
// the book (S.book, {d: day, p: [its lines]}) and adds the day to the flyleaf's counts (S.totals); both are saved,
// and a new game starts an empty book.
const MONTH_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const WEEKDAY_NAME = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];   // by getUTCDay()
const dateWords = day => { const t = dayDate(day); return `${t.getUTCDate()} ${MONTH_GEN[t.getUTCMonth()]}, ${WEEKDAY_NAME[t.getUTCDay()]}`; };
// the clock's hour after «с» and «до», as it is said: «с восьми до часу», «с одиннадцати до шести»
const HOUR_GEN = ['двенадцати', 'часу', 'двух', 'трёх', 'четырёх', 'пяти', 'шести', 'семи', 'восьми', 'девяти', 'десяти', 'одиннадцати'];
const hourGen = t => HOUR_GEN[(START + t) % 12];
const WATER_GEN = {river: 'реки', omut: 'омута', lake: 'озера'};
// a count of fish in words, as «рыба» wants it: «одна», «две», «двадцать пять»; past 99 in figures. acc: as the object
// of a verb («брало двадцать одну»), which changes only «одна»
const NUM_F = ['', 'одна', 'две', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять', 'десять', 'одиннадцать', 'двенадцать',
  'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
const NUM_TENS = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
const countWords = (n, acc = false) => {
  if (n < 1 || n > 99) return String(n);
  const s = n < 20 ? NUM_F[n] : NUM_TENS[Math.floor(n/10)] + (n % 10 ? ' ' + NUM_F[n % 10] : '');
  return acc ? s.replace(/одна$/, 'одну') : s;
};
const fishWords = n => n ? `${countWords(n)} ${plural(n, 'рыба', 'рыбы', 'рыб')}` : 'ни одной';
const noTotals = () => ({days: 0, water: 0, quiet: 0, home: 0, craft: 0, village: 0, nb: 0, weathers: [], earned: 0, crafted: 0});
// The day as it went, from S.trail ({k, t, n}: n hours at home from hour t, at the tackle, 'craft', or not, 'idle';
// or a trip to a water or the village, 'shop', that arrived at hour t): the stays at home, the village with the
// rumour heard there, and every water with the hours sat (one after another from the arrival), its fish, what was
// lost, scared or seen there, and the neighbour if the old man saw him there.
function dayParts(){
  const D = S.D, nb = D.nb, trail = S.trail || [], parts = [];
  trail.forEach((e, i) => {
    if (e.k === 'craft' || e.k === 'idle'){
      let p = parts[parts.length - 1];
      if (!p || p.k !== 'home') parts.push(p = {k: 'home', craft: 0, idle: 0});
      p[e.k] += e.n || 1; p.to = e.t + (e.n || 1);
    }
    else if (e.k === 'shop') parts.push({k: 'shop', t: e.t, rumor: D.rumor[Math.min(e.t, HOURS - 1)]});
    else if (WATERS.includes(e.k)){
      const w = e.k, until = trail[i + 1] ? trail[i + 1].t : HOURS, hrs = S.presence[w].filter(h => h >= e.t && h < until);
      const v = {k: 'water', w, from: e.t, to: e.t + hrs.length, hrs, fish: 0, lost: 0, scare: false, boil: false, nb: false, nbLeft: false};
      for (const h of hrs){ v.fish += D.catchT[w][h]; v.lost += D.lost[w][h] ? 1 : 0; v.scare = v.scare || D.scare[w][h]; v.boil = v.boil || D.boil[w][h]; }
      if (nb.w === w && hrs.length){   // he was there while the old man sat: the hours sat, and the look round after them
        v.nb = nb.present.some((on, h) => on && h >= v.from && h <= Math.min(v.to, HOURS - 1));
        v.nbLeft = nb.leave != null && nb.leave >= v.from && nb.leave < v.to;
      }
      parts.push(v);
    }
  });
  return parts;
}
// The prose: the date and the weather («, к обеду …» when it changed at 11:00), then where and how long, a sentence
// for every part of the day, with the day's one event after the part it happened in (the first of EVENTS the day
// has), and on a day without power the evening's kerosene lamp
function dayProse(parts){
  const D = S.D, ws = D.weathers || [D.weather], w0 = ws[0], w1 = ws[ws.length - 1], trips = parts.some(p => p.k !== 'home');
  const date = `${dateWords(S.day)}. ${cap(WEATHER_NAME[w0])}${w1 !== w0 ? ', к обеду ' + WEATHER_NAME[w1] : ''}.`;
  const said = [];
  parts.forEach((p, i) => said.push(sentence(p, i)));
  function sentence(p, i){
    if (p.k === 'home'){
      if (!trips) return p.craft && p.craft >= p.idle ? 'Весь день дома, снасти.' : 'Весь день дома.';
      if (i === 0) return p.craft < 2 ? '' : p.to <= CHANGE_HOUR ? 'Утром дома, снасти.' : `До ${hourGen(p.to)} дома, снасти.`;
      return p.craft ? 'Потом дома, снасти.' : 'Потом дома.';
    }
    if (p.k === 'shop'){   // after anything already told: «Потом»; the village again: «опять», and its word only if new
      const r = p.rumor, then = said.some(Boolean), before = parts.slice(0, i).filter(q => q.k === 'shop');
      const heard = before.some(q => q.rumor.w === r.w && q.rumor.lv === r.lv);
      return `${then ? 'Потом' : p.t <= CHANGE_HOUR ? 'Утром' : 'Днём'}${before.length ? ' опять' : ''} в деревню.` + (heard ? ''
        : r.w && r.lv ? ` Говорят, ${WHERE[r.w]} ${r.lv === 2 ? 'берёт' : 'клюёт помаленьку'}.` : ' Говорят, нигде не клюёт.');
    }
    return p.to > p.from ? `${NAME[p.w]} с ${hourGen(p.from)} до ${hourGen(p.to)} — ${fishWords(p.fish)}.` : `Дошёл до ${WATER_GEN[p.w]} и повернул назад.`;
  }
  if (!parts.length) said.push('Весь день дома.');
  const ev = EVENTS.map(f => f(parts)).find(Boolean);
  if (ev) said.splice(ev[0] < 0 ? said.length : ev[0] + 1, 0, ev[1]);
  if (S.noPower) said.push('Света так и нет. Зажёг керосинку.');
  return [date, said.filter(Boolean).join(' ')];
}
// the day's events, the most notable first: each looks for its own in the day's parts and gives [the part it goes
// after (-1: the end), its words], or nothing
const EVENTS = [
  parts => { const i = parts.findIndex(p => p.nbLeft && S.D.nb.reason === 'full');
    return i >= 0 && [i, `Михалыч сидел до ${hourGen(S.D.nb.leave + 1)}, ушёл с полным ведром.`]; },
  parts => {   // the village's word, checked on the water the old man went to straight from it
    for (let i = 0; i + 1 < parts.length; i++){
      const p = parts[i], v = parts[i + 1], r = p.rumor;
      if (p.k !== 'shop' || v.k !== 'water' || v.to === v.from) continue;
      if (r.w && r.lv && r.w === v.w) return [i + 1, v.fish ? 'Бабки не соврали.' : 'Бабки наврали.'];
      if (!(r.w && r.lv) && v.fish !== 1) return [i + 1, v.fish ? 'Бабки наврали.' : 'Бабки не соврали.'];
    }
  },
  parts => { const i = parts.findIndex(p => p.boil); return i >= 0 && [i, 'У камыша плескало, потому и остался.']; },
  // a pike's shadow comes an hour in twenty: after the neighbour's full bucket, the village's word and the reeds, so
  // that it does not take the place of the rarer ones on most days at the water
  parts => { const i = parts.findIndex(p => p.scare); return i >= 0 && [i, 'У берега мелькнула большая тень.']; },
  parts => { const p = parts.filter(p => p.lost).sort((a, b) => b.lost - a.lost)[0];
    return p && [parts.indexOf(p), `${cap(countWords(p.lost))} ${plural(p.lost, 'сорвалась', 'сорвались', 'сорвались')}.`]; },
  parts => { const i = parts.findIndex(p => p.nb);
    return i >= 0 && [i, !parts[i].nbLeft ? 'Михалыч сидел рядом.' : nbCaught() ? 'Михалыч ушёл, когда перестало клевать.' : 'Михалыч ушёл пустым.']; },
  parts => { const ws = S.D.weathers || [S.D.weather];   // a day at home in the rain
    return !parts.some(p => p.k !== 'home') && (ws.includes(5) ? [-1, 'За окном лило.'] : ws.includes(2) && [-1, 'За окном моросило.']); },
  () => !S.fishToday && [-1, 'Тихий день был.'],
];
// «Если бы»: what the old man could not have known, in fish, one construction and one feeling. His own water, when he
// left it before the evening: what it gave after he left (two or more: a pity; none: good that he left; one:
// nothing). Else the day's best plan (bestPlan()): on a water he did not fish, three fish or more over his catch; or
// tackle all day, when that would have earned more than he did. Else nothing.
function ifLine(parts){
  const C = S.D.catchT, waters = parts.filter(p => p.k === 'water'), last = waters[waters.length - 1];
  if (last && last.to < HOURS){
    const n = C[last.w].slice(last.to).reduce((s, x) => s + x, 0);
    const was = plural(n, 'была', 'было', 'было');   // «была бы ещё двадцать одна», «было бы ещё четыре»
    return n >= 2 ? `Если бы остался, ${was} бы ещё ${countWords(n)}. Жаль.` : n ? '' : 'Если бы остался, больше ничего не взял бы. Хорошо, что ушёл.';
  }
  const best = bestPlan(), by = {};
  for (const r of best.runs){
    const b = by[r.w] || (by[r.w] = {w: r.w, from: r.from, fish: 0});
    for (let h = r.from; h < r.to; h++) b.fish += C[r.w][h];
  }
  const top = Object.values(by).sort((a, b) => b.fish - a.fish)[0];
  if (top && !waters.some(p => p.w === top.w && p.to > p.from) && top.fish - S.fishToday >= 3){
    const from = START + top.from === 12 || START + top.from === 13 ? 'с обеда' : `с ${hourGen(top.from)}`;
    return `А ${WHERE[top.w]} ${from} брало ${countWords(top.fish, true)}.`;
  }
  return !best.runs.length && S.earnFish + S.earnWork < HOURS*WAGE ? 'Дома, за снастями, вышло бы больше.' : '';
}
// What life took this evening (S.purchases, from spendDay()) and what is left, always the page's last line: the
// purchases in one phrase after «На», a big thing with its first part among them, its later parts each after «За»
const known = p => !!p && !!(GOODS[p.id] || BREAKS[p.id] || SEASON[p.id] || TREATS[p.id]);
function spendLine(){
  const all = (S.purchases || []).filter(known), later = p => p.part === 'more' || p.part === 'last', now = all.filter(p => !later(p));
  const names = now.map(p => nameOf(p.id)), out = [];
  if (names.length) out.push(`На ${names.length > 1 ? names.slice(0, -1).join(', ') + ' и ' + names[names.length - 1] : names[0]} ушло ${now.reduce((s, p) => s + p.price, 0)}.`);
  all.filter(later).forEach(p => out.push(`За ${nameOf(p.id)} отдал ${p.part === 'last' ? 'последние' : 'ещё'} ${p.price}.`));
  out.push(S.money > 0 ? `В копилке осталось ${S.money}.` : S.money < 0 ? `В долгу ${-S.money}.` : 'В копилке пусто.');
  return out.join(' ');
}
// the evening's page, as the book keeps it
function eveningPage(parts = dayParts()){ return {d: S.day, p: [...dayProse(parts), ifLine(parts), spendLine()].filter(Boolean)}; }
// The evening: its page into the book, and the day into the flyleaf's counts: the days; the hours on the water and,
// of them, the quiet ones (no fish, none lost, nothing scared); the hours at home (the day less the ways there and the
// water) and, of them, at the tackle; the trips to the village; the days the neighbour was there; the weathers seen;
// what was earned, and what tackle alone would have given
function closePage(){
  const D = S.D, T = S.totals, parts = dayParts(), trail = S.trail || [];
  S.book.push(eveningPage(parts));
  const sat = WATERS.reduce((s, w) => s + S.presence[w].length, 0);
  const quiet = WATERS.reduce((s, w) => s + S.presence[w].filter(h => !D.catchT[w][h] && !D.lost[w][h] && !D.scare[w][h]).length, 0);
  const home = Math.max(0, HOURS - sat - trail.reduce((s, e) => s + (TRAVEL[e.k] || 0), 0));
  // the hours at the tackle as the day went (S.trail), and the pay they got: a day saved before the tackle paid 5 an
  // hour was paid 10, and so would tackle all day have been
  const craft = trail.reduce((s, e) => s + (e.k === 'craft' ? e.n || 1 : 0), 0), wage = craft && S.earnWork ? Math.round(S.earnWork/craft) : WAGE;
  T.days++; T.water += sat; T.quiet += quiet; T.home += home; T.craft += Math.min(home, craft);
  T.village += trail.filter(e => e.k === 'shop').length; T.nb += parts.some(p => p.nb) ? 1 : 0;
  T.weathers = [...new Set([...T.weathers, ...(D.weathers || [D.weather])])];
  T.earned += (S.earnFish || 0) + (S.earnWork || 0); T.crafted += HOURS*wage;
}
// a one-letter word stays with the next one, and a dash with the word before it (no-break spaces, in the font)
const tie = s => s.replace(/ —/g, '\u00a0—').replace(/(^|\s)([вВиИаАсСуУкКоО]) /g, '$1$2\u00a0').replace(/(^|\s)([вВиИаАсСуУкКоО]) /g, '$1$2\u00a0');
const pageHTML = pg => pg.p.map((s, i) => `<p${i ? '' : ' class="date"'}>${tie(s)}</p>`).join('');
function eveningHTML(){
  const last = S.book[S.book.length - 1];
  return `<div class="page" id="page">${pageHTML(last && last.d === S.day ? last : eveningPage())}</div>`;
}
// The evening fits the screen: the scene gives the page and the buttons the room they take (--eve), down to its
// floor; past that the page scrolls in its box, and an edge with more beyond it fades. Measured, as the lines depend
// on the width and the font: on every screen, and again when the window changes size and when the font has loaded.
function fitEvening(){
  const pg = $('page'); if (!pg || S.phase !== 'evening') return;
  const P = $('panel'), cs = getComputedStyle(P), acts = P.querySelector('.actions');
  const need = parseFloat(cs.paddingTop) + parseFloat(cs.borderTopWidth) + pg.scrollHeight + (parseFloat(cs.rowGap) || 0) + acts.offsetHeight;
  $('wrap').style.setProperty('--eve', `${Math.ceil(need)}px`);
  const edges = () => { pg.classList.toggle('up', pg.scrollTop > .5); pg.classList.toggle('down', pg.scrollTop + pg.clientHeight < pg.scrollHeight - .5); };
  edges(); pg.onscroll = edges;
}
// The book, a screen of its own over the izba or the evening: the flyleaf (once a day is over), then every evening's
// page, the newest at the bottom; today's page is the journal hour by hour, and at the evening the evening's page
// under it. It opens at the bottom, as the journal shows its newest line; closing it goes back where it came from.
let bookOpen = false;
function flyleaf(){
  const T = S.totals, n = (x, a, b, c) => `${x} ${plural(x, a, b, c)}`;
  return [`Лето: ${n(T.days, 'день', 'дня', 'дней')}. `
    + (T.water ? `На воде ${n(T.water, 'час', 'часа', 'часов')}, ${T.quiet ? 'тихих ' + T.quiet : 'тихих не было'}. ` : 'На воде ни часу. ')
    + (T.home ? `Дома ${T.home}, за снастями ${T.craft || 'ни часу'}. ` : 'Дома ни часу. ')
    + (T.village ? `В деревне ${n(T.village, 'раз', 'раза', 'раз')}. ` : 'В деревне ни разу. ')
    + `Михалыч — ${T.nb ? n(T.nb, 'день', 'дня', 'дней') : 'ни разу'}. Погод перевидено ${T.weathers.length}.`,
    `Заработано ${T.earned}. Снасти дома дали бы ${T.crafted}.`];
}
function bookHTML(){
  const pages = S.book.slice(), last = pages[pages.length - 1], today = S.phase === 'evening' && last && last.d === S.day ? pages.pop() : null;
  return `<div class="book">${S.totals.days ? `<div class="flyleaf">${flyleaf().map(s => `<p>${tie(s)}</p>`).join('')}</div>` : ''}`
    + pages.map(pg => `<div class="day">${pageHTML(pg)}</div>`).join('')
    // today: its date on top (at the evening the page's own date and weather), the journal, then the rest of the page
    + `<div class="day"><p class="date">${today ? tie(today.p[0]) : `${dateWords(S.day)}.`}</p><div class="rows">${logRows()}</div>`
    + `${today ? today.p.slice(1).map(s => `<p>${tie(s)}</p>`).join('') : ''}</div></div>`;
}
function openBook(){
  if (busy) return;
  bookOpen = true; render();
  if (window.scrollTo) scrollTo(0, document.documentElement.scrollHeight);   // today's page, at the bottom
}
function closeBook(){ bookOpen = false; render(); }
// a day saved before S.trail: its way so far from the journal's lines (a trip by its arrival, an hour at home by the
// line written when it was over); at the evening, the hours «Мастерить до вечера» took, which wrote no line then: from
// the hour he was back home to the evening, if the day earned more at the tackle than its hour lines say. Counted in
// hours, not in money: a day saved before the tackle paid 5 an hour paid 10
const IDLE_LINES = ['Посидел у окна.', 'Попил чаю, посмотрел в окно.', 'Посидел в полумраке, послушал ходики.', 'Посидел просто так.', KETTLE];
function trailFromLog(){
  const trail = [], at = e => parseInt(e.t, 10) - START, arrived = {'Деревня. Бабки на лавке у магазина.': 'shop'};
  WATERS.forEach(w => { arrived[`${NAME[w]}. Закинул удочку.`] = w; });
  let paid = 0;   // what the hour lines at the tackle say they earned
  for (const e of S.log){
    if (!e || typeof e.text !== 'string' || !Number.isFinite(at(e))) continue;
    const m = /^Мастерил снасти, \+(\d+) ₽\.$/.exec(e.text);
    if (arrived[e.text]) trail.push({k: arrived[e.text], t: at(e)});
    else if (m){ trail.push({k: 'craft', t: at(e) - 1}); paid += +m[1]; }
    else if (IDLE_LINES.includes(e.text)) trail.push({k: 'idle', t: at(e) - 1});
  }
  const last = trail[trail.length - 1], P = S.presence || {};
  // back home: after the last hour at home, the hours sat at the last water (the walk home takes none), or the village
  const home = !last ? 0 : last.k === 'craft' || last.k === 'idle' ? last.t + 1
    : WATERS.includes(last.k) ? last.t + ((P[last.k] || []).filter(h => h >= last.t).length) : last.t;
  if (S.phase === 'evening' && (S.earnWork || 0) > paid && home < HOURS) trail.push({k: 'craft', t: home, n: HOURS - home});
  return trail;
}
addEventListener('resize', () => { fitEvening(); aimAll(); fitLog(); });
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { fitEvening(); aimAll(); fitLog(); });
let askRestart = false;   // the evening's 'start again' waits for a second tap
function nextDay(){
  askRestart = false; S.day++; startDay(); save(); render();
}
// a new game: the save is wiped, the title screen and the backstory come again
function restart(){
  askRestart = false;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  newSeason(); save(); render(); showSplash();
}
if (!load()) newSeason();
hush();
// the title screen opens a new game, then the backstory and the first morning; later launches go straight to the saved game
function showSplash(){
  const kb = !!document.activeElement && $('panel').contains(document.activeElement);
  $('splashImg').src = IMG.splash; $('splashGo').disabled = false; $('splash').hidden = false;
  tapLock = performance.now() + TAP_LOCK;
  if (kb) $('splashGo').focus({preventScroll: true});
}
$('splashGo').onclick = () => {
  if (tapsLocked()) return;
  const kb = document.activeElement === $('splashGo');
  $('splash').hidden = true; render();
  if (kb){ const b = $('panel').querySelector('button.primary'); if (b) b.focus({preventScroll: true}); }
};
render(); if (S.phase === 'intro') showSplash();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
