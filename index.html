<title>Рыбалка: ждать или уйти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#e6e0d2; --ink:#2b2925; --sub:#5a554c; --line:#2b2925; --red:#b5452f; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:#1d1c1a; color:var(--ink); font-family:'Pixelify Sans', monospace; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); -webkit-tap-highlight-color: transparent; user-select: none; }
  .wrap { max-width: 430px; margin: 0 auto; min-height: 100vh; background: var(--paper); display:flex; flex-direction:column; }
  .scene { position: relative; width: 100%; aspect-ratio: 130 / 180; overflow: hidden; background:#9ea7a8; }
  .scene img { width:100%; height:100%; display:block; image-rendering: pixelated; transition: filter .6s; }
  .hud { position:absolute; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; gap:8px; }
  .chip { background: var(--paper); padding:6px 10px; font-size:16px; font-weight:600; box-shadow: 0 0 0 2px var(--ink); }
  .toast { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); background:var(--paper); box-shadow:0 0 0 2px var(--ink);
           padding:10px 14px; font-size:18px; font-weight:600; opacity:0; transition:opacity .25s; pointer-events:none; text-align:center; white-space:nowrap; }
  .toast.show { opacity:1; }
  .waiting { position:absolute; inset:0; background: rgba(43,41,37,.0); transition: background .4s; pointer-events:none; }
  .waiting.on { background: rgba(43,41,37,.18); }
  .panel { flex:1; padding: 14px 16px 18px; display:flex; flex-direction:column; gap:10px; border-top: 3px solid var(--line); }
  .meta { display:flex; justify-content:space-between; gap:8px; font-size:14px; color:var(--sub); }
  .lines { display:flex; flex-direction:column; gap:4px; font-size:16px; line-height:1.3; }
  .title { font-size:20px; font-weight:600; }
  .actions { margin-top:auto; display:flex; flex-direction:column; gap:8px; }
  .grid { display:grid; gap:6px; }
  button { font-family:'Pixelify Sans', monospace; color:var(--ink); cursor:pointer; }
  button:disabled { opacity:.35; cursor:default; }
  .primary { min-height:54px; background:var(--ink); color:var(--paper); border:none; font-size:18px; font-weight:600; }
  .secondary { min-height:50px; background:transparent; border:2px solid var(--ink); font-size:14px; line-height:1.15; padding:4px; }
  .link { min-height:44px; background:transparent; border:none; font-size:15px; text-decoration:underline; }
  .reveal { display:grid; grid-template-columns: 62px repeat(10, minmax(0,1fr)); gap:2px; font-size:12px; align-items:center; }
  .reveal .h { text-align:center; color:var(--sub); }
  .cell { height:22px; background:#d6cfbf; display:flex; align-items:center; justify-content:center; font-size:11px; }
  .cell.you { box-shadow: inset 0 0 0 2px var(--ink); }
  .cell.f { background:#9fb0a2; }
  .cell.big { background:#c99a5a; }
  .sum { display:grid; grid-template-columns: 1fr auto; gap:2px 10px; font-size:15px; }
  .sum b { font-weight:600; }
  .log { max-height: 7.4em; overflow-y: auto; display:flex; flex-direction:column; gap:2px; font-size:15px; line-height:1.3;
         padding: 6px 0; border-top: 1px solid #b9b1a0; border-bottom: 1px solid #b9b1a0; -webkit-overflow-scrolling: touch; user-select: text; }
  .log > div { display:flex; gap:8px; }
  .log .tm { flex: 0 0 2.9em; color: var(--sub); }
  .note { font-size:14px; color:var(--sub); line-height:1.35; }
  .bar { height:10px; background:#d6cfbf; box-shadow: inset 0 0 0 1px var(--ink); }
  .bar > div { height:100%; background: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="scene">
    <img id="bg" alt="">
    <div class="waiting" id="waiting"></div>
    <div class="hud"><div class="chip" id="hudTime"></div><div class="chip" id="hudMoney"></div></div>
    <div class="toast" id="toast"></div>
  </div>
  <div class="panel" id="panel"></div>
</div>

function sunColour(h){
  const mid = (DAY_FIRST+DAY_LAST)/2;
  return h <= mid ? lerp3([246,238,214],[252,240,180],(h-DAY_FIRST)/(mid-DAY_FIRST)) : lerp3([252,240,180],[250,226,140],(h-mid)/(DAY_LAST-mid));
}
function pixels(src){
  return new Promise((ok, fail) => { const im = new Image(); im.onload = () => {
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0); ok({c, x, d: x.getImageData(0, 0, c.width, c.height)}); };
    im.onerror = fail; im.src = src; });
}
const litCache = {};
async function litScene(loc, weather, h){
  const key = `${loc}/${weather}/${h}`;
  if (litCache[key]) return litCache[key];
  const clean = (await pixels(IMG[loc].overcast)).d.data, out = await pixels(IMG[loc][weather]);
  const d = out.d.data, W = out.c.width, H = out.c.height, L = dayLight(h), waterTint = lerp3(L.land, L.sky, .6);
  const spec = LIT[loc] || LIT_DEFAULT, haze = weather === 'fog' ? .4 : 0, sun = weather === 'sun';
  const isSky = new Uint8Array(W*H), isLit = new Uint8Array(W*H), lamps = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    const p = y*W + x, i = p*4, k = rgbKey(clean[i], clean[i+1], clean[i+2]);
    isSky[p] = y < 92 && SKY_C.has(k);
    isLit[p] = spec.c.has(k) && !spec.skip.some(([bx,by,bw,bh]) => x>=bx && x<bx+bw && y>=by && y<by+bh);
    let c = [d[i], d[i+1], d[i+2]];
    if (h >= LIT_FROM && isLit[p]){
      const lit = k === LAMP ? LAMP_LIT : WINLIT;
      if (k === LAMP) lamps.push([x, y]);
      c = mix3(lit, c, haze);
    } else if (isSky[p]){
      if (sun && x >= SUN_BAKED.x0 && x <= SUN_BAKED.x1 && y >= SUN_BAKED.y0 && y <= SUN_BAKED.y1) c = SUN_BAKED.sky;   // drop the baked sun
      c = mix3(tint3(c, L.sky), L.glow, Math.min(1, Math.max(0, (y-40)/52) * L.g));
    } else if (y >= 84 && WATER_C.has(k)){
      c = mix3(tint3(c, waterTint), L.glow, L.g*.35);
    } else c = tint3(c, L.land);
    d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2];
  }
  if (lamps.length){   // a soft pool of light around the lamp, stronger below it
    const cx = lamps.reduce((s,q)=>s+q[0],0)/lamps.length, cy = lamps.reduce((s,q)=>s+q[1],0)/lamps.length;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      const p = y*W + x, i = p*4; if (isLit[p]) continue;
      const dist = Math.hypot(x-cx, (y-cy)*(y > cy ? .6 : 1.4));
      if (dist < 16){ const c = mix3([d[i],d[i+1],d[i+2]], LAMP_GLOW, .32*(1-dist/16)); d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; }
    }
  }
  if (sun){   // the sun on its arc, drawn after the light so it stays bright; hills hide it when it is low
    const [fx, fy] = sunPath(h), sx = Math.round(fx), sy = Math.round(fy), core = sunColour(h).map(Math.round);
    const halo = lerp3(core, [255,255,255], .3).map(Math.round);
    for (let x = sx-9; x <= sx+9; x++) for (let y = sy-9; y <= sy+9; y++){
      if (x < 0 || y < 0 || x >= W || y >= H || !isSky[y*W+x]) continue;
      const i = (y*W+x)*4, r2 = (x-sx)**2 + (y-sy)**2;
      const c = r2 <= 20 ? core : r2 <= 52 ? mix3([d[i],d[i+1],d[i+2]], halo, .45) : null;
      if (c){ d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2]; }
    }
  }
  out.x.putImageData(out.d, 0, 0);
  return litCache[key] = out.c.toDataURL();
}
// ---------- end daylight ----------

// ---------- rng ----------
let seed = Math.floor(Math.random()*1e9);
function rnd(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }
function pick(p){ let r=rnd(), a=0; for(let i=0;i<p.length;i++){ a+=p[i]; if(r<a) return i; } return p.length-1; }
function poisson(l){ if(l<=0) return 0; const L=Math.exp(-l); let k=0,p=1; while(true){ p*=rnd(); if(p<=L) return k; k++; } }
function choice(a){ return a[Math.floor(rnd()*a.length)]; }

// ---------- state ----------
let S = null;
function newSeason(){
  S = { day:1, money:0, history:[], phase:'intro' };
}
function genDay(){
  const weather = pick(WEATHER_P);
  const level = {}, catchT = {}, ripple = {}, boil = {}, bubbles = {}, lost = {}, scare = {}, midge = {};
  for (const w of WATERS){
    const a = pick(LEVEL_P[w][weather]); let b = a;
    if (rnd() < SHIFT_P) b = pick(LEVEL_P[w][weather]);
    level[w] = Array.from({length:HOURS}, (_,h)=> h<4 ? a : b);
    const up = b > a;
    catchT[w] = []; ripple[w] = []; boil[w] = []; bubbles[w] = []; lost[w] = []; scare[w] = []; midge[w] = [];
    for (let h=0; h<HOURS; h++){
      const lv = level[w][h], sc = rnd() < SCARE, n = poisson(RATE[w][lv]);
      catchT[w].push(sc ? 0 : n); scare[w].push(sc);
      ripple[w].push(rnd() < RIPPLE[lv]); boil[w].push(rnd() < BOIL[lv]); bubbles[w].push(rnd() < BUBBLES[lv]);
      lost[w].push(!sc && rnd() < LOST[lv]);
      midge[w].push((h===2 || h===3) && rnd() < (up ? MIDGE_UP : MIDGE_ELSE));
    }
  }
  // the neighbour: comes at 6-8, leaves after two empty hours or with a full bucket
  const nb = {w:null, arrive:null, leave:null, reason:null, present:Array(HOURS).fill(false), bites:Array(HOURS).fill(0)};
  if (rnd() < NEIGHBOR_P){
    if (rnd() < NEIGHBOR_SMART){ const top = Math.max(...WATERS.map(w=>level[w][0])); nb.w = choice(WATERS.filter(w=>level[w][0]===top)); }
    else nb.w = choice(WATERS);
    nb.arrive = Math.floor(rnd()*3);
    let dry = 0, total = 0;
    for (let h=nb.arrive; h<HOURS; h++){
      nb.present[h] = true;
      const n = scare[nb.w][h] ? 0 : poisson(RATE[nb.w][level[nb.w][h]]);
      nb.bites[h] = n; total += n; dry = n ? 0 : dry+1;
      if (h < HOURS-1 && dry >= 2){ nb.leave = h; nb.reason = 'empty'; break; }
      if (h < HOURS-1 && h >= 4 && total >= 4){ nb.leave = h; nb.reason = 'full'; break; }
    }
  }
  // a fresh rumor for every hour the player may walk into the shop
  const rumor = Array.from({length:HOURS}, (_,h) => {
    if (rnd() < RUMOR_TRUE){ const top = Math.max(...WATERS.map(w=>level[w][h])); const w = choice(WATERS.filter(w=>level[w][h]===top)); return {w, lv: level[w][h]}; }
    return {w: choice(WATERS), lv: Math.floor(rnd()*3)};
  });
  return { weather, level, catchT, ripple, boil, bubbles, lost, scare, midge, nb, rumor };
}
function startDay(){
  S.D = genDay();
  S.t = 0; S.loc = 'home'; S.earnFish = 0; S.earnWork = 0; S.fishToday = 0; S.path = []; S.presence = {river:[],omut:[],lake:[]};
  S.dry = 0; S.hoursHere = 0; S.log = [];
  S.phase = 'morning';
}

// ---------- helpers ----------
const $ = id => document.getElementById(id);
function clock(t){ return (START + t) + ':00'; }
function fishWord(n){ return `${n} ${plural(n,'рыба','рыбы','рыб')}`; }
function plural(n,a,b,c){ const m=n%10, h=n%100; if(m===1&&h!==11) return a; if(m>=2&&m<=4&&(h<10||h>=20)) return b; return c; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function remaining(){ return HOURS - S.t; }
const SAVE_KEY = 'wait-or-leave-v2';
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({S, seed})); }catch(e){} }
function load(){ try{ const v = JSON.parse(localStorage.getItem(SAVE_KEY)); if(v && v.S){ S=v.S; seed=v.seed;
  if (S.D && !S.D.boil){ if (S.phase === 'evening') S.D.nb = {w: S.D.neighbor || null}; else startDay(); }  // saved before water events existed
  if (S.D && S.D.level && S.D.level.river.length !== HOURS){ if (S.phase === 'evening') S.day++; startDay(); }  // saved when the day was 8 hours long
  return true; } }catch(e){} return false; }
function toast(text, ms=1300){ const el=$('toast'); el.textContent=text; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'), ms); }
function btn(label, sub, onclick, cls='secondary', disabled=false){
  const b = document.createElement('button'); b.type='button'; b.className=cls; b.disabled=disabled;
  b.innerHTML = sub ? `${label}<br>${sub}` : label; b.onclick = onclick; return b;
}
let sceneKey = null;
function setScene(img){
  const v = IMG[img], w = WEATHERS[S.D ? S.D.weather : 0];
  $('bg').alt = NAME[img] || ''; $('bg').style.filter = 'none';
  if (S.D && DAYLIGHT[img] && DAYLIGHT[img].includes(w)){   // re-lit for the hour; keeps the last picture until ready
    const h = START + Math.min(S.t, HOURS), key = `${img}/${w}/${h}`;
    sceneKey = key;
    litScene(img, w, h).then(url => { if (sceneKey === key) $('bg').src = url; }).catch(() => { if (sceneKey === key) $('bg').src = v[w]; });
    return;
  }
  sceneKey = null; $('bg').src = typeof v === 'string' ? v : v[w];
}
function hud(){ $('hudTime').textContent = S.phase==='evening' ? `День ${S.day} · вечер` : (S.D ? `День ${S.day} · ${clock(Math.min(S.t, HOURS))}` : `День ${S.day}`); $('hudMoney').textContent = `${S.money} ₽`; }

function moveButtons(){
  const g = document.createElement('div'); g.className='grid';
  // once at a water the old man only sits or goes home; from the shop any water is open
  const opts = S.loc === 'shop' ? WATERS : [];
  g.style.gridTemplateColumns = `repeat(${opts.length + 1}, minmax(0,1fr))`;
  for (const w of opts){
    const tt = TRAVEL[w]; const ok = S.t + tt < HOURS;
    g.appendChild(btn(NAME[w], `${tt} ч`, ()=>go(w), 'secondary', !ok));
  }
  g.appendChild(btn('Домой', `+${remaining()*WAGE} ₽`, goHome));
  return g;
}

// ---------- render ----------
function render(){
  hud(); const P = $('panel'); P.innerHTML='';
  const add = html => { const d=document.createElement('div'); d.innerHTML=html; while(d.firstChild) P.appendChild(d.firstChild); };
  const actions = document.createElement('div'); actions.className='actions';

  if (S.phase==='intro'){
    setScene('home');
    add(`<div class="title">Ждать или уйти</div>
      <div class="lines"><div>Деревня на реке. Утром смотришь на погоду и выбираешь, куда идти. На месте каждый час решаешь: сидеть дальше или домой.</div>
      <div>Дома всегда есть работа: ${WAGE} ₽ за час. Рыба — ${PRICE} ₽ штука, а сколько её будет — как повезёт и как прочитаешь.</div>
      <div>Цель — заработать больше, чем дала бы одна работа дома.</div></div>`);
    actions.appendChild(btn('Начать', '', ()=>{ startDay(); save(); render(); }, 'primary'));
  }

  else if (S.phase==='morning'){
    setScene('home');
    add(`      <div class="lines"><div><b>${WEATHER_TEXT[S.D.weather]}</b></div><div>${WEATHER_HINT[S.D.weather]}</div><div>Куда сегодня?</div></div>`);
    const g = document.createElement('div'); g.className='grid'; g.style.gridTemplateColumns='repeat(4, minmax(0,1fr))';
    for (const w of [...WATERS,'shop']) g.appendChild(btn(NAME[w], `${TRAVEL[w]} ч`, ()=>go(w)));
    actions.appendChild(g);
    actions.appendChild(btn(`Остаться дома, работать · +${HOURS*WAGE} ₽`, '', goHome, 'link'));
  }

  else if (S.phase==='shop'){
    setScene('shop');
    add(`<div class="meta"><span>${todayCatch()}</span></div>${journal()}`);
    actions.appendChild(moveButtons());
  }

  else if (S.phase==='water'){
    setScene(S.loc);
    const quiet = S.hoursHere === 0 ? '' : S.dry === 0 ? 'только что клевало' : `тихо ${S.dry} ${plural(S.dry,'час','часа','часов')}`;
    add(`<div class="meta"><span>${todayCatch()}</span><span>${quiet}</span></div>${journal()}`);
    actions.appendChild(btn('Сидеть ещё час', '', sit, 'primary', S.t >= HOURS));
    actions.appendChild(moveButtons());
  }

  else if (S.phase==='evening'){
    setScene('evening');
    add(eveningHTML());
    actions.appendChild(btn('Лечь спать', '', nextDay, 'primary'));
  }

  P.appendChild(actions);
  scrollLog();
}
function logAdd(t, text){ S.log.push({t: clock(t), text}); }
function journal(){
  // the time is written only on the first line of each hour
  return `<div class="log" id="log">${S.log.map((e,i)=>`<div><span class="tm">${i && S.log[i-1].t === e.t ? '' : e.t}</span><span>${e.text}</span></div>`).join('')}</div>`;
}
function scrollLog(){ const el = $('log'); if (el) el.scrollTop = el.scrollHeight; }
// what is seen on the water at the start of hour t
function lookAround(){
  const w = S.loc, D = S.D, t = S.t, nb = D.nb;
  if (nb.w === w && nb.present[t]){
    if (nb.arrive === t && S.hoursHere > 0) logAdd(t, 'Пришёл Михалыч, сел рядом.');
    else if (S.hoursHere === 0) logAdd(t, nb.arrive === t ? 'Михалыч тоже пришёл сюда.' : 'Михалыч уже здесь.');
  }
  let seen = false;
  if (D.boil[w][t]){ logAdd(t, 'У камыша бой: гоняют малька.'); seen = true; }
  if (D.bubbles[w][t]){ logAdd(t, 'Со дна идут пузыри.'); seen = true; }
  if (D.ripple[w][t]){ logAdd(t, choice(['Мелочь играет, круги по воде.','Плеснуло у берега.','Рыба играет у травы.'])); seen = true; }
  if (D.midge[w][t]){ logAdd(t, 'Над водой мошкара.'); seen = true; }
  if (!seen) logAdd(t, 'Вода гладкая, ни всплеска.');
}
function todayCatch(){ return S.fishToday ? 'Сегодня: ' + fishWord(S.fishToday) : 'Сегодня пусто'; }

// ---------- actions ----------
function go(dest){
  if (WATERS.includes(S.loc)) return;
  const tt = TRAVEL[dest];
  if (S.t + tt >= HOURS) return;
  S.path.push(`${clock(S.t)} → ${NAME[dest].toLowerCase()}`);
  S.t += tt; S.loc = dest; S.dry = 0; S.hoursHere = 0;
  if (dest === 'shop'){ logAdd(S.t, 'Магазин. Бабки на лавке.'); rumorLines().forEach(x=>logAdd(S.t, x)); S.phase='shop'; }
  else { logAdd(S.t, `${NAME[dest]}. Закинул удочку.`); S.phase='water'; lookAround(); }
  save(); render();
}
function rumorLines(){
  const {w, lv} = S.D.rumor[Math.min(S.t, HOURS-1)];
  const a = lv===2 ? `Баба Нюра: «Колька только что ${WHERE[w]} во какую рыбину взял!»`
          : lv===1 ? `Баба Нюра: «Говорят, ${WHERE[w]} клюёт помаленьку».`
                   : `Баба Нюра: «${cap(WHERE[w])} пусто, Петрович весь день просидел зазря».`;
  const b = choice(['Баба Валя: «Да брешет он».','Баба Валя: «Ну-ну».','Баба Валя: «Сходи да проверь».','Баба Валя молча кивает.']);
  return [a, b];
}
let busy = false;
function sit(){
  if (busy || S.t >= HOURS) return; busy = true;
  const w = S.loc, h = S.t, n = S.D.catchT[w][h];
  S.presence[w].push(h);
  $('waiting').classList.add('on');
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  setTimeout(()=>{
    $('waiting').classList.remove('on');
    const D = S.D, nb = D.nb;
    if (D.scare[w][h]) logAdd(h+1, 'Прошла щука, мелочь врассыпную.');
    if (n){ const sum = n*PRICE; S.money += sum; S.earnFish += sum; S.fishToday += n;
      const what = `${n > 1 ? fishWord(n) : 'Рыба'} +${sum} ₽`; toast(what); logAdd(h+1, `<b>${what}</b>`); S.dry = 0; }
    else { toast('Тихо'); logAdd(h+1, 'Тихо.'); S.dry++; }
    if (D.lost[w][h]) logAdd(h+1, 'Клюнуло, но сошла.');
    if (nb.w === w && nb.present[h]){
      logAdd(h+1, nb.bites[h] ? 'У Михалыча клюнуло.' : 'У Михалыча пусто.');
      if (nb.leave === h) logAdd(h+1, nb.reason === 'empty' ? 'Михалыч сматывает удочки: «Пустое дело».' : 'Михалыч уходит с полным ведром.');
    }
    S.t++; S.hoursHere++;
    if (S.t < HOURS) lookAround();
    busy = false;
    if (S.t >= HOURS){ setTimeout(()=>{ S.path.push(`${clock(HOURS)} — пора домой`); endDay(); }, 900); }
    save(); render();
  }, 750);
}
function goHome(){
  const r = remaining(); const pay = r*WAGE;
  S.earnWork += pay; S.money += pay;
  S.path.push(`${clock(S.t)} → домой${r>0 ? `, работа ${r} ч` : ''}`);
  if (S.log) logAdd(S.t, r>0 ? `Домой. Работа ${r} ${plural(r,'час','часа','часов')}, +${pay} ₽.` : 'Домой.');
  S.t = HOURS; endDay();
}
function endDay(){
  const earned = S.earnFish + S.earnWork;
  S.history.push({day:S.day, earned});
  S.phase = 'evening'; save(); render();
}
function bestPlan(){
  let best = {val: HOURS*WAGE, label:'весь день дома'};
  for (const w of WATERS){ const tt=TRAVEL[w];
    for (let leave=tt+1; leave<=HOURS; leave++){
      let v = 0; for (let h=tt; h<leave; h++) v += S.D.catchT[w][h]*PRICE;
      v += (HOURS-leave)*WAGE;
      if (v > best.val) best = {val:v, label:`${NAME[w].toLowerCase()} с ${clock(tt)} до ${clock(leave)}`};
    } }
  return best;
}
function eveningHTML(){
  const earned = S.earnFish + S.earnWork, best = bestPlan();
  let rows = `<div></div>${Array.from({length:HOURS},(_,h)=>`<div class="h">${START+h}</div>`).join('')}`;
  for (const w of WATERS){
    rows += `<div>${NAME[w]}</div>`;
    for (let h=0; h<HOURS; h++){
      const n = S.D.catchT[w][h]; const you = S.presence[w].includes(h);
      rows += `<div class="cell ${n?(n>1?'big':'f'):''} ${you?'you':''}" title="${n ? fishWord(n) : 'пусто'}">${n || ''}</div>`;
    }
  }
  const verdict = earned >= best.val ? 'Лучше было не придумать.' : earned >= HOURS*WAGE ? 'День не зря.' : 'Сегодня дома вышло бы больше.';
  const wLine = `Погода: ${WEATHER_NAME[S.D.weather]}.`;
  const nb = S.D.nb;
  const nbLine = !nb.w ? 'Михалыч сегодня не выходил.'
    : `Михалыч сидел ${WHERE[nb.w]}${nb.reason === 'empty' ? ' и ушёл пустым' : nb.reason === 'full' ? ' и ушёл с полным ведром' : ''}.`;
  return `<div class="title">Итог дня ${S.day}</div>
    <div class="sum"><span>Рыба</span><b>+${S.earnFish} ₽</b><span>Работа дома</span><b>+${S.earnWork} ₽</b>
    <span>Всего</span><b>+${earned} ₽</b><span>Если бы весь день дома</span><b>+${HOURS*WAGE} ₽</b>
    <span>Лучший вариант: ${best.label}</span><b>+${best.val} ₽</b></div>
    <div class="reveal">${rows}</div>
    <div class="note">Рамка — где ты сидел. Цифры — сколько рыбы попалось бы за час. ${wLine} ${nbLine} ${verdict}</div>
    <div class="note">Всего за ${S.day} ${plural(S.day,'день','дня','дней')}: ${S.money} ₽. Одна работа дома дала бы ${S.day*HOURS*WAGE} ₽.</div>`;
}
function nextDay(){
  S.day++; startDay(); save(); render();
}
if (!load() || S.phase === 'winter') newSeason();  // saves from the old 35-day season may end in winter
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
