          --reserve: 292px;     /* room the panel keeps under the scene on a day screen */
          --eve: 300px; }       /* on the evening: the page and the buttons, as fitEvening() measures them */
  * { box-sizing: border-box; }
  html, body { margin:0; background:#1d1c1a; color:var(--ink); font-family:'Stay Pixel', monospace; }
  body { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  b, strong { font-weight:600; }
  /* The page is the screen: the safe areas are padding inside .wrap (the strip under the status bar stays dark),
     and on a day screen .wrap is exactly the screen's height, so the buttons are always on it */
  .wrap { max-width: 430px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; padding-top: var(--top);
          background: linear-gradient(#1d1c1a, #1d1c1a) top / 100% var(--top) no-repeat, var(--paper); display:flex; flex-direction:column; }
  .wrap.fit { height: 100vh; height: 100dvh; }
  /* On a short screen the scene gives up its top (the sky; in the izba its bottom, the table), at most a quarter of it
     (more on a very short screen and on the evening, below) */
  .scene { position: relative; flex: none; width: 100%; aspect-ratio: 130 / 180; overflow: hidden; background:#9ea7a8;
           max-height: max(calc(min(100vw, 430px) * 1.04), calc(100vh - var(--top) - var(--bot) - var(--reserve)));
           max-height: max(calc(min(100vw, 430px) * 1.04), calc(100dvh - var(--top) - var(--bot) - var(--reserve))); }
  /* the evening fits the screen: the scene gives the page and the buttons the room they take (--eve, with the safe
     area under the buttons), down to its floor; a page longer than that scrolls in its own box over the buttons */
  .wrap.eve .scene { max-height: max(calc(min(100vw, 430px) * .6), calc(100vh - var(--top) - var(--eve)));
                     max-height: max(calc(min(100vw, 430px) * .6), calc(100dvh - var(--top) - var(--eve))); }
  /* the scene's two layers, one fading in over the other; each holds a still picture or a living scene: a canvas
     scaled to the width and standing on the bottom edge, as the picture's object-fit: cover does */
  .scene .layer { position:absolute; inset:0; }
  .scene .layer img { position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover; object-position:center bottom; image-rendering: pixelated; }
  .scene .layer.top img { object-position:center top; }
  .scene .layer canvas { position:absolute; left:0; bottom:0; width:100%; height:auto; display:block; image-rendering: pixelated; }
  .scene .layer.top canvas { top:0; bottom:auto; }   /* the izba, as its picture: from the top edge (aim() may lift it) */
  .scene .layer [hidden] { display:none; }
  .hud { position:absolute; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; gap:8px; z-index:3; }
  .chip { background: var(--paper); padding:6px 10px; font-size:16px; font-weight:600; box-shadow: 0 0 0 2px var(--ink); }
  .chip small { display:block; font-size:12px; font-weight:400; margin-top:2px; color:var(--sub); }
  /* the hour: the font's digits are 9.56px wide but «1» only 6.72px, so «10:00» is the widest; the box holds it, and
     the chip does not change its width as the hours pass */
  .chip .clk { display:inline-block; min-width:2.46em; }
  #hudMoney { text-align:right; }
  .toast { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); background:var(--paper); box-shadow:0 0 0 2px var(--ink);
           padding:10px 14px; font-size:18px; font-weight:600; opacity:0; transition:opacity .25s; pointer-events:none; text-align:center; white-space:nowrap; z-index:3; }
  .toast.show { opacity:1; }
  .toast[data-side=left] { left:12px; transform:none; }   /* at a water: under the hud, away from the rod, see toast() */
  .toast[data-side=right] { left:auto; right:12px; transform:none; }
  .panel { flex:1 1 auto; min-height:0; padding: 14px 16px 0; display:flex; flex-direction:column; gap:10px; border-top: 3px solid var(--line); }
  .panel.busy { pointer-events:none; }   /* while an hour passes: no taps, and nothing on screen changes */
  .meta { display:flex; justify-content:space-between; gap:8px; font-size:14px; color:var(--sub); }
  .lines { display:flex; flex-direction:column; gap:4px; font-size:16px; line-height:1.3; }
  .title { font-size:20px; font-weight:600; }
  /* the buttons stay at the bottom of the screen even when the page above them is longer (the evening) */
  .actions { margin-top:auto; display:flex; flex-direction:column; gap:8px; position:sticky; bottom:0; z-index:1;
             background:var(--paper); padding: 4px 0 calc(18px + var(--bot)); }
  .grid { display:grid; gap:6px; }
  button { font-family:'Stay Pixel', monospace; color:var(--ink); cursor:pointer; touch-action: manipulation; }
  button:disabled { opacity:.35; cursor:default; }
  .primary { min-height:54px; background:var(--ink); color:var(--paper); border:none; font-size:18px; font-weight:600; }
  .secondary { min-height:50px; background:transparent; border:2px solid var(--ink); font-size:14px; line-height:1.15; padding:4px; }
  .link { min-height:44px; background:transparent; border:none; font-size:15px; text-decoration:underline; }
  /* two quiet links side by side, in the height of one: in the izba «Мастерить до вечера» and the book, on the
     evening the book and «Начать заново»; a long one breaks into two lines in its half */
  .links { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:6px; }
  .links .link { line-height:1.1; padding:0 4px; }
  /* the evening: a handwritten page, its lines plain text; it scrolls in its own box when the screen is too short
     for it, and an edge with more text beyond it fades (.up, .down) */
  .page { flex: 0 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:6px; font-size:16px; line-height:1.35;
          -webkit-overflow-scrolling: touch; user-select: text; -webkit-user-select: text; }
  .page p, .book p { margin:0; }
  .page .date, .book .date { font-weight:600; }
  .page.down { -webkit-mask-image: linear-gradient(#000 calc(100% - 1.6em), rgba(0,0,0,.15)); mask-image: linear-gradient(#000 calc(100% - 1.6em), rgba(0,0,0,.15)); }
  .page.up { -webkit-mask-image: linear-gradient(rgba(0,0,0,.15), #000 1.6em); mask-image: linear-gradient(rgba(0,0,0,.15), #000 1.6em); }
  .page.up.down { -webkit-mask-image: linear-gradient(rgba(0,0,0,.15), #000 1.6em, #000 calc(100% - 1.6em), rgba(0,0,0,.15));
                  mask-image: linear-gradient(rgba(0,0,0,.15), #000 1.6em, #000 calc(100% - 1.6em), rgba(0,0,0,.15)); }
  /* the book: the whole screen is paper (no scene, no hud) and scrolls; the flyleaf, then a page for every evening,
     the newest at the bottom; today's page holds the journal hour by hour. A page off screen is not laid out until it
     comes near (content-visibility), so a long book opens at once */
  .wrap.book .scene { display:none; }
  .wrap.book .panel { border-top:none; padding-top:18px; }
  .book { display:flex; flex-direction:column; font-size:16px; line-height:1.35; user-select: text; -webkit-user-select: text; }
  .book .flyleaf { display:flex; flex-direction:column; gap:6px; padding-bottom:14px; color:var(--sub); font-size:15px; }
  .book .day { display:flex; flex-direction:column; gap:6px; padding:12px 0; border-top:1px solid #b9b1a0; content-visibility:auto; contain-intrinsic-size:auto 150px; }
  .book .day:last-child { content-visibility:visible; }
  .book > .day:first-child { border-top:none; padding-top:0; }
  .book .rows { display:flex; flex-direction:column; gap:2px; font-size:15px; line-height:19px; }
  .book .rows > div { display:flex; gap:8px; }
  .book .tm { flex: 0 0 2.9em; color: var(--sub); }
  .book .rows + p { margin-top:6px; }   /* today's evening, under its journal */
  .wrap.book .actions::before { content:''; position:absolute; left:0; right:0; bottom:100%; height:20px; pointer-events:none;
                                background:linear-gradient(rgba(230,224,210,0), var(--paper)); }   /* the page goes under the button softly */
  /* the journal: a frame (.log) round the lines that scroll (#log). It shows whole lines only: fitLog() gives it the
     room down to the buttons (on a short screen at least its last three lines), its top edge on the top of a line,
     scrolled to the newest line; while older lines lie above, its top edge fades (.more). Five lines until it is fitted.
     Its lines are a whole number of pixels high: browsers round a scroll range to whole pixels, and a half-pixel line
     would leave the top edge half a pixel off the top of a line (19px, not 20: the three lines a short phone's izba
     keeps take no more room than they did at 19.5) */
  .log { flex: none; font-size:15px; line-height:19px; padding: 6px 0; border-top: 1px solid #b9b1a0; border-bottom: 1px solid #b9b1a0; }
  .log .rows { max-height: calc(5 * 19px + 8px); overflow-y: auto; display:flex; flex-direction:column; gap:2px;
               -webkit-overflow-scrolling: touch; user-select: text; -webkit-user-select: text; }
  .log .rows.more { -webkit-mask-image: linear-gradient(rgba(0,0,0,.2), #000 1.4em); mask-image: linear-gradient(rgba(0,0,0,.2), #000 1.4em); }
  .log .rows > div { display:flex; gap:8px; }
  .log .tm { flex: 0 0 2.9em; color: var(--sub); }
  .note { font-size:14px; color:var(--sub); line-height:1.35; }
  .splash { position:fixed; inset:0; z-index:10; background:#55663f; display:flex; justify-content:center; }
  .splash[hidden] { display:none; }
  .splash .frame { position:relative; width:100%; max-width:430px; height:100%; overflow:hidden; }
  /* a screen shorter than the picture loses four fifths of what it cannot show at the top (the sky) and a fifth at
     the bottom (the meadow): on the shortest phones the forested hill stays under the title, not the river, and the
     izba stays clear of the button */
  .splash img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 80%; image-rendering:pixelated; }
  /* the living title screen lies over the picture, placed by fitSplash() the way the picture is (cover, centre 80%);
     the still picture stays under it unseen and shows only if the scene cannot be drawn */
  .splash canvas { position:absolute; left:0; top:0; display:block; image-rendering:pixelated; }
  .splash canvas[hidden] { display:none; }
  .splash.live img { opacity:0; }
  /* the title, in two lines («Уйти» / «или остаться»), is light like the tag, with a dark pixel outline: it lies on the
     forest on a short screen and on the sky on a tall one (or half on each), and reads on both */
  .splash .name span { display:block; }
  .splash .name { position:absolute; top:calc(env(safe-area-inset-top) + 7.5%); left:16px; right:16px; text-align:center; font-size:38px; font-weight:600; line-height:1.1;
                  color:#f3efe4; --o:rgba(43,41,37,.85);
                  text-shadow: 2px 0 0 var(--o), -2px 0 0 var(--o), 0 2px 0 var(--o), 0 -2px 0 var(--o),
                    2px 2px 0 var(--o), -2px 2px 0 var(--o), 2px -2px 0 var(--o), -2px -2px 0 var(--o), 0 4px 0 rgba(0,0,0,.3); }
  .splash .start { position:absolute; bottom:calc(env(safe-area-inset-bottom) + 86px); left:50%; transform:translateX(-50%); width:200px; min-height:54px;
                   background:var(--paper); color:var(--ink); border:3px solid var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.35); font-size:20px; font-weight:600; }
  .splash .tag { position:absolute; bottom:calc(env(safe-area-inset-bottom) + 36px); left:16px; right:16px; text-align:center; color:#f3efe4;
                 font-size:18px; font-weight:500; text-shadow:0 2px 0 rgba(0,0,0,.35); }
  .story { gap:8px; }
  .story p { margin:0; }
  .secondary.next { font-size:18px; font-weight:600; }   /* the backstory's «Дальше»: an outline, quieter than «Начать день» */
  /* the backstory scrolls: its picture is shown whole (river, cliff and forest at its top), the text under it, and
     the button after the text, not over it. The yard after it («Как тут живётся?») is laid out as the yard of a day:
     on a short screen the scene gives up its sky, the button stays at the bottom, and only a text too long scrolls */
  .wrap.intro .scene { max-height: none; }
  .wrap.intro .actions { position: static; }
  /* too low for the scene and the panel together (a short window): the page scrolls; a phone on its side gets .turn */
  @media (max-height: 540px) { .wrap.fit { height: auto; } }
  /* a phone with the browser's bars: a little less air in the panel, so the scene keeps more of its picture */
  @media (max-height: 800px) {
    :root { --reserve: 256px; }
    .panel { padding-top: 10px; gap: 8px; }
    .actions { gap: 6px; padding: 2px 0 calc(12px + var(--bot)); }
    .primary { min-height: 48px; }
    .secondary { min-height: 46px; }
    .link { min-height: 36px; }
  }
  /* a short phone in its browser (an iPhone SE in Safari): the scene may give up more of the picture, so that a day
     screen with the journal at its three lines still fits the screen */
  @media (max-height: 620px) {
    :root { --reserve: 266px; }
    .wrap.living { --reserve: 290px; }   /* «Как тут живётся?»: its four sentences and the button fit a 320x568 screen */
    .actions { padding-bottom: calc(8px + var(--bot)); }   /* 4px less under the buttons: the izba fits a 548px screen too */
    .scene { max-height: max(calc(min(100vw, 430px) * .8), calc(100vh - var(--top) - var(--bot) - var(--reserve)));
             max-height: max(calc(min(100vw, 430px) * .8), calc(100dvh - var(--top) - var(--bot) - var(--reserve))); }
    /* and the evening's scene may shrink to a strip, so the whole page stays above the buttons; the lamp under the
       shade is at its top, the kerosene lamp on the sill is kept in sight by aim() */
    .wrap.eve .scene { max-height: max(calc(min(100vw, 430px) * .4), calc(100vh - var(--top) - var(--eve)));
                       max-height: max(calc(min(100vw, 430px) * .4), calc(100dvh - var(--top) - var(--eve))); }
  }
  /* a phone on its side: the game is made for an upright phone, so it only asks to turn it */
  .turn { display:none; }
  @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
    html, body { overflow:hidden; }
    .wrap, .splash { visibility:hidden; }
    .turn { display:flex; position:fixed; inset:0; z-index:30; align-items:center; justify-content:center; padding:24px;
            background:var(--paper); color:var(--ink); font-size:20px; font-weight:600; line-height:1.3; text-align:center; }
  }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="scene">
    <div class="layer" id="bg"><img alt=""><canvas width="130" height="180" role="img" hidden></canvas></div>
    <div class="layer" id="bg2" aria-hidden="true"><img alt=""><canvas width="130" height="180" role="img" hidden></canvas></div>
    <div class="hud"><div class="chip" id="hudTime"></div><div class="chip" id="hudMoney"></div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="sr" id="say" role="log" aria-live="polite"></div>
</div>
<div class="splash" id="splash" hidden>
  <div class="frame">
    <img id="splashImg" alt="Старая изба на зелёном склоне над рекой, за рекой гора в тайге">
    <canvas id="splashCanvas" width="130" height="281" aria-hidden="true" hidden></canvas>
    <div class="name"><span>Уйти</span> <span>или остаться</span></div>
    <button type="button" class="start" id="splashGo">Начать</button>
    <div class="tag">Игра про рыбалку и жизнь</div>
  </div>
</div>
<div class="turn" id="turn">Разверните телефон вертикально</div>
<script>
// ---------- scenes.js: the living scenes engine, put here by should_I_lab/art/anim/to_game.py; change it there ----------
// Living scenes: the engine of the ambient animation in «Уйти или остаться», and its reference.
//
// One clean picture per place (its overcast scene). For a place, a weather and an hour a still layer is computed
// once: the weather painted by code the way art/tools/weather.py paints it (the same random numbers, so the still
// parts match the baked pictures pixel for pixel), then lit for the hour the way the game lights it (daylight block).
// Each tick copies that layer and lets a few small effects draw what moves; only the pixels they touch are lit again.
// Everything that moves is a function of the time and the scene's seed alone: no Math.random. The engine decides
// nothing about the fish: the signs on the water are the ones the game passes in (what its journal wrote for the hour),
// drawn where the seed puts them.
//
// A classic script, no modules and no build step; it defines window.LiveScenes and nothing else. demo.html is its
// page (build.py inlines this file there); a page with many scenes loads it with <script src>.
//   LiveScenes.create(canvas, {place, weather, hour, src, autoplay = true, baked = false, t = 0, lit = true, seed = 0,
//     signs = [], life = null, lilies = false}) -> scene
//     place one of LiveScenes.PLACES, weather one of LiveScenes.WEATHERS ('rain' is the drizzle), hour 6..18 (rounded
//     and clamped, 12 when missing). The places are the five outdoor places of the day (pix.py's) and the two screens
//     before the first day: 'splash', the title screen (splash.py), and 'story', the backstory's village from the hill
//     (village.py); those two have no signs, no life and no rod, only their weather, their light and what moves of
//     itself. src is the URL of the place's clean picture, 130 wide and as tall as LiveScenes.SIZE[place] says (180,
//     the title screen 281, the whole phone screen), a data: URI or a same-origin URL: it is loaded with an Image,
//     analysed once and cached by place and src. baked is the demo's ?baked=1 check: weather.py's picture, unlit,
//     nothing moving. t is the time the scene starts at, in seconds: a scene that takes over from another (a new hour,
//     a new place) starts at that one's `time`, so nothing in it jumps. The canvas is made 130 wide and as tall as the
//     place's picture (again whenever the scene's place changes to one of another size) and only ever gets
//     putImageData; until the picture is analysed it is left as it is (transparent), so an <img> under it shows. With
//     autoplay the scene plays at 12 ticks a second, unless the system asks for reduced motion; otherwise it draws one
//     still frame. lit: false is a day without power: at 18:00 no window and no street lamp lights up (daytime.py's
//     no_power); left out, or any other value, they light up.
//     signs are the signs on the water of the hour, as the journal wrote them: a list of {kind: 'splash', variant:
//     'shore' | 'under' | 'calm'}, {kind: 'boil'}, {kind: 'bubbles'}, {kind: 'midge'} (LiveScenes.SIGNS lists them).
//     Each shows at three sites on the water that the seed picks (an integer; the game's number for the day, the hour
//     and the place; in sun the bubbles keep clear of the hour's glints, so there the hour picks too), never by the
//     float, at an uneven pace of its own: a splash every 5-9 s, a boil every 1-2 s, a chain of bubbles every 6-10 s,
//     midges all the time. The first show comes about 0.6 to 2.7 s after the signs are given (a boil's within 1.2 s,
//     the midges' at once; create, or a set() that changes the signs or the seed). Only on the waters (river, omut,
//     lake); never with baked. With reduced motion and nothing playing each sign is drawn still, at its first site.
//     life is the hour's drawn life around the water, as the game picked it for the journal: {kind: id} (or the id), one
//     of LiveScenes.LIFE[place], e.g. a log drifting down the river. It is in sight from the start, plays out slowly by
//     the time since it was given (create, or a set() that changes the life, the seed or the place) and the seed, and
//     comes again only after a long pause. Only on the waters; never with baked; with reduced motion and nothing playing
//     it is drawn still, as it starts.
//     lilies: true opens the omut's water lilies for the hour (the summer hours between «Раскрылись кувшинки» and
//     «Кувшинки закрылись», which are the lives 'lilies-open' and 'lilies-close'; with reduced motion those are drawn as
//     they end).
//   scene.set({place, weather, hour, src, baked, lit, seed, signs, life, lilies}): any of them; the clock goes on.
//   scene.play(), scene.pause(), scene.playing.
//   scene.time: the time of the scene's frame, in seconds.
//   scene.ready() -> a promise of true once the scene has drawn its settings (at once if it has), or of false if it
//     cannot (bad input, destroyed).
//   scene.at(t): pause and draw the frame of t seconds, as the demo's ?t=…&pause=1 does.
//   scene.event(kind) -> a promise: a one-shot over the scene from its next even tick, resolved true when it is over;
//     false at once if the scene cannot show it (not a water, baked, nothing drawn yet, an unknown kind), or when it is
//     cut short (another event, a set() that changes the scene, destroy()), and then nothing of it stays drawn.
//     'strike', a fish or a lost fish alike: the rod comes out of the water in three frames (LiveScenes.EVENTS.strike
//     .frames, in ms): as it lies; steeply up, the float pulled out and a small ring where it was; nearly upright, the
//     float hanging under the tip. In both raised frames the line goes on under the float to the hook. Then it lies in
//     the water again. No fish is drawn.
//     'scare': a big dark shadow glides under the water by the near bank and the fry splash away (EVENTS.scare.ms);
//     the rod stays. A scene that does not play (paused, reduced motion, autoplay off) shows the event over its still
//     frame by the wall clock (with reduced motion the scare as one still frame); at() steps it with the scene's ticks.
//   scene.stats() -> {ms, px}: the mean ms a drawn frame took over about the last second and the pixels the last frame
//     changed (counted only when asked); null before the first frame.
//   LiveScenes.preload(place, src) -> a promise of true once the picture is analysed (false if it cannot be): a scene
//     of a preloaded place draws its first frame inside create() or set(). Once a water's picture is analysed, the
//     engine finds where its signs may show bit by bit in idle time, so a scene with signs need not.
//   LiveScenes.names(place, weather) -> the Russian names of what really moves there (the demo's caption), by the
//     picture of the place analysed last; null until a picture of the place has been analysed. A scene draws its
//     first frame of a place in the task that analyses the picture, so a page that asks again at every display frame
//     until it gets the names changes its caption in the frame the picture changes.
//   LiveScenes.dayLight(hour) -> {sky, land, glow, g}: the light of an hour (tints, glow colour and strength), and
//     LiveScenes.DAY = {first, last, litFrom}: the game lights the izba with these, so the light is written once.
//   LiveScenes.SIGNS: [{kind, variant?, name}], every sign a scene draws, name a short Russian label (the demo's).
//   LiveScenes.LIFE: {river: [id, ...], omut: [...], lake: [...]}, the life each water draws, and LIFE_NAME: {id: a
//     short Russian label} (the demo's). The journal line each id draws is by it in LIFE below.
//   LiveScenes.EVENTS: {strike: {frames: [ms, ms, ms], ms}, scare: {ms}}, how long the one-shots take.
//   LiveScenes.SIZE: {place: [width, height]}, the size of each place's picture.
//   LiveScenes.PLACES, WEATHERS, PLACE_NAME, WEATHER_NAME, version.
// Bad input (an unknown place or weather, a picture that does not load) gets one console.warn and a scene that draws
// nothing until set() gives it something it can draw.
//
// Any number of scenes can share a document. They share the analysed pictures and the still layers (caches that keep
// what the live scenes use and a few more) and one ticker: one timer a tick for all the playing scenes. While the
// page is hidden nothing plays, and it goes on without a jump. A scene whose canvas has been in the page and is not
// any more (removed, or in an iframe that was removed or went to another page) destroys itself: the ticker looks at
// every tick, and while nothing plays a slow look does, every 2 s and soon after a create() or set(). A canvas that

    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;

let izCache = {}, izMask = null;
function izbaScene(open, weather, h, day, noPower = false){   // the lit izba (izbaPixels), drawn once for a day

// the still izba as a picture, daytime.py's render_izba (izba_check.js compares the two)
async function drawIzba(open, weather, h, day, noPower = false){ return (await izbaPixels(open, weather, h, day, noPower)).c.toDataURL(); }
// The izba lit for the hour: {c, d} its canvas and pixels, and what its window needs (izbaLive): which pixels are the
// view, which of them sky, the hour's light and the weather's
async function izbaPixels(open, weather, h, day, noPower = false){
  izMask = izMask || pixels(IMG.izbaMask);
  const m = (await izMask).d.data, out = await pixels(IMG[open ? 'izba' : 'izbaClosed'][weather]);
  const d = out.d.data, W = out.c.width, H = out.c.height, lt = IZ_LIGHT[weather];
  // izba.py draws in plain colours, then darkens the room towards the edges and lights it for the weather
  const put = (x, y, c) => {
    const dx = (x-65)/75, dy = (y-72)/105, k = 1 - .24*Math.min(1, dx*dx + dy*dy)**1.2, i = (y*W + x)*4;
    for (let j = 0; j < 3; j++) d[i+j] = Math.max(0, Math.min(255, Math.floor(c[j]*k*lt[j])));
  };
  const text = (x, y, s, font, c) => { for (const ch of s){ const g = font[ch];
    g.forEach((row, j) => [...row].forEach((v, i) => { if (v === 'X') put(x+i, y+j, c); })); x += g[0].length + 1; } };
  // the clock: the minute hand up, the hour hand at the hour; the weights go down FALL over the day, a little every
  // hour, so in the evening they still hang clear of the table
  for (let y = 55; y < 59; y++) put(113, y, INK);
  const [ex, ey] = HOUR_HAND[h % 12], n = Math.max(Math.abs(ex), Math.abs(ey));
  for (let i = 0; i <= n; i++) put(113 + Math.round(i*ex/n), 59 + Math.round(i*ey/n), INK);
  for (const [wx, top] of WEIGHTS){
    const bot = top + Math.floor(FALL*(h - DAY_FIRST)/(DAY_LAST - DAY_FIRST));
    for (let y = 67; y < bot; y++) put(wx, y, y % 2 ? CHAIN : CHAIN_D);
    for (let j = 0; j < 8; j++) for (let x = wx-1; x <= wx+1; x++) put(x, bot+j, j % 2 ? CONE_D : CONE);
    put(wx, bot+8, CONE_D);
  }
  // the calendar: the date over the weekday, red on a Sunday
  const [num, wd, sunday] = dateOf(day), col = sunday ? RED : INK;
  text(CAL_L + ((CAL_W - (num.length*6 - 1)) >> 1), CAL_T + 7, num, DIGITS, col);
  text(CAL_L + ((CAL_W - (wd.length*4 - 1)) >> 1), CAL_T + 16, wd, FONT3, col);
  // the light of the hour: the view outside as at the waters, the room after the window
  const L = dayLight(h), src = d.slice(), bulb = h >= LIT_FROM && !noPower;   // the bulb lights the room itself
  // the view's light: the hour's, darker while the bulb is on (VIEW_LAMP)
  const vk = VIEW_LAMP[weather], V = bulb ? {...L, sky: L.sky.map(v => v*vk), land: L.land.map(v => v*vk), glow: L.glow.map(v => v*vk)} : L;
  const river = lerp3(V.land, V.sky, .6);
  const lightK = Math.max(0, Math.min(1, ((L.land[0] + L.land[1] + L.land[2])/3 - .55)/.45));   // 0 at dawn and dusk, 1 at noon
  const gain = ROOM_GAIN[weather] || [0,0,0], room = L.land.map((k,i) => k*(1 + gain[i]*lightK));
  const glass = room.map(k => k*(1 + (CURTAIN_GAIN[weather] || 0)*lightK)), [gx0, gy0, gx1, gy1] = GLASS;
  const span = ([a, b]) => a + (b - a)*lightK, near = span(ROOM_NEAR), reach = span(ROOM_REACH), wk = ROOM_WEATHER[weather] || 1;
  const share = span(ROOM_SHARE)*(open ? 1 : ROOM_CLOSED);
  const isView = new Uint8Array(W*H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    const p = y*W + x, i = p*4, view = m[i + (open ? 0 : 1)] > 127, sky = view && m[i+2] > 127;
    let c = [d[i], d[i+1], d[i+2]];
    isView[p] = view;
    if (sky) c = mix3(tint3(c, V.sky), V.glow, Math.min(1, Math.max(0, (y-40)/52) * V.g));
    else if (view && y >= RIVER && y < RIVER + RW) c = mix3(tint3(c, river), V.glow, V.g*.35);
    else if (view) c = tint3(c, V.land);
    else {   // the room: its share of the daylight, more by the window
      const dx = Math.max(gx0 - x, 0, x - gx1), dy = Math.max(gy0 - y, 0, y - gy1);
      const k = bulb ? 1 : wk*(share + (near - share)*Math.exp(-(dx*dx + dy*dy)/(reach*reach)));
      c = tint3(c, (x >= gx0 && x <= gx1 && y >= gy0 && y <= gy1 ? glass : room).map(v => v*k));
    }
    d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2];
  }
  if (h >= LIT_FROM && noPower){   // no power: the kerosene lamp burns; its glass glows over the view too, its pool lights the room
    const ky = KERO_FLAME - .5;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      const p = y*W + x, i = p*4, dx = x - KERO_X, dy = y - ky, hw = keroGlass(y);
      let c;
      if (x === KERO_X && y === KERO_FLAME) c = KERO_CORE;
      else if (x === KERO_X && y === KERO_FLAME - 1) c = KERO_TIP;
      else if (hw >= 0 && Math.abs(dx) <= hw) c = mix3(tint3([src[i], src[i+1], src[i+2]], KERO_WARM), KERO_GLOW, .8*Math.exp(-(dx*dx + dy*dy)/18));
      else if (!isView[p]) c = mix3([d[i], d[i+1], d[i+2]], tint3([src[i], src[i+1], src[i+2]], KERO_WARM), KERO_POOL*Math.exp(-(dx*dx + dy*dy)/(2*KERO_REACH**2)));
      else continue;
      d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2];
    }
  } else if (h >= LIT_FROM){   // the bulb under the lampshade over the table is on and warms the room around it
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      const p = y*W + x, i = p*4; if (isView[p]) continue;
      const warm = tint3([src[i], src[i+1], src[i+2]], BULB_WARM);

      else if (x >= LAMP_X-LAMP_HW && x <= LAMP_X+LAMP_HW && y >= 4 && y <= 19 && src[i] > 1.9*src[i+2]) c = mix3(warm, SHADE_GLOW, .35);   // the fabric: red over twice its blue, unlike the wall
      else { const dx = x - LAMP_X, dy = (y - 22)*.7; c = mix3([d[i], d[i+1], d[i+2]], warm, .85*Math.exp(-(dx*dx + dy*dy)/(2*55**2))); }
      d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2];
    }
  }
  out.x.putImageData(out.d, 0, 0);
  // what the window needs: each view pixel's class (1 land, 2 river, 3 sky; 0 the room, and the burning kerosene lamp's
  // glass, which stands over the view) and where the clean view is sky (its clouds drift there)
  const cls = new Uint8Array(W*H), skyAll = new Uint8Array(W*H), kero = h >= LIT_FROM && noPower;

const SIGN_LINE = {'boil': 'У камыша раз за разом плещет, мелочь выпрыгивает из воды.',
  'bubbles': 'По воде медленно ползёт цепочка мелких пузырьков.',
  'splash/calm': 'По тихой воде тут и там расходятся круги.', 'splash/shore': 'У берега плеснуло, пошли круги.',
  'splash/under': 'Под берегом тихонько плеснуло.', 'midge': 'Над водой столбиками вьётся мошкара.'};
// what is seen on the water at the start of hour t; the scene of this water and hour shows the signs the journal wrote
// (S.signs, by `${water}/${hour}`), and no others
function lookAround(){
  const w = S.loc, D = S.D, t = S.t, nb = D.nb, signs = [];
  if (nb.w === w && nb.present[t]){
    if (nb.arrive === t && S.hoursHere > 0) logAdd(t, 'Пришёл Михалыч, сел рядом.');
    else if (S.hoursHere === 0) logAdd(t, nb.arrive === t ? 'Михалыч тоже пришёл сюда.' : 'Михалыч уже здесь.');
  }
  const sign = id => { logAdd(t, SIGN_LINE[id]); signs.push(id); };
  // the words follow the hour's weather: still water only in still weather (the chances do not change)
  const wt = nowWeather(), calm = CALM.includes(wt);
  if (D.boil[w][t]) sign('boil');
  if (D.bubbles[w][t]) sign('bubbles');
  if (D.ripple[w][t]) sign(choice([...(calm ? ['splash/calm'] : []), 'splash/shore', 'splash/under']));   // one draw, as ever
  if (D.midge[w][t]) sign('midge');
  if (!signs.length) logAdd(t, calm ? 'Вода гладкая, ни всплеска.' : wt === 3 ? 'По воде бежит рябь, всплесков не видно.' : 'Дождь рябит воду, всплесков не видно.');
  if (signs.length) S.signs[`${w}/${t}`] = signs; else delete S.signs[`${w}/${t}`];
  S.life[`${w}/${t}`] = chooseLife(w, t);   // and what goes on around the water this hour, if anything
}

// one line of it (S.life, by `${water}/${hour}`: the line's key, or '' for none), and the scene of that hour draws it
// from the start if it is one the engine draws (LiveScenes.LIFE). The line goes into the journal under that hour's
// time once the hour is sat out, before what the hour gave, and a drawn one also when the old man leaves the water in
// that hour, before he goes: the scene has shown it; never into the evening's page or its counts. On the omut
// the water lilies open on a summer morning and stand open till 16:00, when they close (the scene's `lilies`).

// comes at one hour of its window a day (clockHour()), whenever the old man is there then and the weather fits. A line
// comes at most once a day, and an hour has one at most. Its draws come from hashOf(), never from rnd(): the fishing

const spans = (s, lo, hi) => s ? s.split(',').map(r => { const [a, b = a] = r.split('-').map(Number); return [a, b]; }) : [[lo, hi]];
const inSpans = (x, sp) => sp.some(([a, b]) => x >= a && x <= b);
const LIFE_KEY = {};
LIFE_LINES.forEach((L, i) => { L.key = `${L.at}/${L.id}`; L.n = i; L.hrs = spans(L.h, START, START + HOURS - 1); L.mos = spans(L.m, 1, 12);
  L.ws = [...L.w].map(Number); L.foul = L.ws.every(x => x >= 2); LIFE_KEY[L.key] = L; });
const lifeHash = (...v) => hashOf(LIFE_TAG, S.day, ...v);
const lifeMonth = () => dayDate(S.day).getUTCMonth() + 1;   // the izba's calendar
const lifeWeather = t => S.D.weathers ? S.D.weathers[Math.min(t, HOURS - 1)] : S.D.weather;
// the day's hour of a clock line at water w: one of its window, by the day; a line of every water keeps off the hours
// of the water's own clock lines (the old man's tea is not lost to the rooster)
function clockHour(L, w){
  const [a, b] = L.hrs[0], own = L.at === 'all' ? LIFE_LINES.filter(M => M.f === 'clock' && M.at === w).map(M => clockHour(M, w)) : [];
  let h = a + Math.floor(lifeHash(1, L.n)*(b - a + 1));
  for (let k = a; k <= b && own.includes(h); k++) h = h === b ? a : h + 1;
  return h;
}
// the omut's lilies open on a summer morning with no downpour at their hour, and stand open after it till LILIES_TILL
const LILIES = LIFE_KEY['omut/lilies-open'];
function liliesOpened(){ return inSpans(lifeMonth(), LILIES.mos) && LILIES.ws.includes(lifeWeather(clockHour(LILIES, 'omut') - START)); }
function liliesOpen(t){ const hr = START + t; return liliesOpened() && hr > clockHour(LILIES, 'omut') && hr <= LILIES_TILL; }
function lifeFits(L, w, t){
  const last = S.lifeLast[L.key];
  return (L.at === w || L.at === 'all') && inSpans(START + t, L.hrs) && L.ws.includes(lifeWeather(t)) && inSpans(lifeMonth(), L.mos)
    && last !== S.day && !(L.f in LIFE_RARE && Number.isFinite(last) && S.day - last < LIFE_GAP) && (!L.need || L.need());
}
// the line of the hour t at water w, as the hour opens: the clock's, else maybe one by chance, unless the hour before
// had a line written here: then this one takes a breath
function chooseLife(w, t){
  const hr = START + t, wi = WATERS.indexOf(w), can = LIFE_LINES.filter(L => lifeFits(L, w, t));
  const clock = can.find(L => L.f === 'clock' && hr === clockHour(L, w)), prev = lifeOf(w, t - 1);
  if (clock) return clock.key;
  if (prev && S.lifeLast[prev.key] === S.day) return '';
  // the rarer lines first, each by its own chance, then those of a foul weather, so a place with much else to say does
  // not crowd them out
  const own = (L, p) => lifeHash(5, t, wi, L.n) < p;
  for (const due of [can.filter(L => L.f === 'season' && own(L, LIFE_RARE.season*(L.q || 1))), can.filter(L => L.f === 'rare' && own(L, LIFE_RARE.rare)),
                     can.filter(L => L.foul && L.f in LIFE_FOUL && own(L, LIFE_FOUL[L.f]))])
    if (due.length) return due[Math.floor(lifeHash(6, t, wi)*due.length)].key;
  const pool = can.filter(L => !L.foul && L.f in LIFE_RATE), rate = L => LIFE_RATE[L.f];
  const sum = pool.reduce((s, L) => s + rate(L), 0);
  if (!pool.length || lifeHash(2, t, wi) >= Math.min(LIFE_CAP, sum)) return '';
  let r = lifeHash(3, t, wi)*sum;
  return (pool.find(L => (r -= rate(L)) < 0) || pool[pool.length - 1]).key;
}
const lifeOf = (w, t) => LIFE_KEY[S.life && S.life[`${w}/${t}`]] || null;
// the hour sat out (or a drawn life's hour left): its line into the journal, under the hour's time (once)
function writeLife(w, t){
  const L = lifeOf(w, t);
  if (!L || S.lifeLast[L.key] === S.day) return;
  logAdd(t, typeof L.s === 'function' ? L.s() : L.s); S.lifeLast[L.key] = S.day;
}
function todayCatch(){ return S.fishToday ? 'Сегодня: ' + fishWord(S.fishToday) : 'Сегодня пусто'; }

// ---------- actions ----------
// time passes wherever the old man is; at 11:00 the weather may step, and he sees it
function advance(n){
  const from = S.t, D = S.D; S.t = Math.min(HOURS, S.t + n);
  if (D.weathers && from < CHANGE_HOUR && S.t >= CHANGE_HOUR && D.weathers[CHANGE_HOUR] !== D.weathers[CHANGE_HOUR-1]){
    const w = D.weathers[CHANGE_HOUR];
    logAdd(CHANGE_HOUR, CHANGE_TEXT[`${D.weathers[CHANGE_HOUR-1]}-${w}`]); logAdd(CHANGE_HOUR, WEATHER_HINT[w]); S.seen = w;
  }
}
// the weather goes into the journal the first time the old man sees it: through the window or outside
function seeWeather(){
  const w = nowWeather();
  if (S.seen === w) return;
  S.seen = w; logAdd(S.t, `<b>${WEATHER_TEXT[w]}</b>`); logAdd(S.t, WEATHER_HINT[w]);
}
function openCurtain(){ if (busy) return; S.curtain = true; logAdd(S.t, 'Открыл занавеску.'); seeWeather(); save(); render(); }
function closeCurtain(){ if (busy) return; S.curtain = false; logAdd(S.t, 'Задёрнул занавеску.'); save(); render(); }
function goOut(){ if (busy) return; S.phase = 'yard'; logAdd(S.t, 'Вышел во двор.'); seeWeather(); save(); render(); }
function backInside(){ if (busy) return; S.phase = 'izba'; logAdd(S.t, 'Зашёл в избу.'); save(); render(); }
// 18:00 caught him away from home: the only way is back to the izba for the evening
function comeHome(){
  if (busy) return;
  S.loc = 'home'; endDay();
}
// an hour at home: making tackle pays the wage, sitting pays nothing
const KETTLE = 'Хотел поставить чайник, да света нет.';   // the kettle stands on the electric hotplate
function homeHour(paid){
  if (busy || S.t >= HOURS) return;
  if (paid){ S.money += WAGE; S.earnWork += WAGE; }
  // on a day without power the first hour of sitting finds it out, and there is no tea all day
  const kettle = !paid && S.noPower && !S.log.some(e => e.text === KETTLE);
  S.trail.push({k: paid ? 'craft' : 'idle', t: S.t});
  logAdd(S.t + 1, paid ? `Мастерил снасти, +${WAGE} ₽.` : kettle ? KETTLE
    : choice(S.curtain ? ['Посидел у окна.', ...(S.noPower ? [] : ['Попил чаю, посмотрел в окно.'])] : ['Посидел в полумраке, послушал ходики.', 'Посидел просто так.']));
  advance(1);
  if (S.t >= HOURS) return endDay();
  save(); render();
}
function craft(){ homeHour(true); }
function idle(){ homeHour(false); }
function craftAll(){
  if (busy) return;
  const r = remaining(), pay = r*WAGE;
  S.money += pay; S.earnWork += pay;
  S.trail.push({k: 'craft', t: S.t, n: r}); logAdd(S.t, `Мастерил снасти до вечера, +${pay} ₽.`);   // today's page in the book
  advance(r); endDay();
}
// from a water or the village straight back to the izba; the day goes on there. A life the scene has drawn in this
// hour has been seen: its line goes into the journal before he goes (one that is not drawn was not, and is not written)
function walkHome(){
  if (busy) return;
  if (S.t >= HOURS) return comeHome();   // the day is already over
  if (WATERS.includes(S.loc)){ const L = lifeOf(S.loc, S.t); if (L && L.draw) writeLife(S.loc, S.t); }
  logAdd(S.t, WATERS.includes(S.loc) ? 'Смотал удочки, пошёл домой.' : 'Пошёл домой.');
  S.loc = 'home'; S.phase = 'izba'; S.dry = 0; S.hoursHere = 0;
  save(); render();
}
// a trip must leave time to fish: a water is reached before 18:00, and the village only while a water can still be
// reached after it (until 15:00)
function canGo(dest){ return S.t + TRAVEL[dest] + (dest === 'shop' ? Math.min(...WATERS.map(w=>TRAVEL[w])) : 0) < HOURS; }
function go(dest){
  if (busy || WATERS.includes(S.loc) || !canGo(dest)) return;
  advance(TRAVEL[dest]); S.loc = dest; S.dry = null; S.hoursHere = 0;
  S.trail.push({k: dest, t: S.t});   // arrived at hour S.t
  if (dest === 'shop'){ logAdd(S.t, 'Деревня. Бабки на лавке у магазина.'); rumorLines().forEach(x=>logAdd(S.t, x)); S.phase='shop'; }
  else { logAdd(S.t, `${NAME[dest]}. Закинул удочку.`); S.phase='water'; lookAround(); }
  save(); render();
}
function rumorLines(){
  const {w, lv} = S.D.rumor[Math.min(S.t, HOURS-1)];
  const a = lv===2 && w ? `Баба Нюра: «Колька только что ${WHERE[w]} во какую рыбину взял!»`
          : lv===1 && w ? `Баба Нюра: «Говорят, ${WHERE[w]} клюёт помаленьку».`
          : S.t < CHANGE_HOUR ? 'Баба Нюра: «Говорят, нигде не клюёт. Петрович с утра сидит зазря».'
                              : 'Баба Нюра: «Говорят, нигде не клюёт, Петрович весь день просидел зазря».';
  const b = choice(['Баба Валя: «Да брешут».','Баба Валя: «Ну-ну».','Баба Валя: «Сходите да проверьте».','Баба Валя молча кивает.']);
  // on a day without power the bench talks of that first; the rumour and its reply are as on any other day
  return S.noPower ? ['Баба Валя: «Опять свет отключили».', a, b] : [a, b];
}
// the neighbour caught something today (his bites stay 0 after he leaves)
function nbCaught(){ return S.D.nb.bites.some(n => n > 0); }
let busy = false;
// An hour at the water takes HOUR_MS on screen, then its toast and the next hour. A bite, a fish or a lost fish alike,
// lifts the rod out of the water in the scene (LiveScenes.EVENTS.strike), so that it goes up about when the toast of
// a quiet hour comes, and its toast comes with the raised rod. A scare is told in the journal, under the hour the hud
// shows, as it passes in that hour; then its shadow passes, with the toast. The next hour is drawn only once the
// one-shot is over, so its scene never cuts it off; a scene that cannot show it, or fails to, lets the hour go on at
// once. The taps stay off until the next hour is drawn, and come back whatever happens on the way.
const HOUR_MS = 750, TOAST_MS = 1300;
const wait = ms => new Promise(r => setTimeout(r, Math.max(0, ms)));
// a one-shot over the scene the player sees, resolved true when it is over: a fade still going is finished first, as
// it would destroy the scene it fades out; no scene, or one not drawn yet, resolves false at once, and so does a
// one-shot that fails
function oneShot(kind){
  try {
    if (pic.fading){ if (!pic.fading.started) return Promise.resolve(false); endFade(); }
    const live = pic.live[pic.front];
    return live ? live.event(kind).catch(() => false) : Promise.resolve(false);
  } catch (e) { return Promise.resolve(false); }
}
// the journal on screen takes the lines written since it was drawn; the rest of the screen stays as it is
function showLog(){
  const el = $('log'); if (!el) return;
  el.parentNode.outerHTML = journal(); fitLog(); announce();
}
async function sit(){
  if (busy || S.t >= HOURS) return; busy = true;
  $('panel').classList.add('busy');   // no taps while the hour passes; the screen stays as it is
  try {
    hideToast();   // the last hour's toast goes as the next hour starts
    const w = S.loc, h = S.t, D = S.D, nb = D.nb, n = D.catchT[w][h], t0 = performance.now();
    S.presence[w].push(h);
    const what = n ? `${n > 1 ? fishWord(n) : 'Рыба'} +${n*PRICE} ₽` : D.lost[w][h] ? 'Сорвалась' : D.scare[w][h] ? 'Пусто' : 'Тихо';
    let told = false;
    if (n || D.lost[w][h]){
      // the strike starts on the scene's next even tick, up to two ticks (half its second frame) after the call: the
      // toast half a frame into the second frame comes while the rod is up, and stays its time over the next hour. Its
      // wait runs on the time the page is shown, as the strike runs on the scene's clock, which stands while it is hidden
      const E = LiveScenes.EVENTS.strike, up = E.frames[0] + E.frames[1]/2;
      await wait(HOUR_MS - E.frames[0]);
      const stop = shownTimeout(() => { told = true; toast(what, E.ms - up + TOAST_MS); }, up);
      const shown = await oneShot('strike'); stop();
      if (!shown) await wait(t0 + HOUR_MS - performance.now());
    }
    else if (D.scare[w][h]){
      // the shadow and its toast come together, and the toast stays its time after the shadow has passed; a scene that
      // cannot show the shadow leaves the toast its usual time
      await wait(HOUR_MS);
      writeLife(w, h);   // the hour's life comes before what it gave
      logAdd(h, 'У берега мелькнула большая тень, мелочь брызнула врассыпную.'); showLog();
      told = true; toast(what, LiveScenes.EVENTS.scare.ms + TOAST_MS, h + 1 >= HOURS);
      if (!await oneShot('scare')) toast(what, TOAST_MS, h + 1 >= HOURS);
    }
    else await wait(HOUR_MS);
    writeLife(w, h);   // the hour is sat out: its life, under its time, before its result (written once)
    if (!told) toast(what, TOAST_MS, h + 1 >= HOURS);
    // a quiet hour is one with no fish, no fish lost and nothing scared: a lost fish means it bites,
    // a scare says nothing about the place (S.dry is null until the first hour that counts)
    if (n){ const sum = n*PRICE; S.money += sum; S.earnFish += sum; S.fishToday += n; logAdd(h+1, `<b>${what}</b>`); S.dry = 0; }
    else if (D.lost[w][h]) S.dry = 0;
    else if (!D.scare[w][h]){ logAdd(h+1, 'Тихо.'); S.dry = (S.dry || 0) + 1; }
    if (D.lost[w][h]) logAdd(h+1, 'Клюнуло, но рыба сорвалась.');
    if (nb.w === w && nb.present[h]){
      logAdd(h+1, nb.bites[h] ? 'У Михалыча клюнуло.' : 'У Михалыча пусто.');
      if (nb.leave === h) logAdd(h+1, nb.reason === 'full' ? 'Михалыч уходит с полным ведром.'
        : nbCaught() ? 'Михалыч сматывает удочки: «Всё, кончился клёв».' : 'Михалыч сматывает удочки: «Пустое дело».');
    }
    advance(1); S.hoursHere++;
    if (S.t < HOURS) lookAround();
    else {   // the day is over here: the screen offers only the way home. From the river the village across shows its light
      if (w === 'river') logAdd(S.t, S.noPower ? 'В деревне так и не зажёгся свет. Небось опять отключили.' : 'В деревне зажёгся свет.');
      logAdd(S.t, 'Вечереет, пора домой.');
    }
  } finally { busy = false; $('panel').classList.remove('busy'); }   // an error on the way must not leave the game untappable
  save(); render();
}
function endDay(){
  if (S.noPower) logAdd(S.t, 'Света так и нет. Зажёг керосинку.');   // the evening at home, the kerosene lamp on the sill
  if (S.planned !== S.day) spendDay();   // a day the morning did not decide (never, but for a save that missed it): by the same rules
  S.money -= daySpend();   // what the morning said the day would take (S.purchases): the remainder is the next morning's money
  closePage();   // the evening's page goes into the book, the day into the flyleaf's counts
  S.phase = 'evening'; save(); render();
}
// the best the day could give, knowing every hour: the moves the game has (an hour of tackle at home, a trip to a
// water that earns nothing on the way, an hour of fishing, the free walk home), as many trips as pay.
// V[t][p] is the most from hour t on, at home or at a water; ties keep the old man at home or on the same water.
// It is never shown: the evening's «если бы» line takes its fish from it ({val, runs}; no runs: tackle all day).
function bestPlan(){
  const C = S.D.catchT, V = [], how = [];
  for (let t = HOURS; t >= 0; t--){
    V[t] = {}; how[t] = {};
    if (t === HOURS){ V[t].home = 0; for (const w of WATERS) V[t][w] = 0; continue; }
    V[t].home = WAGE + V[t+1].home; how[t].home = 'craft';
    for (const w of WATERS) if (t + TRAVEL[w] < HOURS && V[t + TRAVEL[w]][w] > V[t].home){ V[t].home = V[t + TRAVEL[w]][w]; how[t].home = w; }
    for (const w of WATERS){
      const sit = C[w][t]*PRICE + V[t+1][w];
      if (sit >= V[t].home){ V[t][w] = sit; how[t][w] = 'sit'; } else { V[t][w] = V[t].home; how[t][w] = 'home'; }
    }
  }
  const runs = []; let t = 0, p = 'home';   // walk the best plan and gather its fishing hours
  while (t < HOURS){
    const m = how[t][p];
    if (p === 'home'){ if (m === 'craft') t++; else { t += TRAVEL[m]; p = m; } }
    else if (m === 'home') p = 'home';
    else { const r = runs[runs.length-1];
      if (r && r.w === p && r.to === t) r.to++; else runs.push({w: p, from: t, to: t+1}); t++; }
  }
  return {val: V[0].home, runs};
}

// ---------- the evening page and the book ----------
// The evening is a page of the diary in the old man's hand (should_I_lab's docs/05-dnevnik-i-hozyaystvo.md): the
// date and the weather; where and how long, the fish in words; the day's one event; at most one line of «если бы»;
// and what life took and what is left, always last. No table, no figures but the money. endDay() puts the page into
// the book (S.book, {d: day, p: [its lines]}) and adds the day to the flyleaf's counts (S.totals); both are saved,
// and a new game starts an empty book.
const MONTH_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const WEEKDAY_NAME = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];   // by getUTCDay()
const dateWords = day => { const t = dayDate(day); return `${t.getUTCDate()} ${MONTH_GEN[t.getUTCMonth()]}, ${WEEKDAY_NAME[t.getUTCDay()]}`; };
// the clock's hour after «с» and «до», as it is said: «с восьми до часу», «с одиннадцати до шести»
const HOUR_GEN = ['двенадцати', 'часу', 'двух', 'трёх', 'четырёх', 'пяти', 'шести', 'семи', 'восьми', 'девяти', 'десяти', 'одиннадцати'];
const hourGen = t => HOUR_GEN[(START + t) % 12];
const WATER_GEN = {river: 'реки', omut: 'омута', lake: 'озера'};
// a count of fish in words, as «рыба» wants it: «одна», «две», «двадцать пять»; past 99 in figures. acc: as the object
// of a verb («брало двадцать одну»), which changes only «одна»
const NUM_F = ['', 'одна', 'две', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять', 'десять', 'одиннадцать', 'двенадцать',
  'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
const NUM_TENS = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
const countWords = (n, acc = false) => {
  if (n < 1 || n > 99) return String(n);
  const s = n < 20 ? NUM_F[n] : NUM_TENS[Math.floor(n/10)] + (n % 10 ? ' ' + NUM_F[n % 10] : '');
  return acc ? s.replace(/одна$/, 'одну') : s;
};
const fishWords = n => n ? `${countWords(n)} ${plural(n, 'рыба', 'рыбы', 'рыб')}` : 'ни одной';
const noTotals = () => ({days: 0, water: 0, quiet: 0, home: 0, craft: 0, village: 0, nb: 0, weathers: [], earned: 0, crafted: 0});
// The day as it went, from S.trail ({k, t, n}: n hours at home from hour t, at the tackle, 'craft', or not, 'idle';
// or a trip to a water or the village, 'shop', that arrived at hour t): the stays at home, the village with the
// rumour heard there, and every water with the hours sat (one after another from the arrival), its fish, what was
// lost, scared or seen there, and the neighbour if the old man saw him there.
function dayParts(){
  const D = S.D, nb = D.nb, trail = S.trail || [], parts = [];
  trail.forEach((e, i) => {
    if (e.k === 'craft' || e.k === 'idle'){
      let p = parts[parts.length - 1];
      if (!p || p.k !== 'home') parts.push(p = {k: 'home', craft: 0, idle: 0});
      p[e.k] += e.n || 1; p.to = e.t + (e.n || 1);
    }
    else if (e.k === 'shop') parts.push({k: 'shop', t: e.t, rumor: D.rumor[Math.min(e.t, HOURS - 1)]});
    else if (WATERS.includes(e.k)){
      const w = e.k, until = trail[i + 1] ? trail[i + 1].t : HOURS, hrs = S.presence[w].filter(h => h >= e.t && h < until);
      const v = {k: 'water', w, from: e.t, to: e.t + hrs.length, hrs, fish: 0, lost: 0, scare: false, boil: false, nb: false, nbLeft: false};
      for (const h of hrs){ v.fish += D.catchT[w][h]; v.lost += D.lost[w][h] ? 1 : 0; v.scare = v.scare || D.scare[w][h]; v.boil = v.boil || D.boil[w][h]; }
      if (nb.w === w && hrs.length){   // he was there while the old man sat: the hours sat, and the look round after them
        v.nb = nb.present.some((on, h) => on && h >= v.from && h <= Math.min(v.to, HOURS - 1));
        v.nbLeft = nb.leave != null && nb.leave >= v.from && nb.leave < v.to;
      }
      parts.push(v);
    }
  });
  return parts;
}
// The prose: the date and the weather («, к обеду …» when it changed at 11:00), then where and how long, a sentence
// for every part of the day, with the day's one event after the part it happened in (the first of EVENTS the day
// has), and on a day without power the evening's kerosene lamp
function dayProse(parts){
  const D = S.D, ws = D.weathers || [D.weather], w0 = ws[0], w1 = ws[ws.length - 1], trips = parts.some(p => p.k !== 'home');
  const date = `${dateWords(S.day)}. ${cap(WEATHER_NAME[w0])}${w1 !== w0 ? ', к обеду ' + WEATHER_NAME[w1] : ''}.`;
  const said = [];
  parts.forEach((p, i) => said.push(sentence(p, i)));
  function sentence(p, i){
    if (p.k === 'home'){
      if (!trips) return p.craft && p.craft >= p.idle ? 'Весь день дома, снасти.' : 'Весь день дома.';
      if (i === 0) return p.craft < 2 ? '' : p.to <= CHANGE_HOUR ? 'Утром дома, снасти.' : `До ${hourGen(p.to)} дома, снасти.`;
      return p.craft ? 'Потом дома, снасти.' : 'Потом дома.';
    }
    if (p.k === 'shop'){   // after anything already told: «Потом»; the village again: «опять», and its word only if new
      const r = p.rumor, then = said.some(Boolean), before = parts.slice(0, i).filter(q => q.k === 'shop');
      const heard = before.some(q => q.rumor.w === r.w && q.rumor.lv === r.lv);
      return `${then ? 'Потом' : p.t <= CHANGE_HOUR ? 'Утром' : 'Днём'}${before.length ? ' опять' : ''} в деревню.` + (heard ? ''
        : r.w && r.lv ? ` Говорят, ${WHERE[r.w]} ${r.lv === 2 ? 'берёт' : 'клюёт помаленьку'}.` : ' Говорят, нигде не клюёт.');
    }
    return p.to > p.from ? `${NAME[p.w]} с ${hourGen(p.from)} до ${hourGen(p.to)} — ${fishWords(p.fish)}.` : `Дошёл до ${WATER_GEN[p.w]} и повернул назад.`;
  }
  if (!parts.length) said.push('Весь день дома.');
  const ev = EVENTS.map(f => f(parts)).find(Boolean);
  if (ev) said.splice(ev[0] < 0 ? said.length : ev[0] + 1, 0, ev[1]);
  if (S.noPower) said.push('Света так и нет. Зажёг керосинку.');
  return [date, said.filter(Boolean).join(' ')];
}
// the day's events, the most notable first: each looks for its own in the day's parts and gives [the part it goes
// after (-1: the end), its words], or nothing
const EVENTS = [
  parts => { const i = parts.findIndex(p => p.nbLeft && S.D.nb.reason === 'full');
    return i >= 0 && [i, `Михалыч сидел до ${hourGen(S.D.nb.leave + 1)}, ушёл с полным ведром.`]; },
  parts => {   // the village's word, checked on the water the old man went to straight from it
    for (let i = 0; i + 1 < parts.length; i++){
      const p = parts[i], v = parts[i + 1], r = p.rumor;
      if (p.k !== 'shop' || v.k !== 'water' || v.to === v.from) continue;
      if (r.w && r.lv && r.w === v.w) return [i + 1, v.fish ? 'Бабки не соврали.' : 'Бабки наврали.'];
      if (!(r.w && r.lv) && v.fish !== 1) return [i + 1, v.fish ? 'Бабки наврали.' : 'Бабки не соврали.'];
    }
  },
  parts => { const i = parts.findIndex(p => p.boil); return i >= 0 && [i, 'У камыша плескало, потому и остался.']; },
  // a pike's shadow comes an hour in twenty: after the neighbour's full bucket, the village's word and the reeds, so
  // that it does not take the place of the rarer ones on most days at the water
  parts => { const i = parts.findIndex(p => p.scare); return i >= 0 && [i, 'У берега мелькнула большая тень.']; },
  parts => { const p = parts.filter(p => p.lost).sort((a, b) => b.lost - a.lost)[0];
    return p && [parts.indexOf(p), `${cap(countWords(p.lost))} ${plural(p.lost, 'сорвалась', 'сорвались', 'сорвались')}.`]; },
  parts => { const i = parts.findIndex(p => p.nb);
    return i >= 0 && [i, !parts[i].nbLeft ? 'Михалыч сидел рядом.' : nbCaught() ? 'Михалыч ушёл, когда перестало клевать.' : 'Михалыч ушёл пустым.']; },
  parts => { const ws = S.D.weathers || [S.D.weather];   // a day at home in the rain
    return !parts.some(p => p.k !== 'home') && (ws.includes(5) ? [-1, 'За окном лило.'] : ws.includes(2) && [-1, 'За окном моросило.']); },
  () => !S.fishToday && [-1, 'Тихий день был.'],
];
// «Если бы»: what the old man could not have known, in fish, one construction and one feeling. His own water, when he
// left it before the evening: what it gave after he left (two or more: a pity; none: good that he left; one:
// nothing). Else the day's best plan (bestPlan()): on a water he did not fish, three fish or more over his catch; or
// tackle all day, when that would have earned more than he did. Else nothing.
function ifLine(parts){
  const C = S.D.catchT, waters = parts.filter(p => p.k === 'water'), last = waters[waters.length - 1];
  if (last && last.to < HOURS){
    const n = C[last.w].slice(last.to).reduce((s, x) => s + x, 0);
    const was = plural(n, 'была', 'было', 'было');   // «была бы ещё двадцать одна», «было бы ещё четыре»
    return n >= 2 ? `Если бы остался, ${was} бы ещё ${countWords(n)}. Жаль.` : n ? '' : 'Если бы остался, больше ничего не взял бы. Хорошо, что ушёл.';
  }
  const best = bestPlan(), by = {};
  for (const r of best.runs){
    const b = by[r.w] || (by[r.w] = {w: r.w, from: r.from, fish: 0});
    for (let h = r.from; h < r.to; h++) b.fish += C[r.w][h];
  }
  const top = Object.values(by).sort((a, b) => b.fish - a.fish)[0];
  if (top && !waters.some(p => p.w === top.w && p.to > p.from) && top.fish - S.fishToday >= 3){
    const from = START + top.from === 12 || START + top.from === 13 ? 'с обеда' : `с ${hourGen(top.from)}`;
    return `А ${WHERE[top.w]} ${from} брало ${countWords(top.fish, true)}.`;
  }
  return !best.runs.length && S.earnFish + S.earnWork < HOURS*WAGE ? 'Дома, за снастями, вышло бы больше.' : '';
}
// What life took this evening (S.purchases, from spendDay()) and what is left, always the page's last line: the
// purchases in one phrase after «На», a big thing with its first part among them, its later parts each after «За»
const known = p => !!p && !!(GOODS[p.id] || BREAKS[p.id] || SEASON[p.id] || TREATS[p.id]);
function spendLine(){
  const all = (S.purchases || []).filter(known), later = p => p.part === 'more' || p.part === 'last', now = all.filter(p => !later(p));
  const names = now.map(p => nameOf(p.id)), out = [];
  if (names.length) out.push(`На ${names.length > 1 ? names.slice(0, -1).join(', ') + ' и ' + names[names.length - 1] : names[0]} ушло ${now.reduce((s, p) => s + p.price, 0)}.`);
  all.filter(later).forEach(p => out.push(`За ${nameOf(p.id)} отдал ${p.part === 'last' ? 'последние' : 'ещё'} ${p.price}.`));
  out.push(S.money > 0 ? `В копилке осталось ${S.money}.` : S.money < 0 ? `В долгу ${-S.money}.` : 'В копилке пусто.');
  return out.join(' ');
}
// the evening's page, as the book keeps it
function eveningPage(parts = dayParts()){ return {d: S.day, p: [...dayProse(parts), ifLine(parts), spendLine()].filter(Boolean)}; }
// The evening: its page into the book, and the day into the flyleaf's counts: the days; the hours on the water and,
// of them, the quiet ones (no fish, none lost, nothing scared); the hours at home (the day less the ways there and the
// water) and, of them, at the tackle; the trips to the village; the days the neighbour was there; the weathers seen;
// what was earned, and what tackle alone would have given
function closePage(){
  const D = S.D, T = S.totals, parts = dayParts(), trail = S.trail || [];
  S.book.push(eveningPage(parts));
  const sat = WATERS.reduce((s, w) => s + S.presence[w].length, 0);
  const quiet = WATERS.reduce((s, w) => s + S.presence[w].filter(h => !D.catchT[w][h] && !D.lost[w][h] && !D.scare[w][h]).length, 0);
  const home = Math.max(0, HOURS - sat - trail.reduce((s, e) => s + (TRAVEL[e.k] || 0), 0));
  // the hours at the tackle as the day went (S.trail), and the pay they got: a day saved before the tackle paid 5 an
  // hour was paid 10, and so would tackle all day have been
  const craft = trail.reduce((s, e) => s + (e.k === 'craft' ? e.n || 1 : 0), 0), wage = craft && S.earnWork ? Math.round(S.earnWork/craft) : WAGE;
  T.days++; T.water += sat; T.quiet += quiet; T.home += home; T.craft += Math.min(home, craft);
  T.village += trail.filter(e => e.k === 'shop').length; T.nb += parts.some(p => p.nb) ? 1 : 0;
  T.weathers = [...new Set([...T.weathers, ...(D.weathers || [D.weather])])];
  T.earned += (S.earnFish || 0) + (S.earnWork || 0); T.crafted += HOURS*wage;
}
// a one-letter word stays with the next one, and a dash with the word before it (no-break spaces, in the font)
const tie = s => s.replace(/ —/g, '\u00a0—').replace(/(^|\s)([вВиИаАсСуУкКоО]) /g, '$1$2\u00a0').replace(/(^|\s)([вВиИаАсСуУкКоО]) /g, '$1$2\u00a0');
const pageHTML = pg => pg.p.map((s, i) => `<p${i ? '' : ' class="date"'}>${tie(s)}</p>`).join('');
function eveningHTML(){
  const last = S.book[S.book.length - 1];
  return `<div class="page" id="page">${pageHTML(last && last.d === S.day ? last : eveningPage())}</div>`;
}
// The evening fits the screen: the scene gives the page and the buttons the room they take (--eve), down to its
// floor; past that the page scrolls in its box, and an edge with more beyond it fades. Measured, as the lines depend
// on the width and the font: on every screen, and again when the window changes size and when the font has loaded.
function fitEvening(){
  const pg = $('page'); if (!pg || S.phase !== 'evening') return;
  const P = $('panel'), cs = getComputedStyle(P), acts = P.querySelector('.actions');
  const need = parseFloat(cs.paddingTop) + parseFloat(cs.borderTopWidth) + pg.scrollHeight + (parseFloat(cs.rowGap) || 0) + acts.offsetHeight;
  $('wrap').style.setProperty('--eve', `${Math.ceil(need)}px`);
  const edges = () => { pg.classList.toggle('up', pg.scrollTop > .5); pg.classList.toggle('down', pg.scrollTop + pg.clientHeight < pg.scrollHeight - .5); };
  edges(); pg.onscroll = edges;
}
// The book, a screen of its own over the izba or the evening: the flyleaf (once a day is over), then every evening's
// page, the newest at the bottom; today's page is the journal hour by hour, and at the evening the evening's page
// under it. It opens at the bottom, as the journal shows its newest line; closing it goes back where it came from.
let bookOpen = false;
function flyleaf(){
  const T = S.totals, n = (x, a, b, c) => `${x} ${plural(x, a, b, c)}`;
  return [`Лето: ${n(T.days, 'день', 'дня', 'дней')}. `
    + (T.water ? `На воде ${n(T.water, 'час', 'часа', 'часов')}, ${T.quiet ? 'тихих ' + T.quiet : 'тихих не было'}. ` : 'На воде ни часу. ')
    + (T.home ? `Дома ${T.home}, за снастями ${T.craft || 'ни часу'}. ` : 'Дома ни часу. ')
    + (T.village ? `В деревне ${n(T.village, 'раз', 'раза', 'раз')}. ` : 'В деревне ни разу. ')
    + `Михалыч — ${T.nb ? n(T.nb, 'день', 'дня', 'дней') : 'ни разу'}. Погод перевидено ${T.weathers.length}.`,
    `Заработано ${T.earned}. Снасти дома дали бы ${T.crafted}.`];
}
function bookHTML(){
  const pages = S.book.slice(), last = pages[pages.length - 1], today = S.phase === 'evening' && last && last.d === S.day ? pages.pop() : null;
  return `<div class="book">${S.totals.days ? `<div class="flyleaf">${flyleaf().map(s => `<p>${tie(s)}</p>`).join('')}</div>` : ''}`
    + pages.map(pg => `<div class="day">${pageHTML(pg)}</div>`).join('')
    // today: its date on top (at the evening the page's own date and weather), the journal, then the rest of the page
    + `<div class="day"><p class="date">${today ? tie(today.p[0]) : `${dateWords(S.day)}.`}</p><div class="rows">${logRows()}</div>`
    + `${today ? today.p.slice(1).map(s => `<p>${tie(s)}</p>`).join('') : ''}</div></div>`;
}
function openBook(){
  if (busy) return;
  bookOpen = true; render();
  if (window.scrollTo) scrollTo(0, document.documentElement.scrollHeight);   // today's page, at the bottom
}
function closeBook(){ bookOpen = false; render(); }
// a day saved before S.trail: its way so far from the journal's lines (a trip by its arrival, an hour at home by the
// line written when it was over); at the evening, the hours «Мастерить до вечера» took, which wrote no line then: from
// the hour he was back home to the evening, if the day earned more at the tackle than its hour lines say. Counted in
// hours, not in money: a day saved before the tackle paid 5 an hour paid 10
const IDLE_LINES = ['Посидел у окна.', 'Попил чаю, посмотрел в окно.', 'Посидел в полумраке, послушал ходики.', 'Посидел просто так.', KETTLE];
function trailFromLog(){
  const trail = [], at = e => parseInt(e.t, 10) - START, arrived = {'Деревня. Бабки на лавке у магазина.': 'shop'};
  WATERS.forEach(w => { arrived[`${NAME[w]}. Закинул удочку.`] = w; });
  let paid = 0;   // what the hour lines at the tackle say they earned
  for (const e of S.log){
    if (!e || typeof e.text !== 'string' || !Number.isFinite(at(e))) continue;
    const m = /^Мастерил снасти, \+(\d+) ₽\.$/.exec(e.text);
    if (arrived[e.text]) trail.push({k: arrived[e.text], t: at(e)});
    else if (m){ trail.push({k: 'craft', t: at(e) - 1}); paid += +m[1]; }
    else if (IDLE_LINES.includes(e.text)) trail.push({k: 'idle', t: at(e) - 1});
  }
  const last = trail[trail.length - 1], P = S.presence || {};
  // back home: after the last hour at home, the hours sat at the last water (the walk home takes none), or the village
  const home = !last ? 0 : last.k === 'craft' || last.k === 'idle' ? last.t + 1
    : WATERS.includes(last.k) ? last.t + ((P[last.k] || []).filter(h => h >= last.t).length) : last.t;
  if (S.phase === 'evening' && (S.earnWork || 0) > paid && home < HOURS) trail.push({k: 'craft', t: home, n: HOURS - home});
  return trail;
}
addEventListener('resize', () => { fitEvening(); aimAll(); fitLog(); });
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { fitEvening(); aimAll(); fitLog(); });
let askRestart = false;   // the evening's 'start again' waits for a second tap
function nextDay(){
  askRestart = false; S.day++; startDay(); save(); render();
}
// a new game: the save is wiped, the title screen and the backstory come again
function restart(){
  askRestart = false;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  newSeason(); save(); render(); showSplash();
}
// a new game is saved at once, so a reload before the first day keeps it: its seed, so the same weather on the screens
// before the first day and the same first day
if (!load()){ newSeason(); save(); }
hush();
// the title screen opens a new game, then the backstory, the yard and the first morning; later launches go straight to
// the saved game (one saved before the first day comes back to the title screen, then to the screen it was on). The
// title screen is a living scene (introScene) over its still picture; the picture shows only if the scene cannot be drawn.
let splashLive = null;
function fitSplash(){   // the scene where the picture is: covering the frame, centred across and 80% down, as its CSS
  if ($('splash').hidden) return;
  const f = $('splash').firstElementChild, cv = $('splashCanvas'), [pw, ph] = LiveScenes.SIZE.splash;
  const fw = f.clientWidth, fh = f.clientHeight, k = Math.max(fw/pw, fh/ph), w = pw*k, h = ph*k;
  Object.assign(cv.style, {width: `${w}px`, height: `${h}px`, left: `${(fw - w)/2}px`, top: `${(fh - h)*.8}px`});
}
function endSplash(){
  $('splash').hidden = true; $('splash').classList.remove('live'); $('splashCanvas').hidden = true;
  if (splashLive){ splashLive.destroy(); splashLive = null; }
}
function showSplash(){
  const kb = !!document.activeElement && $('panel').contains(document.activeElement);
  endSplash();
  $('splashImg').src = IMG.splash; $('splashGo').disabled = false; $('splash').hidden = false;
  const cv = $('splashCanvas'); cv.hidden = false; $('splash').classList.add('live'); fitSplash();
  const sc = splashLive = LiveScenes.create(cv, introScene('splash'));
  sc.ready().then(ok => { if (!ok && splashLive === sc){ $('splash').classList.remove('live'); cv.hidden = true; } });
  tapLock = performance.now() + TAP_LOCK;
  if (kb) $('splashGo').focus({preventScroll: true});
}
$('splashGo').onclick = () => {
  if (tapsLocked()) return;
  const kb = document.activeElement === $('splashGo');
  endSplash(); render();
  if (kb){ const b = $('panel').querySelector('button:not(:disabled)'); if (b) b.focus({preventScroll: true}); }
};
addEventListener('resize', fitSplash);
render(); if (INTRO.has(S.phase)) showSplash();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
