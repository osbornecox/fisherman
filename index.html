          --reserve: 292px;     /* room the panel keeps under the scene on a day screen */
          --eve: 404px;         /* on the evening: the sums, the hour grid and the buttons */
          --ask: 0px; }         /* and the restart question with its buttons, while it is asked (.wrap.ask) */
  * { box-sizing: border-box; }
  html, body { margin:0; background:#1d1c1a; color:var(--ink); font-family:'Stay Pixel', monospace; }
  body { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  b, strong { font-weight:600; }
  /* The page is the screen: the safe areas are padding inside .wrap (the strip under the status bar stays dark),
     and on a day screen .wrap is exactly the screen's height, so the buttons are always on it */
  .wrap { max-width: 430px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; padding-top: var(--top);
          background: linear-gradient(#1d1c1a, #1d1c1a) top / 100% var(--top) no-repeat, var(--paper); display:flex; flex-direction:column; }
  .wrap.fit { height: 100vh; height: 100dvh; }
  /* On a short screen the scene gives up its top (the sky; in the izba its bottom, the table), at most a quarter of it
     (more on a very short screen and on the evening, below) */
  .scene { position: relative; flex: none; width: 100%; aspect-ratio: 130 / 180; overflow: hidden; background:#9ea7a8;
           max-height: max(calc(min(100vw, 430px) * 1.04), calc(100vh - var(--top) - var(--bot) - var(--reserve)));
           max-height: max(calc(min(100vw, 430px) * 1.04), calc(100dvh - var(--top) - var(--bot) - var(--reserve))); }
  /* the evening scrolls, but its first screen shows the sums and the hour grid above the buttons: the scene gives way */
  .wrap.eve .scene { max-height: max(calc(min(100vw, 430px) * .6), calc(100vh - var(--top) - var(--bot) - var(--eve) - var(--ask)));
                     max-height: max(calc(min(100vw, 430px) * .6), calc(100dvh - var(--top) - var(--bot) - var(--eve) - var(--ask))); }
  .wrap.ask { --ask: 36px; }
  @media (max-width: 371px) { .wrap.ask { --ask: 56px; } }   /* the question takes two lines */
  .scene img { position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover; object-position:center bottom; image-rendering: pixelated; }
  .scene img.top { object-position:center top; }
  .hud { position:absolute; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; gap:8px; z-index:3; }
  .chip { background: var(--paper); padding:6px 10px; font-size:16px; font-weight:600; box-shadow: 0 0 0 2px var(--ink); }
  .chip small { display:block; font-size:12px; font-weight:400; margin-top:2px; color:var(--sub); }
  #hudMoney { text-align:right; }
  .toast { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); background:var(--paper); box-shadow:0 0 0 2px var(--ink);
           padding:10px 14px; font-size:18px; font-weight:600; opacity:0; transition:opacity .25s; pointer-events:none; text-align:center; white-space:nowrap; z-index:3; }
  .toast.show { opacity:1; }
  .panel { flex:1 1 auto; min-height:0; padding: 14px 16px 0; display:flex; flex-direction:column; gap:10px; border-top: 3px solid var(--line); }
  .panel.busy { pointer-events:none; }   /* while an hour passes: no taps, and nothing on screen changes */
  .meta { display:flex; justify-content:space-between; gap:8px; font-size:14px; color:var(--sub); }
  .lines { display:flex; flex-direction:column; gap:4px; font-size:16px; line-height:1.3; }
  .title { font-size:20px; font-weight:600; }
  /* the buttons stay at the bottom of the screen even when the page above them is longer (the evening) */
  .actions { margin-top:auto; display:flex; flex-direction:column; gap:8px; position:sticky; bottom:0; z-index:1;
             background:var(--paper); padding: 4px 0 calc(18px + var(--bot)); }
  .grid { display:grid; gap:6px; }
  button { font-family:'Stay Pixel', monospace; color:var(--ink); cursor:pointer; touch-action: manipulation; }
  button:disabled { opacity:.35; cursor:default; }
  .primary { min-height:54px; background:var(--ink); color:var(--paper); border:none; font-size:18px; font-weight:600; }
  .secondary { min-height:50px; background:transparent; border:2px solid var(--ink); font-size:14px; line-height:1.15; padding:4px; }
  .link { min-height:44px; background:transparent; border:none; font-size:15px; text-decoration:underline; }
  .reveal { display:grid; grid-template-columns: 62px repeat(10, minmax(0,1fr)); gap:2px; font-size:12px; align-items:center; }
  .reveal .h { text-align:center; color:var(--sub); }
  .cell { height:22px; background:#d6cfbf; display:flex; align-items:center; justify-content:center; font-size:11px; }
  .cell.you { box-shadow: inset 0 0 0 2px var(--ink); }
  .cell.f { background:#9fb0a2; }
  .cell.big { background:#c99a5a; }
  .cell.na { background: repeating-linear-gradient(135deg, #d6cfbf 0 2px, transparent 2px 6px); opacity:.7; }   /* still on the way there */
  .sum { display:grid; grid-template-columns: 1fr auto; gap:2px 10px; font-size:15px; }
  .sum b { font-weight:600; }
  /* the journal shows up to about five lines; on a short screen it gives way down to three (journal() sets min-height) */
  .log { flex: 0 1 auto; max-height: 6.7em; overflow-y: auto; display:flex; flex-direction:column; gap:2px; font-size:15px; line-height:1.3;
         padding: 6px 0; border-top: 1px solid #b9b1a0; border-bottom: 1px solid #b9b1a0; -webkit-overflow-scrolling: touch; user-select: text; -webkit-user-select: text; }
  .log > div { display:flex; gap:8px; }
  .log .tm { flex: 0 0 2.9em; color: var(--sub); }
  .note { font-size:14px; color:var(--sub); line-height:1.35; }
  .splash { position:fixed; inset:0; z-index:10; background:#55663f; display:flex; justify-content:center; }
  .splash[hidden] { display:none; }
  .splash .frame { position:relative; width:100%; max-width:430px; height:100%; overflow:hidden; }
  .splash img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center bottom; image-rendering:pixelated; }
  /* the title is light like the tag, with a dark pixel outline: it lies on the forest on a short screen and on the
     sky on a tall one (or half on each), and reads on both */
  .splash .name { position:absolute; top:calc(env(safe-area-inset-top) + 7.5%); left:16px; right:16px; text-align:center; font-size:38px; font-weight:600; line-height:1.1;
                  color:#f3efe4; --o:rgba(43,41,37,.85);
                  text-shadow: 2px 0 0 var(--o), -2px 0 0 var(--o), 0 2px 0 var(--o), 0 -2px 0 var(--o),
                    2px 2px 0 var(--o), -2px 2px 0 var(--o), 2px -2px 0 var(--o), -2px -2px 0 var(--o), 0 4px 0 rgba(0,0,0,.3); }
  .splash .start { position:absolute; bottom:calc(env(safe-area-inset-bottom) + 86px); left:50%; transform:translateX(-50%); width:200px; min-height:54px;
                   background:var(--paper); color:var(--ink); border:3px solid var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.35); font-size:20px; font-weight:600; }
  .splash .tag { position:absolute; bottom:calc(env(safe-area-inset-bottom) + 36px); left:16px; right:16px; text-align:center; color:#f3efe4;
                 font-size:18px; font-weight:500; text-shadow:0 2px 0 rgba(0,0,0,.35); }
  .story { gap:8px; }
  .story p { margin:0; }
  /* too low for the scene and the panel together (a short window): the page scrolls; a phone on its side gets .turn */
  @media (max-height: 540px) { .wrap.fit { height: auto; } }
  /* a phone with the browser's bars: a little less air in the panel, so the scene keeps more of its picture */
  @media (max-height: 800px) {
    :root { --reserve: 256px; --eve: 376px; }
    .panel { padding-top: 10px; gap: 8px; }
    .actions { gap: 6px; padding: 2px 0 calc(12px + var(--bot)); }
    .primary { min-height: 48px; }
    .secondary { min-height: 46px; }
    .link { min-height: 36px; }
  }
  /* a short phone in its browser (an iPhone SE in Safari): the scene may give up more of the picture, so that a day
     screen with the journal at its three lines still fits the screen */
  @media (max-height: 620px) {
    :root { --reserve: 266px; }
    .scene { max-height: max(calc(min(100vw, 430px) * .8), calc(100vh - var(--top) - var(--bot) - var(--reserve)));
             max-height: max(calc(min(100vw, 430px) * .8), calc(100dvh - var(--top) - var(--bot) - var(--reserve))); }
    /* and the evening's scene may shrink to a strip, so the whole hour grid and the question stay above the buttons */
    .wrap.eve .scene { max-height: max(calc(min(100vw, 430px) * .4), calc(100vh - var(--top) - var(--bot) - var(--eve) - var(--ask)));
                       max-height: max(calc(min(100vw, 430px) * .4), calc(100dvh - var(--top) - var(--bot) - var(--eve) - var(--ask))); }
  }
  /* a phone on its side: the game is made for an upright phone, so it only asks to turn it */
  .turn { display:none; }
  @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
    html, body { overflow:hidden; }
    .wrap, .splash { visibility:hidden; }
    .turn { display:flex; position:fixed; inset:0; z-index:30; align-items:center; justify-content:center; padding:24px;
            background:var(--paper); color:var(--ink); font-size:20px; font-weight:600; line-height:1.3; text-align:center; }
  }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="scene">
    <img id="bg" alt="">
    <img id="bg2" alt="" aria-hidden="true">
    <div class="hud"><div class="chip" id="hudTime"></div><div class="chip" id="hudMoney"></div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="sr" id="say" role="log" aria-live="polite"></div>
</div>
<div class="splash" id="splash" hidden>
  <div class="frame">
    <img id="splashImg" alt="Старая изба на зелёном склоне над рекой, за рекой гора в тайге">
    <div class="name">Уйти или остаться</div>
    <button type="button" class="start" id="splashGo">Начать</button>
    <div class="tag">Игра про рыбалку и жизнь</div>
  </div>
</div>
<div class="turn" id="turn">Разверните телефон вертикально</div>

// On a sunny day the water glints gather under the sun and follow it, as daytime.py has them (weather.sun with
// glint_x): the chance of a glint per water pixel falls off with the distance from the sun's x. The sunny picture
// comes with glints scattered evenly; they are put back to the water under them: weather.sun paints a water pixel
// from its clean colour alone (warmed, then mixed with the sky's blue), so the picture's other pixels of that clean

  if (lo === hi) return DAY_KEYS[lo];

const lerp3 = (x,y,t) => x.map((v,i)=>v*(1-t)+y[i]*t);
const clamp8 = v => Math.max(0, Math.min(255, Math.round(v)));

async function drawLit(loc, weather, h){

// The izba from inside is lit the way daytime.py's izba_light does it, and the cuckoo clock and the calendar are
// drawn first, the way izba.py draws them: IMG.izba and IMG.izbaClosed come with no hands, no weights and a clean
// calendar sheet. Keep the numbers here, in daytime.py and in izba.py the same.
const IZ_LIGHT = {overcast:[1,1,1], sun:[1.06,1.03,.95], rain:[.95,.95,.97], downpour:[.84,.85,.88], wind:[1,1,1.01], fog:[.98,.98,.99]};

const glyphs = o => Object.fromEntries(Object.entries(o).map(([k,v]) => [k, v.split(' ')]));

  2:'.XXX. XX.XX ...XX ..XX. .XX.. XX... XXXXX', 3:'XXXX. ...XX ...XX .XXX. ...XX ...XX XXXX.',
  4:'XX.XX XX.XX XX.XX XXXXX ...XX ...XX ...XX', 5:'XXXXX XX... XXXX. ...XX ...XX XX.XX .XXX.',
  6:'.XXX. XX... XX... XXXX. XX.XX XX.XX .XXX.', 7:'XXXXX ...XX ..XX. ..XX. .XX.. .XX.. .XX..',
  8:'.XXX. XX.XX XX.XX .XXX. XX.XX XX.XX .XXX.', 9:'.XXX. XX.XX XX.XX .XXXX ...XX ...XX .XXX.'});

// ---------- rng ----------
let seed = Math.floor(Math.random()*1e9);
function rnd(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }
function pick(p){ let r=rnd(), a=0; for(let i=0;i<p.length;i++){ a+=p[i]; if(r<a) return i; } return p.length-1; }
function poisson(l){ if(l<=0) return 0; const L=Math.exp(-l); let k=0,p=1; while(true){ p*=rnd(); if(p<=L) return k; k++; } }
function choice(a){ return a[Math.floor(rnd()*a.length)]; }

// ---------- state ----------
let S = null;
function newSeason(){
  S = { day:1, money:0, history:[], phase:'intro' };
}
function genDay(){
  const weather = pick(WEATHER_P);   // the morning
  let later = weather;
  if (weather === 4 || rnd() < CHANGE_P){ const nx = NEXT[weather]; later = nx[pick(nx.map(x=>x[1]))][0]; }
  const weathers = Array.from({length:HOURS}, (_,h)=> h < CHANGE_HOUR ? weather : later);
  const level = {}, catchT = {}, ripple = {}, boil = {}, bubbles = {}, lost = {}, scare = {}, midge = {};
  for (const w of WATERS){
    const a = pick(LEVEL_P[w][weather]), b = later === weather ? a : pick(LEVEL_P[w][later]);
    level[w] = Array.from({length:HOURS}, (_,h)=> h < CHANGE_HOUR ? a : b);
    catchT[w] = []; ripple[w] = []; boil[w] = []; bubbles[w] = []; lost[w] = []; scare[w] = []; midge[w] = [];
    for (let h=0; h<HOURS; h++){
      const lv = level[w][h], sc = rnd() < SCARE, n = poisson(RATE[w][lv]);
      catchT[w].push(sc ? 0 : n); scare[w].push(sc);
      ripple[w].push(rnd() < RIPPLE[lv]); boil[w].push(rnd() < BOIL[lv]); bubbles[w].push(rnd() < BUBBLES[lv]);
      lost[w].push(!sc && rnd() < LOST[lv]);
      midge[w].push(CALM.includes(weathers[h]) && rnd() < MIDGE[lv]);
    }
  }
  // the neighbour: comes at 6-8, leaves after two empty hours or with a full bucket
  const nb = {w:null, arrive:null, leave:null, reason:null, present:Array(HOURS).fill(false), bites:Array(HOURS).fill(0)};
  if (rnd() < NEIGHBOR_P){
    if (rnd() < NEIGHBOR_SMART){ const top = Math.max(...WATERS.map(w=>level[w][0])); nb.w = choice(WATERS.filter(w=>level[w][0]===top)); }
    else nb.w = choice(WATERS);
    nb.arrive = Math.floor(rnd()*3);
    let dry = 0, total = 0;
    for (let h=nb.arrive; h<HOURS; h++){
      nb.present[h] = true;
      const n = scare[nb.w][h] ? 0 : poisson(RATE[nb.w][level[nb.w][h]]);
      nb.bites[h] = n; total += n; dry = n ? 0 : dry+1;
      if (h < HOURS-1 && dry >= 2){ nb.leave = h; nb.reason = 'empty'; break; }

  S.presence[w].push(h);
  $('panel').classList.add('busy');   // no taps while the hour passes; the screen stays as it is
  frame(w, h + 1).draw().catch(() => {});   // the next hour's picture, if idle time has not drawn it yet
  setTimeout(()=>{
    const D = S.D, nb = D.nb;
    if (D.scare[w][h]) logAdd(h+1, 'У берега мелькнула большая тень, мелочь брызнула врассыпную.');
    // a quiet hour is one with no fish, no fish lost and nothing scared: a lost fish means it bites,
    // a scare says nothing about the place (S.dry is null until the first hour that counts)
    if (n){ const sum = n*PRICE; S.money += sum; S.earnFish += sum; S.fishToday += n;
      const what = `${n > 1 ? fishWord(n) : 'Рыба'} +${sum} ₽`; toast(what); logAdd(h+1, `<b>${what}</b>`); S.dry = 0; }
    else if (D.lost[w][h]){ toast('Сорвалась'); S.dry = 0; }
    else if (D.scare[w][h]) toast('Пусто');
    else { toast('Тихо'); logAdd(h+1, 'Тихо.'); S.dry = (S.dry || 0) + 1; }
    if (D.lost[w][h]) logAdd(h+1, 'Клюнуло, но рыба сорвалась.');
    if (nb.w === w && nb.present[h]){
      logAdd(h+1, nb.bites[h] ? 'У Михалыча клюнуло.' : 'У Михалыча пусто.');
      if (nb.leave === h) logAdd(h+1, nb.reason === 'full' ? 'Михалыч уходит с полным ведром.'
        : nbCaught() ? 'Михалыч сматывает удочки: «Всё, кончился клёв».' : 'Михалыч сматывает удочки: «Пустое дело».');
    }
    advance(1); S.hoursHere++;
    if (S.t < HOURS) lookAround();
    else logAdd(S.t, 'Вечереет, пора домой.');   // the day is over here: the screen offers only the way home
    busy = false; $('panel').classList.remove('busy');
    save(); render();
  }, 750);
}
function endDay(){
  const earned = S.earnFish + S.earnWork;
  S.history.push({day:S.day, earned});
  S.phase = 'evening'; save(); render();
}
// the best the day could give, knowing every hour: the moves the game has (an hour of tackle at home, a trip to a
// water that earns nothing on the way, an hour of fishing, the free walk home), as many trips as pay.
// V[t][p] is the most from hour t on, at home or at a water; ties keep the old man at home or on the same water.
const BEST_NONE = 'весь день снасти';
function bestPlan(){
  const C = S.D.catchT, V = [], how = [];
  for (let t = HOURS; t >= 0; t--){
    V[t] = {}; how[t] = {};
    if (t === HOURS){ V[t].home = 0; for (const w of WATERS) V[t][w] = 0; continue; }
    V[t].home = WAGE + V[t+1].home; how[t].home = 'craft';
    for (const w of WATERS) if (t + TRAVEL[w] < HOURS && V[t + TRAVEL[w]][w] > V[t].home){ V[t].home = V[t + TRAVEL[w]][w]; how[t].home = w; }
    for (const w of WATERS){
      const sit = C[w][t]*PRICE + V[t+1][w];
      if (sit >= V[t].home){ V[t][w] = sit; how[t][w] = 'sit'; } else { V[t][w] = V[t].home; how[t][w] = 'home'; }
    }
  }
  const runs = []; let t = 0, p = 'home';   // walk the best plan and gather its fishing hours
  while (t < HOURS){
    const m = how[t][p];
    if (p === 'home'){ if (m === 'craft') t++; else { t += TRAVEL[m]; p = m; } }
    else if (m === 'home') p = 'home';
    else { const r = runs[runs.length-1];
      if (r && r.w === p && r.to === t) r.to++; else runs.push({w: p, from: t, to: t+1}); t++; }
  }
  const label = runs.map(r => `${NAME[r.w].toLowerCase()} ${clock(r.from)}–${clock(r.to)}`).join(', ') || BEST_NONE;
  return {val: V[0].home, label};
}
function eveningHTML(){
  const earned = S.earnFish + S.earnWork, best = bestPlan();
  best.val = Math.max(best.val, earned);   // the plan above is the most the day could give; never show less than was earned
  let rows = `<div></div>${Array.from({length:HOURS},(_,h)=>`<div class="h">${START+h}</div>`).join('')}`;
  for (const w of WATERS){
    rows += `<div>${NAME[w]}</div>`;
    for (let h=0; h<HOURS; h++){
      if (h < TRAVEL[w]){ rows += '<div class="cell na"></div>'; continue; }   // still on the way there: no one could fish it
      const n = S.D.catchT[w][h]; const you = S.presence[w].includes(h);
      rows += `<div class="cell ${n?(n>1?'big':'f'):''} ${you?'you':''}" title="${n ? fishWord(n) : 'пусто'}">${n || ''}</div>`;
    }
  }
  const verdict = earned >= best.val ? 'Лучше было не придумать.' : earned >= HOURS*WAGE ? 'День не зря.' : 'Сегодня дома вышло бы больше.';
  const wd = S.D.weathers || [S.D.weather], wl = wd[wd.length-1];
  const wLine = wl === S.D.weather ? `Погода: ${WEATHER_NAME[S.D.weather]}.` : `Погода: ${WEATHER_NAME[S.D.weather]}, с ${clock(CHANGE_HOUR)} ${WEATHER_NAME[wl]}.`;
  const nb = S.D.nb;
  const nbLine = !nb.w ? 'Михалыч сегодня не выходил.'
    : `Михалыч сидел ${WHERE[nb.w]}${nb.reason === 'empty' ? (nbCaught() ? ' и ушёл, когда перестало клевать' : ' и ушёл пустым')
      : nb.reason === 'full' ? ' и ушёл с полным ведром' : ''}.`;
  return `<div class="title">Итог дня ${S.day}</div>
    <div class="sum"><span>Рыба</span><b>+${S.earnFish} ₽</b><span>Снасти</span><b>+${S.earnWork} ₽</b>
    <span>Всего</span><b>+${earned} ₽</b><span>Если бы весь день снасти</span><b>+${HOURS*WAGE} ₽</b>
    ${best.label === BEST_NONE ? '' : `<span>Лучший вариант: ${best.label}</span><b>+${best.val} ₽</b>`}</div>
    <div class="reveal">${rows}</div>
    <div class="note">Рамка — где вы сидели. Цифры — сколько рыбы попалось бы за час. ${wLine} ${nbLine} ${verdict}</div>
    <div class="note">Всего за ${S.day} ${plural(S.day,'день','дня','дней')}: ${S.money} ₽. Одни снасти дома дали бы ${S.day*HOURS*WAGE} ₽.</div>`;
}
let askRestart = false;   // the evening's 'start again' waits for a second tap
function nextDay(){
  askRestart = false; S.day++; startDay(); save(); render();
}
// a new game: the save is wiped, the title screen and the backstory come again
function restart(){
  askRestart = false;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  newSeason(); save(); render(); showSplash();
}
if (!load()) newSeason();
hush();
// the title screen opens a new game, then the backstory and the first morning; later launches go straight to the saved game
function showSplash(){
  const kb = !!document.activeElement && $('panel').contains(document.activeElement);
  $('splashImg').src = IMG.splash; $('splashGo').disabled = false; $('splash').hidden = false;
  tapLock = performance.now() + TAP_LOCK;
  if (kb) $('splashGo').focus({preventScroll: true});
}
$('splashGo').onclick = () => {
  if (tapsLocked()) return;
  const kb = document.activeElement === $('splashGo');
  $('splash').hidden = true; render();
  if (kb){ const b = $('panel').querySelector('button.primary'); if (b) b.focus({preventScroll: true}); }
};
render(); if (S.phase === 'intro') showSplash();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
