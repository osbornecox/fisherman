// ---------- the pictures and the still layers: caches shared by every scene in the document ----------

}

  DAY: Object.freeze({first: DAY_FIRST, last: DAY_LAST, litFrom: LIT_FROM}),

// ---------- daylight ----------
// The outdoor places are living scenes: the engine (scenes.js, the script before this one) paints each from its clean
// picture in the weather of the hour, lights it for the hour, and lets the clouds, the smoke and the water move. The
// izba is lit below with the engine's light of the hour, the way should_I_lab/art/tools/daytime.py's izba_light does.
const LIVE = new Set(['river', 'lake', 'omut', 'shop', 'home']);   // the outdoor places
LIVE.forEach(p => LiveScenes.preload(p, IMG[p]));   // analysed now, so a place's scene is drawn the moment it is shown
const dayLight = h => LiveScenes.dayLight(h);
const {first: DAY_FIRST, last: DAY_LAST, litFrom: LIT_FROM} = LiveScenes.DAY;   // the bulb over the table is on at 18:00
const lerp3 = (x,y,t) => x.map((v,i)=>v*(1-t)+y[i]*t);
const clamp8 = v => Math.max(0, Math.min(255, Math.round(v)));
const mix3 = (a,b,t) => a.map((v,i)=>clamp8(v*(1-t)+b[i]*t));
const tint3 = (c,m) => c.map((v,i)=>clamp8(v*m[i]));
function pixels(src){
  return new Promise((ok, fail) => { const im = new Image(); im.onload = () => {
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0); ok({c, x, d: x.getImageData(0, 0, c.width, c.height)}); };
    im.onerror = fail; im.src = src; });
}

// The izba from inside is lit the way daytime.py's izba_light does it, and the cuckoo clock and the calendar are
// drawn first, the way izba.py draws them: IMG.izba and IMG.izbaClosed come with no hands, no weights and a clean
// calendar sheet. Keep the numbers here, in daytime.py and in izba.py the same.
const IZ_LIGHT = {overcast:[1,1,1], sun:[1.06,1.03,.95], rain:[.95,.95,.97], downpour:[.84,.85,.88], wind:[1,1,1.01], fog:[.98,.98,.99]};
const ROOM_GAIN = {sun:[.18,.14,.04]}, CURTAIN_GAIN = {sun:.08};   // a sunny midday fills the room, the curtain glows
const GLASS = [41,37,89,105], RIVER = 78, RW = 6;                  // the window glass x0 y0 x1 y1, the river rows in it
const BULB_LIT = [255,238,190], BULB_WARM = [1.10,.98,.80], SHADE_GLOW = [236,172,104];
const INK = [52,48,42], RED = [176,62,44];
const HOUR_HAND = [[0,-3],[2,-3],[3,-2],[3,0],[3,2],[2,3],[0,3],[-2,3],[-3,2],[-3,0],[-3,-2],[-2,-3]];   // tip per hour
const CHAIN = [140,128,100], CHAIN_D = [104,94,74], CONE = [124,104,68], CONE_D = [92,76,52];
const WEIGHTS = [[108,72],[118,78]], FALL = 30;   // chain x and the weight at 6:00, and how far it goes down by evening
const CAL_L = 13, CAL_T = 36, CAL_W = 17;
const WEEKDAY = ['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];   // by getUTCDay(), Sunday first
const glyphs = o => Object.fromEntries(Object.entries(o).map(([k,v]) => [k, v.split(' ')]));
const DIGITS = glyphs({0:'.XXX. XX.XX XX.XX XX.XX XX.XX XX.XX .XXX.', 1:'..XX. .XXX. ..XX. ..XX. ..XX. ..XX. .XXXX',
  2:'.XXX. XX.XX ...XX ..XX. .XX.. XX... XXXXX', 3:'XXXX. ...XX ...XX .XXX. ...XX ...XX XXXX.',
  4:'XX.XX XX.XX XX.XX XXXXX ...XX ...XX ...XX', 5:'XXXXX XX... XXXX. ...XX ...XX XX.XX .XXX.',
  6:'.XXX. XX... XX... XXXX. XX.XX XX.XX .XXX.', 7:'XXXXX ...XX ..XX. ..XX. .XX.. .XX.. .XX..',
  8:'.XXX. XX.XX XX.XX .XXX. XX.XX XX.XX .XXX.', 9:'.XXX. XX.XX XX.XX .XXXX ...XX ...XX .XXX.'});
const FONT3 = glyphs({'П':'XXX X.X X.X X.X X.X', 'Н':'X.X X.X XXX X.X X.X', 'В':'XX. X.X XX. X.X XX.', 'Т':'XXX .X. .X. .X. .X.',
  'С':'XXX X.. X.. X.. XXX', 'Р':'XXX X.X XXX X.. X..', 'Ч':'X.X X.X XXX ..X ..X', 'Б':'XXX X.. XXX X.X XXX'});
// day 1 is Sunday the 15th, then the days go by a real calendar from 15 June; the month is not shown
function dateOf(day){ const t = new Date(Date.UTC(2025, 5, 14 + day)); return [String(t.getUTCDate()), WEEKDAY[t.getUTCDay()], t.getUTCDay() === 0]; }
let izCache = {}, izMask = null;
function izbaScene(open, weather, h, day){
  const key = `${open}/${weather}/${h}/${day}`;
  if (izCache.day !== day) izCache = {day};   // a new day: yesterday's pictures are not needed
  return izCache[key] || (izCache[key] = drawIzba(open, weather, h, day).catch(e => { delete izCache[key]; throw e; }));
}
async function drawIzba(open, weather, h, day){
  izMask = izMask || pixels(IMG.izbaMask);
  const m = (await izMask).d.data, out = await pixels(IMG[open ? 'izba' : 'izbaClosed'][weather]);
  const d = out.d.data, W = out.c.width, H = out.c.height, lt = IZ_LIGHT[weather];
  // izba.py draws in plain colours, then darkens the room towards the edges and lights it for the weather
  const put = (x, y, c) => {
    const dx = (x-65)/75, dy = (y-72)/105, k = 1 - .24*Math.min(1, dx*dx + dy*dy)**1.2, i = (y*W + x)*4;
    for (let j = 0; j < 3; j++) d[i+j] = Math.max(0, Math.min(255, Math.floor(c[j]*k*lt[j])));
  };
  const text = (x, y, s, font, c) => { for (const ch of s){ const g = font[ch];
    g.forEach((row, j) => [...row].forEach((v, i) => { if (v === 'X') put(x+i, y+j, c); })); x += g[0].length + 1; } };
  // the clock: the minute hand up, the hour hand at the hour; the weights go down FALL over the day, a little every
  // hour, so in the evening they still hang clear of the table
  for (let y = 55; y < 59; y++) put(113, y, INK);
  const [ex, ey] = HOUR_HAND[h % 12], n = Math.max(Math.abs(ex), Math.abs(ey));
  for (let i = 0; i <= n; i++) put(113 + Math.round(i*ex/n), 59 + Math.round(i*ey/n), INK);
  for (const [wx, top] of WEIGHTS){
    const bot = top + Math.floor(FALL*(h - DAY_FIRST)/(DAY_LAST - DAY_FIRST));
    for (let y = 67; y < bot; y++) put(wx, y, y % 2 ? CHAIN : CHAIN_D);
    for (let j = 0; j < 8; j++) for (let x = wx-1; x <= wx+1; x++) put(x, bot+j, j % 2 ? CONE_D : CONE);
    put(wx, bot+8, CONE_D);
  }
  // the calendar: the date over the weekday, red on a Sunday
  const [num, wd, sunday] = dateOf(day), col = sunday ? RED : INK;
  text(CAL_L + ((CAL_W - (num.length*6 - 1)) >> 1), CAL_T + 7, num, DIGITS, col);
  text(CAL_L + ((CAL_W - (wd.length*4 - 1)) >> 1), CAL_T + 16, wd, FONT3, col);
  // the light of the hour: the view outside as at the waters, the room after the window
  const L = dayLight(h), src = d.slice(), river = lerp3(L.land, L.sky, .6);
  const lightK = Math.max(0, Math.min(1, ((L.land[0] + L.land[1] + L.land[2])/3 - .55)/.45));   // 0 at dawn and dusk, 1 at noon
  const gain = ROOM_GAIN[weather] || [0,0,0], room = L.land.map((k,i) => k*(1 + gain[i]*lightK));
  const glass = room.map(k => k*(1 + (CURTAIN_GAIN[weather] || 0)*lightK)), [gx0, gy0, gx1, gy1] = GLASS;
  const isView = new Uint8Array(W*H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    const p = y*W + x, i = p*4, view = m[i + (open ? 0 : 1)] > 127, sky = view && m[i+2] > 127;
    let c = [d[i], d[i+1], d[i+2]];
    isView[p] = view;
    if (sky) c = mix3(tint3(c, L.sky), L.glow, Math.min(1, Math.max(0, (y-40)/52) * L.g));
    else if (view && y >= RIVER && y < RIVER + RW) c = mix3(tint3(c, river), L.glow, L.g*.35);
    else if (view) c = tint3(c, L.land);
    else c = tint3(c, x >= gx0 && x <= gx1 && y >= gy0 && y <= gy1 ? glass : room);
    d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2];
  }
  if (h >= LIT_FROM){   // the bulb under the lampshade over the table is on and warms the room around it
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      const p = y*W + x, i = p*4; if (isView[p]) continue;
      const warm = tint3([src[i], src[i+1], src[i+2]], BULB_WARM);
      let c;
      if (x >= 31 && x <= 35 && y >= 18 && y <= 19) c = BULB_LIT;
      else if (x >= 17 && x <= 49 && y >= 4 && y <= 19 && src[i] - src[i+2] > 60) c = mix3(warm, SHADE_GLOW, .35);   // the fabric
      else { const dx = x - 33, dy = (y - 22)*.7; c = mix3([d[i], d[i+1], d[i+2]], warm, .85*Math.exp(-(dx*dx + dy*dy)/(2*55**2))); }
      d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2];
    }
  }
  out.x.putImageData(out.d, 0, 0);
  return out.c.toDataURL();
}
// ---------- end daylight ----------

// ---------- rng ----------
let seed = Math.floor(Math.random()*1e9);
function rnd(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }
function pick(p){ let r=rnd(), a=0; for(let i=0;i<p.length;i++){ a+=p[i]; if(r<a) return i; } return p.length-1; }
function poisson(l){ if(l<=0) return 0; const L=Math.exp(-l); let k=0,p=1; while(true){ p*=rnd(); if(p<=L) return k; k++; } }
function choice(a){ return a[Math.floor(rnd()*a.length)]; }

// ---------- state ----------
let S = null;
function newSeason(){
  S = { day:1, money:0, history:[], phase:'intro' };
}
function genDay(){
  const weather = pick(WEATHER_P);   // the morning
  let later = weather;
  if (weather === 4 || rnd() < CHANGE_P){ const nx = NEXT[weather]; later = nx[pick(nx.map(x=>x[1]))][0]; }
  const weathers = Array.from({length:HOURS}, (_,h)=> h < CHANGE_HOUR ? weather : later);
  const level = {}, catchT = {}, ripple = {}, boil = {}, bubbles = {}, lost = {}, scare = {}, midge = {};
  for (const w of WATERS){
    const a = pick(LEVEL_P[w][weather]), b = later === weather ? a : pick(LEVEL_P[w][later]);
    level[w] = Array.from({length:HOURS}, (_,h)=> h < CHANGE_HOUR ? a : b);
    catchT[w] = []; ripple[w] = []; boil[w] = []; bubbles[w] = []; lost[w] = []; scare[w] = []; midge[w] = [];
    for (let h=0; h<HOURS; h++){
      const lv = level[w][h], sc = rnd() < SCARE, n = poisson(RATE[w][lv]);
      catchT[w].push(sc ? 0 : n); scare[w].push(sc);
      ripple[w].push(rnd() < RIPPLE[lv]); boil[w].push(rnd() < BOIL[lv]); bubbles[w].push(rnd() < BUBBLES[lv]);
      lost[w].push(!sc && rnd() < LOST[lv]);
      midge[w].push(CALM.includes(weathers[h]) && rnd() < MIDGE[lv]);
    }
  }
  // the neighbour: comes at 6-8, leaves after two empty hours or with a full bucket
  const nb = {w:null, arrive:null, leave:null, reason:null, present:Array(HOURS).fill(false), bites:Array(HOURS).fill(0)};
  if (rnd() < NEIGHBOR_P){
    if (rnd() < NEIGHBOR_SMART){ const top = Math.max(...WATERS.map(w=>level[w][0])); nb.w = choice(WATERS.filter(w=>level[w][0]===top)); }
    else nb.w = choice(WATERS);
    nb.arrive = Math.floor(rnd()*3);
    let dry = 0, total = 0;
    for (let h=nb.arrive; h<HOURS; h++){
      nb.present[h] = true;
      const n = scare[nb.w][h] ? 0 : poisson(RATE[nb.w][level[nb.w][h]]);
      nb.bites[h] = n; total += n; dry = n ? 0 : dry+1;
      if (h < HOURS-1 && dry >= 2){ nb.leave = h; nb.reason = 'empty'; break; }
      if (h < HOURS-1 && h >= 4 && total >= 4){ nb.leave = h; nb.reason = 'full'; break; }
    }
  }
  // one rumor per weather period, from the levels at its first hour: until 11:00 and after; if the weather holds,
  // the morning's rumor holds all day. True: the best water and its level, or nowhere when no water bites.
  // Made up: a random level, a random water (nowhere for level 0).
  const rumorAt = h => {
    if (rnd() < RUMOR_TRUE){
      const top = Math.max(...WATERS.map(w=>level[w][h]));
      return top ? {w: choice(WATERS.filter(w=>level[w][h]===top)), lv: top} : {w: null, lv: 0};
    }
    const lv = Math.floor(rnd()*3);
    return lv ? {w: choice(WATERS), lv} : {w: null, lv: 0};
  };
  const rumorA = rumorAt(0), rumorB = later === weather ? rumorA : rumorAt(CHANGE_HOUR);
  const rumor = Array.from({length:HOURS}, (_,h) => h < CHANGE_HOUR ? rumorA : rumorB);
  return { weather, weathers, level, catchT, ripple, boil, bubbles, lost, scare, midge, nb, rumor };
}
function startDay(){
  S.D = genDay();
  S.t = 0; S.loc = 'home'; S.earnFish = 0; S.earnWork = 0; S.fishToday = 0; S.presence = {river:[],omut:[],lake:[]};
  S.dry = 0; S.hoursHere = 0; S.log = []; S.curtain = false; S.seen = null;   // the day starts in the izba with the curtain drawn
  S.phase = 'izba';
  logAdd(0, 'Занавеска задёрнута. В избе полумрак, тикают ходики.');
}

// ---------- helpers ----------
const $ = id => document.getElementById(id);
function clock(t){ return (START + t) + ':00'; }
function fishWord(n){ return `${n} ${plural(n,'рыба','рыбы','рыб')}`; }
function plural(n,a,b,c){ const m=n%10, h=n%100; if(m===1&&h!==11) return a; if(m>=2&&m<=4&&(h<10||h>=20)) return b; return c; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function remaining(){ return HOURS - S.t; }
const SAVE_KEY = 'wait-or-leave-v2';
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({S, seed})); }catch(e){} }
function load(){ try{ const v = JSON.parse(localStorage.getItem(SAVE_KEY)); if(v && v.S){
  if (v.S.phase === 'winter') return false;   // the old 35-day season ended in winter: a new game
  S = v.S; seed = Number.isFinite(v.seed) ? v.seed >>> 0 : Math.floor(Math.random()*1e9);   // a broken seed would hang rnd()
  // saved when the day was 8 or 10 hours long, or before the water had its events (in the 8-hour days too): the
  // evening goes on to a new day, a day in progress starts again without what it had earned
  if (S.D && (!S.D.boil || (S.D.level && S.D.level.river.length !== HOURS))){
    if (S.phase === 'evening') S.day++; else S.money -= (S.earnFish || 0) + (S.earnWork || 0);
    startDay();
  }
  if (S.D && !S.D.weathers) S.D.weathers = Array(HOURS).fill(S.D.weather);  // saved when the weather held all day
  if (S.phase === 'morning'){ S.phase = 'izba'; S.curtain = false; }  // saved before the izba had a curtain and a yard
  delete S.path;   // the route was kept once and never shown
  return true; } }catch(e){} return false; }

}
window.addEventListener('storage', onStorage);

// Taps are ignored for a moment after every new screen: the second tap of a double tap must not press the button

// the weather at the current hour: the morning's until 11:00, then maybe the next one
function nowWeather(){ return S.D.weathers ? S.D.weathers[Math.min(S.t || 0, HOURS-1)] : S.D.weather; }

// ---------- the scene picture ----------
// Two layers lie one on the other, each with a still picture (<img>) and a living scene (<canvas>): a new frame fades
// in over the one shown, then its layer is the one shown. The outdoor places are living scenes; a new hour or a new
// place is a new scene that starts at the time of the one shown, so its clouds and smoke go on from where they were,
// and the scene that has faded out stops. A drawn frame (the izba) leaves the last picture on screen until it is ready.
const FADE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 600;
const IZBA = {izba: true, izbaEvening: true, izbaClosed: false};   // the izba pictures: is the curtain pulled aside
const pic = {front: 0, key: null, seq: 0, fading: null, live: [null, null], first: true};
const layer = i => $(i ? 'bg2' : 'bg');
// layer i gets frame f, a still picture (f.url) or a living scene (f.live) starting at time t; resolves once it shows
function fill(i, f, alt, t){
  const l = layer(i), img = l.querySelector('img'), cv = l.querySelector('canvas');
  l.classList.toggle('top', !!f.top);
  if (pic.live[i]){ pic.live[i].destroy(); pic.live[i] = null; }
  if (f.live){
    img.hidden = true; img.removeAttribute('src'); img.alt = '';
    cv.hidden = false; cv.setAttribute('aria-label', alt);
    return (pic.live[i] = LiveScenes.create(cv, Object.assign({t}, f.live))).ready();
  }
  cv.hidden = true; img.hidden = false; img.alt = alt; img.src = f.url;
  return img.decode ? img.decode() : Promise.resolve();
}
function showPicture(f, alt){

  const live = pic.live[pic.front], t = live ? live.time : 0;   // a new scene goes on from the one shown
  if (pic.first || !FADE){   // the first picture, or no motion wanted: at once
    pic.first = false; pic.fading = null; fill(pic.front, f, alt, t); return;
  }
  const shown = layer(pic.front), i = 1 - pic.front, next = layer(i);
  next.style.transition = 'none'; next.style.opacity = '0'; next.style.zIndex = '2'; shown.style.zIndex = '1';
  const fd = pic.fading = {el: next, started: false, timer: 0};
  const start = () => {
    if (pic.seq !== seq) return;
    fd.started = true;
    next.getBoundingClientRect();   // lay out the transparent layer first, so the change below fades
    next.style.transition = `opacity ${FADE}ms ease`; next.style.opacity = '1';
    fd.timer = setTimeout(() => { if (pic.seq === seq) endFade(); }, FADE + 40);
  };

}
function endFade(){
  const f = pic.fading; if (!f) return;
  clearTimeout(f.timer); f.el.style.transition = 'none'; f.el.style.opacity = '1'; f.el.setAttribute('aria-hidden', 'false');
  const old = pic.front, o = layer(old);
  o.setAttribute('aria-hidden', 'true'); o.querySelector('img').alt = '';
  if (pic.live[old]){ pic.live[old].destroy(); pic.live[old] = null; }   // the scene that faded out stops
  pic.front = 1 - old; pic.fading = null;
}
// the scene at hour t, in the weather of that hour: its key and how it is shown; outdoors a living scene, the izba a
// drawn picture (and its plain picture if drawing fails)
function frame(img, t){
  const w = WEATHERS[S.D.weathers ? S.D.weathers[Math.min(t, HOURS-1)] : S.D.weather], h = START + Math.min(t, HOURS);
  if (img in IZBA){   // the izba at this hour of this day, the evening at 18:00 with the lamp on
    const open = IZBA[img];
    return {key: `${img}/${w}/${h}/${S.day}`, top: true, draw: () => izbaScene(open, w, h, S.day), plain: IMG[open ? 'izba' : 'izbaClosed'][w]};
  }
  if (LIVE.has(img)) return {key: `${img}/${w}/${h}`, live: {place: img, weather: w, hour: h, src: IMG[img]}};
  return null;
}
let sceneKey = null, sceneReady = Promise.resolve();
function setScene(img){
  const alt = NAME[img] || '', top = img in IZBA, f = S.D ? frame(img, S.t) : null;
  sceneReady = Promise.resolve();
  if (!f){ const v = IMG[img], url = typeof v === 'string' ? v : v[WEATHERS[S.D ? nowWeather() : 0]];
    sceneKey = null; showPicture({key: url, url, top}, alt); return; }

  if (f.live){ showPicture(f, alt); return; }
  sceneReady = f.draw().then(url => { if (sceneKey === key) showPicture({key, url, top}, alt); },
                             () => { if (sceneKey === key) showPicture({key, url: f.plain, top}, alt); });
}
// After a screen is shown, the izba's frames the next taps will need are drawn in idle time, one at a time, so they
// are ready to fade in. The living scenes need none of this: the engine draws them at once.
let warmList = [], warmGen = 0;
const whenIdle = fn => window.requestIdleCallback ? requestIdleCallback(fn, {timeout: 1500}) : setTimeout(fn, 120);
function warmUp(){
  const gen = ++warmGen, t = S.t, room = S.curtain ? 'izba' : 'izbaClosed', list = [];
  const at = (img, tt) => { const f = frame(img, Math.min(tt, HOURS)); if (f && f.draw) list.push(f); };
  const trips = dests => dests.filter(canGo).forEach(d => at(d, t + TRAVEL[d]));
  if (S.phase === 'water'){ if (t < HOURS){ at(S.loc, t + 1); at(room, t); } else at('izbaEvening', HOURS); }
  else if (S.phase === 'izba'){ at(S.curtain ? 'izbaClosed' : 'izba', t); at('home', t); at(t + 1 < HOURS ? room : 'izbaEvening', t + 1); }
  else if (S.phase === 'yard'){ at(room, t); trips([...WATERS, 'shop']); }
  else if (S.phase === 'shop'){ trips(WATERS); at(room, t); }
  warmList = list;
  const step = () => { if (gen !== warmGen) return; const f = warmList.shift();
    if (f) f.draw().then(() => whenIdle(step), () => whenIdle(step)); };
  sceneReady.then(() => whenIdle(step));
}
function hud(){
  const left = S.D ? Math.max(0, HOURS - S.t) : 0;   // hours of the day left
  $('hudTime').innerHTML = S.phase==='evening' ? `День ${S.day} · вечер`
    : S.D ? `День ${S.day} · ${clock(Math.min(S.t, HOURS))}<small>до вечера ${left} ч</small>` : `День ${S.day}`;
  $('hudMoney').innerHTML = `${S.money} ₽<small>в копилке</small>`;
}

function moveButtons(){
  const g = document.createElement('div'); g.className='grid';
  // at a water the old man only sits or goes home; from the village any water is open; home is no time away
  const opts = S.loc === 'shop' ? WATERS : [];
  g.style.gridTemplateColumns = `repeat(${opts.length + 1}, minmax(0,1fr))`;
  for (const w of opts){
    g.appendChild(btn(NAME[w], `${TRAVEL[w]} ч`, ()=>go(w), 'secondary', !canGo(w)));
  }
  g.appendChild(btn('Уйти домой', '', walkHome));
  return g;
}

// ---------- render ----------
const FIT = new Set(['izba', 'yard', 'shop', 'water']);   // day screens fit the screen; the backstory and the evening scroll
let shownPhase = null;
function render(){
  const P = $('panel'), hadFocus = !!document.activeElement && P.contains(document.activeElement);
  tapLock = performance.now() + TAP_LOCK;
  hud(); P.innerHTML='';
  $('wrap').classList.toggle('fit', FIT.has(S.phase));
  $('wrap').classList.toggle('eve', S.phase === 'evening');
  $('wrap').classList.toggle('ask', S.phase === 'evening' && askRestart);   // the restart question needs room (--ask)
  if (S.phase !== shownPhase){ shownPhase = S.phase; if (window.scrollTo) scrollTo(0, 0); }   // a new screen starts at the top
  document.querySelector('.hud').style.visibility = S.phase === 'intro' ? 'hidden' : '';
  const add = html => { const d=document.createElement('div'); d.innerHTML=html; while(d.firstChild) P.appendChild(d.firstChild); };
  const actions = document.createElement('div'); actions.className='actions';

  if (S.phase==='intro'){   // the backstory, once, before the very first day
    setScene('story');
    add(`<div class="lines story">
      <p>Река, поля, лес. Среди этой сибирской природы затерялась деревенька.</p>
      <p>Сколько вы живёте уже в ней? 10 лет? Или все 50? Никто уже не помнит, да и не важно.</p>
      <p>А что важно? В этом и суть игры. Понять, что важно, а что нет.</p></div>`);
    actions.appendChild(btn('Начать день', '', ()=>{ startDay(); save(); render(); }, 'primary'));
  }

  else if (S.phase==='izba'){   // at home inside: the curtain, the door, tackle to make, or just sitting
    setScene(S.curtain ? 'izba' : 'izbaClosed');
    const left = remaining();
    add(journal());
    const g = document.createElement('div'); g.className='grid'; g.style.gridTemplateColumns='repeat(2, minmax(0,1fr))';
    g.appendChild(S.curtain ? btn('Задёрнуть занавеску', '', closeCurtain) : btn('Открыть занавеску', '', openCurtain));
    g.appendChild(btn('Выйти из дома', '', goOut));
    g.appendChild(btn('Мастерить снасти', `1 ч · +${WAGE} ₽`, craft, 'secondary', left < 1));
    g.appendChild(btn('Ничего не делать', '1 ч', idle, 'secondary', left < 1));
    actions.appendChild(g);
    actions.appendChild(btn(`Мастерить до вечера · +${left*WAGE} ₽`, '', craftAll, 'link'));
  }

  else if (S.phase==='yard'){   // outside the izba: where to go; back inside costs no time
    setScene('home');
    add(journal());
    const g = document.createElement('div'); g.className='grid'; g.style.gridTemplateColumns='repeat(4, minmax(0,1fr))';
    for (const d of [...WATERS,'shop']) g.appendChild(btn(NAME[d], `${TRAVEL[d]} ч`, ()=>go(d), 'secondary', !canGo(d)));
    actions.appendChild(g);
    actions.appendChild(btn('Домой', '', backInside));
  }

  else if (S.phase==='shop'){
    setScene('shop');
    add(`<div class="meta"><span>${todayCatch()}</span></div>${journal()}`);
    actions.appendChild(moveButtons());
  }

  else if (S.phase==='water'){
    setScene(S.loc);
    const quiet = S.hoursHere === 0 || S.dry == null ? '' : S.dry === 0 ? 'только что клевало' : `тихо ${S.dry} ${plural(S.dry,'час','часа','часов')}`;
    add(`<div class="meta"><span>${todayCatch()}</span><span>${quiet}</span></div>${journal()}`);
    if (S.t >= HOURS) actions.appendChild(btn('Вернуться домой', '', comeHome, 'primary'));   // the day is over here: only home
    else { actions.appendChild(btn('Остаться ещё на час', '', sit, 'primary')); actions.appendChild(moveButtons()); }
  }

  else if (S.phase==='evening'){
    setScene('izbaEvening');   // nowWeather() is the last hour's weather: the evening comes with S.t = HOURS
    add(eveningHTML()); fitEvening();
    actions.appendChild(btn('Лечь спать', '', nextDay, 'primary'));
    if (!askRestart) actions.appendChild(btn('Начать заново', '', ()=>{ askRestart = true; render(); }, 'link'));
    else {   // the second tap: the whole game is wiped; the question stays with the buttons, in sight
      const q = document.createElement('div'); q.className = 'note'; q.textContent = 'Начать всё заново? Дни и деньги не сохранятся.';
      actions.appendChild(q);
      const g = document.createElement('div'); g.className='grid'; g.style.gridTemplateColumns='repeat(2, minmax(0,1fr))';
      g.appendChild(btn('Начать заново', '', restart));
      g.appendChild(btn('Отмена', '', ()=>{ askRestart = false; render(); }));
      actions.appendChild(g);
    }
  }

  P.appendChild(actions);
  scrollLog();
  if (hadFocus){   // a keyboard or screen reader user stays on the buttons: the main one, or the first
    const b = P.querySelector('button.primary:not(:disabled)') || P.querySelector('button:not(:disabled)');
    if (b) b.focus({preventScroll: true});
  }
  announce();
  if (S.D) warmUp();
}
function logAdd(t, text){ S.log.push({t: clock(t), text}); }
function journal(){
  // the time is written only on the first line of each hour; a short screen squeezes the journal down to three lines
  const n = Math.min(3, S.log.length), min = `calc(${(n*1.3).toFixed(1)}em + ${Math.max(0, n-1)*2 + 14}px)`;
  return `<div class="log" id="log" style="min-height:${min}">${S.log.map((e,i)=>`<div><span class="tm">${i && S.log[i-1].t === e.t ? '' : e.t}</span><span>${e.text}</span></div>`).join('')}</div>`;
}
// The journal is drawn anew on every screen, so a screen reader hears its new lines from a lasting region (#say);
// a line the toast has just said is not said twice
let saidLog = null, saidN = 0;
function hush(){ saidLog = S.log || null; saidN = saidLog ? saidLog.length : 0; }   // a loaded game is not read out
function announce(){
  if (!S.log) return;
  if (S.log !== saidLog){ saidLog = S.log; saidN = 0; }   // a new day
  const said = $('toast').classList.contains('show') ? $('toast').textContent : null;
  const fresh = S.log.slice(saidN).map(e => e.text.replace(/<[^>]*>/g, '')).filter(s => s.replace(/\.$/, '') !== said);
  saidN = S.log.length;
  if (fresh.length) $('say').textContent = fresh.join(' ');
}
function scrollLog(){ const el = $('log'); if (el) el.scrollTop = el.scrollHeight; }
// what is seen on the water at the start of hour t
function lookAround(){
  const w = S.loc, D = S.D, t = S.t, nb = D.nb;
  if (nb.w === w && nb.present[t]){
    if (nb.arrive === t && S.hoursHere > 0) logAdd(t, 'Пришёл Михалыч, сел рядом.');
    else if (S.hoursHere === 0) logAdd(t, nb.arrive === t ? 'Михалыч тоже пришёл сюда.' : 'Михалыч уже здесь.');
  }
  // the words follow the hour's weather: still water only in still weather (the chances do not change)
  let seen = false; const wt = nowWeather(), calm = CALM.includes(wt);
  if (D.boil[w][t]){ logAdd(t, 'У камыша раз за разом плещет, мелочь выпрыгивает из воды.'); seen = true; }
  if (D.bubbles[w][t]){ logAdd(t, 'По воде медленно ползёт цепочка мелких пузырьков.'); seen = true; }
  if (D.ripple[w][t]){ logAdd(t, choice([...(calm ? ['По тихой воде тут и там расходятся круги.'] : []),
    'У берега плеснуло, пошли круги.', 'Под берегом тихонько плеснуло.'])); seen = true; }
  if (D.midge[w][t]){ logAdd(t, 'Над водой столбиками вьётся мошкара.'); seen = true; }
  if (!seen) logAdd(t, calm ? 'Вода гладкая, ни всплеска.' : wt === 3 ? 'По воде бежит рябь, всплесков не видно.' : 'Дождь рябит воду, всплесков не видно.');
}
function todayCatch(){ return S.fishToday ? 'Сегодня: ' + fishWord(S.fishToday) : 'Сегодня пусто'; }

// ---------- actions ----------
// time passes wherever the old man is; at 11:00 the weather may step, and he sees it
function advance(n){
  const from = S.t, D = S.D; S.t = Math.min(HOURS, S.t + n);
  if (D.weathers && from < CHANGE_HOUR && S.t >= CHANGE_HOUR && D.weathers[CHANGE_HOUR] !== D.weathers[CHANGE_HOUR-1]){
    const w = D.weathers[CHANGE_HOUR];
    logAdd(CHANGE_HOUR, CHANGE_TEXT[`${D.weathers[CHANGE_HOUR-1]}-${w}`]); logAdd(CHANGE_HOUR, WEATHER_HINT[w]); S.seen = w;
  }
}
// the weather goes into the journal the first time the old man sees it: through the window or outside
function seeWeather(){
  const w = nowWeather();
  if (S.seen === w) return;
  S.seen = w; logAdd(S.t, `<b>${WEATHER_TEXT[w]}</b>`); logAdd(S.t, WEATHER_HINT[w]);
}
function openCurtain(){ if (busy) return; S.curtain = true; logAdd(S.t, 'Открыл занавеску.'); seeWeather(); save(); render(); }
function closeCurtain(){ if (busy) return; S.curtain = false; logAdd(S.t, 'Задёрнул занавеску.'); save(); render(); }
function goOut(){ if (busy) return; S.phase = 'yard'; logAdd(S.t, 'Вышел во двор.'); seeWeather(); save(); render(); }
function backInside(){ if (busy) return; S.phase = 'izba'; logAdd(S.t, 'Зашёл в избу.'); save(); render(); }
// 18:00 caught him away from home: the only way is back to the izba for the evening
function comeHome(){
  if (busy) return;
  S.loc = 'home'; endDay();
}
// an hour at home: making tackle pays the wage, sitting pays nothing
function homeHour(paid){
  if (busy || S.t >= HOURS) return;
  if (paid){ S.money += WAGE; S.earnWork += WAGE; }
  logAdd(S.t + 1, paid ? `Мастерил снасти, +${WAGE} ₽.`
    : choice(S.curtain ? ['Посидел у окна.', 'Попил чаю, посмотрел в окно.'] : ['Посидел в полумраке, послушал ходики.', 'Посидел просто так.']));
  advance(1);
  if (S.t >= HOURS) return endDay();
  save(); render();
}
function craft(){ homeHour(true); }
function idle(){ homeHour(false); }
function craftAll(){
  if (busy) return;
  const r = remaining(), pay = r*WAGE;
  S.money += pay; S.earnWork += pay;
  advance(r); endDay();
}
// from a water or the village straight back to the izba; the day goes on there
function walkHome(){
  if (busy) return;
  if (S.t >= HOURS) return comeHome();   // the day is already over
  logAdd(S.t, WATERS.includes(S.loc) ? 'Смотал удочки, пошёл домой.' : 'Пошёл домой.');
  S.loc = 'home'; S.phase = 'izba'; S.dry = 0; S.hoursHere = 0;
  save(); render();
}
// a trip must leave time to fish: a water is reached before 18:00, and the village only while a water can still be
// reached after it (until 15:00)
function canGo(dest){ return S.t + TRAVEL[dest] + (dest === 'shop' ? Math.min(...WATERS.map(w=>TRAVEL[w])) : 0) < HOURS; }
function go(dest){
  if (busy || WATERS.includes(S.loc) || !canGo(dest)) return;
  advance(TRAVEL[dest]); S.loc = dest; S.dry = null; S.hoursHere = 0;
  if (dest === 'shop'){ logAdd(S.t, 'Деревня. Бабки на лавке у магазина.'); rumorLines().forEach(x=>logAdd(S.t, x)); S.phase='shop'; }
  else { logAdd(S.t, `${NAME[dest]}. Закинул удочку.`); S.phase='water'; lookAround(); }
  save(); render();
}
function rumorLines(){
  const {w, lv} = S.D.rumor[Math.min(S.t, HOURS-1)];
  const a = lv===2 && w ? `Баба Нюра: «Колька только что ${WHERE[w]} во какую рыбину взял!»`
          : lv===1 && w ? `Баба Нюра: «Говорят, ${WHERE[w]} клюёт помаленьку».`
          : S.t < CHANGE_HOUR ? 'Баба Нюра: «Говорят, нигде не клюёт. Петрович с утра сидит зазря».'
                              : 'Баба Нюра: «Говорят, нигде не клюёт, Петрович весь день просидел зазря».';
  const b = choice(['Баба Валя: «Да брешут».','Баба Валя: «Ну-ну».','Баба Валя: «Сходите да проверьте».','Баба Валя молча кивает.']);
  return [a, b];
}
// the neighbour caught something today (his bites stay 0 after he leaves)
function nbCaught(){ return S.D.nb.bites.some(n => n > 0); }
let busy = false;
function sit(){
  if (busy || S.t >= HOURS) return; busy = true;
  const w = S.loc, h = S.t, n = S.D.catchT[w][h];
  S.presence[w].push(h);
  $('panel').classList.add('busy');   // no taps while the hour passes; the screen stays as it is
  setTimeout(()=>{
    const D = S.D, nb = D.nb;
    if (D.scare[w][h]) logAdd(h+1, 'У берега мелькнула большая тень, мелочь брызнула врассыпную.');
    // a quiet hour is one with no fish, no fish lost and nothing scared: a lost fish means it bites,
    // a scare says nothing about the place (S.dry is null until the first hour that counts)
    if (n){ const sum = n*PRICE; S.money += sum; S.earnFish += sum; S.fishToday += n;
      const what = `${n > 1 ? fishWord(n) : 'Рыба'} +${sum} ₽`; toast(what); logAdd(h+1, `<b>${what}</b>`); S.dry = 0; }
    else if (D.lost[w][h]){ toast('Сорвалась'); S.dry = 0; }
    else if (D.scare[w][h]) toast('Пусто');
    else { toast('Тихо'); logAdd(h+1, 'Тихо.'); S.dry = (S.dry || 0) + 1; }
    if (D.lost[w][h]) logAdd(h+1, 'Клюнуло, но рыба сорвалась.');
    if (nb.w === w && nb.present[h]){
      logAdd(h+1, nb.bites[h] ? 'У Михалыча клюнуло.' : 'У Михалыча пусто.');
      if (nb.leave === h) logAdd(h+1, nb.reason === 'full' ? 'Михалыч уходит с полным ведром.'
        : nbCaught() ? 'Михалыч сматывает удочки: «Всё, кончился клёв».' : 'Михалыч сматывает удочки: «Пустое дело».');
    }
    advance(1); S.hoursHere++;
    if (S.t < HOURS) lookAround();
    else logAdd(S.t, 'Вечереет, пора домой.');   // the day is over here: the screen offers only the way home
    busy = false; $('panel').classList.remove('busy');
    save(); render();
  }, 750);
}
function endDay(){
  const earned = S.earnFish + S.earnWork;
  S.history.push({day:S.day, earned, hours:HOURS});   // the day's length: the evening counts crafting alone day by day
  S.phase = 'evening'; save(); render();
}
// the best the day could give, knowing every hour: the moves the game has (an hour of tackle at home, a trip to a
// water that earns nothing on the way, an hour of fishing, the free walk home), as many trips as pay.
// V[t][p] is the most from hour t on, at home or at a water; ties keep the old man at home or on the same water.
const BEST_NONE = 'весь день снасти';
function bestPlan(){
  const C = S.D.catchT, V = [], how = [];
  for (let t = HOURS; t >= 0; t--){
    V[t] = {}; how[t] = {};
    if (t === HOURS){ V[t].home = 0; for (const w of WATERS) V[t][w] = 0; continue; }
    V[t].home = WAGE + V[t+1].home; how[t].home = 'craft';
    for (const w of WATERS) if (t + TRAVEL[w] < HOURS && V[t + TRAVEL[w]][w] > V[t].home){ V[t].home = V[t + TRAVEL[w]][w]; how[t].home = w; }
    for (const w of WATERS){
      const sit = C[w][t]*PRICE + V[t+1][w];
      if (sit >= V[t].home){ V[t][w] = sit; how[t][w] = 'sit'; } else { V[t][w] = V[t].home; how[t][w] = 'home'; }
    }
  }
  const runs = []; let t = 0, p = 'home';   // walk the best plan and gather its fishing hours
  while (t < HOURS){
    const m = how[t][p];
    if (p === 'home'){ if (m === 'craft') t++; else { t += TRAVEL[m]; p = m; } }
    else if (m === 'home') p = 'home';
    else { const r = runs[runs.length-1];
      if (r && r.w === p && r.to === t) r.to++; else runs.push({w: p, from: t, to: t+1}); t++; }
  }
  // a run stays on one line (.run) and its hours never break (.hrs), so a long plan breaks after its commas
  const label = runs.map(r => `<span class="run">${NAME[r.w].toLowerCase()} <span class="hrs">${clock(r.from)}–${clock(r.to)}</span></span>`).join(', ') || BEST_NONE;
  return {val: V[0].home, label};
}
function eveningHTML(){
  const earned = S.earnFish + S.earnWork, best = bestPlan();
  best.val = Math.max(best.val, earned);   // the plan above is the most the day could give; never show less than was earned
  let rows = `<div></div>${Array.from({length:HOURS},(_,h)=>`<div class="h">${START+h}</div>`).join('')}`;
  for (const w of WATERS){
    rows += `<div>${NAME[w]}</div>`;
    for (let h=0; h<HOURS; h++){
      if (h < TRAVEL[w]){ rows += '<div class="cell na"></div>'; continue; }   // still on the way there: no one could fish it
      const n = S.D.catchT[w][h]; const you = S.presence[w].includes(h);
      rows += `<div class="cell ${n?(n>1?'big':'f'):''} ${you?'you':''}" title="${n ? fishWord(n) : 'пусто'}">${n || ''}</div>`;
    }
  }
  const verdict = earned >= best.val ? 'Лучше было не придумать.' : earned >= HOURS*WAGE ? 'День не зря.' : 'Сегодня дома вышло бы больше.';
  const wd = S.D.weathers || [S.D.weather], wl = wd[wd.length-1];
  const wLine = wl === S.D.weather ? `Погода: ${WEATHER_NAME[S.D.weather]}.` : `Погода: ${WEATHER_NAME[S.D.weather]}, с ${clock(CHANGE_HOUR)} ${WEATHER_NAME[wl]}.`;
  const nb = S.D.nb;
  const nbLine = !nb.w ? 'Михалыч сегодня не выходил.'
    : `Михалыч сидел ${WHERE[nb.w]}${nb.reason === 'empty' ? (nbCaught() ? ' и ушёл, когда перестало клевать' : ' и ушёл пустым')
      : nb.reason === 'full' ? ' и ушёл с полным ведром' : ''}.`;
  // crafting alone over all the days, each day by its own length: days saved before the length was kept had 10 hours
  const homeAll = S.history.reduce((s, e) => s + (e.hours || 10)*WAGE, 0);
  return `<div class="title">Итог дня ${S.day}</div>
    <div class="sum"><span>Рыба</span><b>+${S.earnFish} ₽</b><span>Снасти</span><b>+${S.earnWork} ₽</b>
    <span>Всего</span><b>+${earned} ₽</b><span>Если бы весь день снасти</span><b>+${HOURS*WAGE} ₽</b>
    ${best.label === BEST_NONE ? '' : `<span class="best">Лучший вариант: ${best.label}</span><b>+${best.val} ₽</b>`}</div>
    <div class="reveal" style="--hours:${HOURS}">${rows}</div>
    <div class="note">Рамка — где вы сидели. Цифры — сколько рыбы попалось бы за час. ${wLine} ${nbLine} ${verdict}</div>
    <div class="note">Всего за ${S.day} ${plural(S.day,'день','дня','дней')}: ${S.money} ₽. Одни снасти дома дали бы ${homeAll} ₽.</div>`;
}
// The evening keeps room (--eve) for the best plan in two lines; a longer plan gets the room of its lines past two,
// so the whole hour grid stays above the buttons. Measured, as the lines depend on the width and the font: again
// when the window changes size and when the font has loaded.
function fitEvening(){
  if (S.phase !== 'evening') return;
  const best = document.querySelector('.sum .best'), line = document.querySelector('.sum > span');
  $('wrap').style.setProperty('--eve-more', best ? `${Math.max(0, best.offsetHeight - 2*line.offsetHeight)}px` : '0px');
}
addEventListener('resize', fitEvening);
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', fitEvening);
let askRestart = false;   // the evening's 'start again' waits for a second tap
function nextDay(){
  askRestart = false; S.day++; startDay(); save(); render();
}
// a new game: the save is wiped, the title screen and the backstory come again
function restart(){
  askRestart = false;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  newSeason(); save(); render(); showSplash();
}
if (!load()) newSeason();
hush();
// the title screen opens a new game, then the backstory and the first morning; later launches go straight to the saved game
function showSplash(){
  const kb = !!document.activeElement && $('panel').contains(document.activeElement);
  $('splashImg').src = IMG.splash; $('splashGo').disabled = false; $('splash').hidden = false;
  tapLock = performance.now() + TAP_LOCK;
  if (kb) $('splashGo').focus({preventScroll: true});
}
$('splashGo').onclick = () => {
  if (tapsLocked()) return;
  const kb = document.activeElement === $('splashGo');
  $('splash').hidden = true; render();
  if (kb){ const b = $('panel').querySelector('button.primary'); if (b) b.focus({preventScroll: true}); }
};
render(); if (S.phase === 'intro') showSplash();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
